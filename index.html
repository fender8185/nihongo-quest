      <div class="q-instr">先看一遍，接著會用幾種方式考這個字。</div>
      <div class="preview">
        <div class="word jp">${esc(jaPlain(v.w))}</div>
        ${reading ? `<div class="reading jp">${esc(reading)}</div>` : ''}
        <div class="meaning">${esc(v.m)}</div>
        ${v.p ? `<div class="mt-1">${posChip(v.p, v.posLabel)}</div>` : ''}
        ${vocabExamples(v).map(e => exampleHtml(e.ex, e.exZh)).join('')}
      </div>
    </div>
    <div class="pr-actions pr-next-sticky">
      <div class="left">
        <button type="button" class="btn btn-sm btn-ghost" data-act="replay" title="播放（R）">${icon('speaker')}<span>發音</span></button>
        <button type="button" class="btn btn-sm btn-ghost" data-act="toggle-furi" title="切換振假名（F）">振假名：${FURI_LABEL[furiState()]}</button>
        <button type="button" class="btn btn-sm btn-ghost" data-act="preview-known" title="這個字我已經會了：標成已熟練、跳過它的題目，約六週後再確認">我會了</button>
      </div>
      <div class="right">
        <button type="button" class="btn btn-primary" data-act="preview-go" id="btnNext">開始作答 <span class="kbd" style="background:transparent;border-color:currentColor;color:inherit">Enter</span></button>
      </div>
    </div>`;
}

// 假名拼字 / 配對 are answered by tapping, not by picking one of four options. They still end in answerCurrent():
// option 0 is the correct text, option 1 receives what the learner produced when it was wrong.
function customInteractionHtml(e, answered) {
  const q = e.q;
  if (q.custom === 'v-spell') {
    const used = e.spell || [];
    const typed = used.map(i => q.tiles[i]).join('');
    return `<div class="spell">
      <div class="spell-out jp ${answered ? (e.chosen === q.answer ? 'ok' : 'bad') : ''}">${esc(typed)}<span class="caret"></span></div>
      <div class="spell-tiles">${q.tiles.map((ch, i) => `<button type="button" class="spell-tile jp" data-act="spell-tap" data-i="${i}" data-ch="${esc(ch)}" ${used.includes(i) || answered ? 'disabled' : ''}>${esc(ch)}</button>`).join('')}</div>
      ${answered ? '' : `<div class="row-wrap mt-2"><button type="button" class="btn btn-sm btn-ghost" data-act="spell-back" ${used.length ? '' : 'disabled'}>退一格</button><span class="small muted">${typed.length} / ${[...q.options[0].text].length}</span><button type="button" class="btn btn-sm btn-ghost" data-act="custom-giveup">我不會，看答案</button></div>`}
    </div>`;
  }
  if (q.custom === 'v-match') {
    const m = e.match || { sel: null, matched: [], wrong: 0 };
    const pairOf = (w) => q.pairs.find(p => p[0] === w);
    return `<div class="match">
      <div class="match-col">${q.words.map(w => `<button type="button" class="match-word jp ${m.matched.includes(w) ? 'matched' : ''} ${m.sel === w ? 'selected' : ''} ${m.flash && m.flash.w === w ? 'wrong-flash' : ''}" data-act="match-word" data-w="${esc(w)}" ${m.matched.includes(w) || answered ? 'disabled' : ''}>${esc(w)}</button>`).join('')}</div>
      <div class="match-col">${q.meanings.map(mm => { const done = q.pairs.some(p => p[1] === mm && m.matched.includes(p[0])); return `<button type="button" class="match-meaning ${done ? 'matched' : ''} ${m.flash && m.flash.m === mm ? 'wrong-flash' : ''}" data-act="match-meaning" data-m="${esc(mm)}" ${done || answered ? 'disabled' : ''}>${esc(mm)}</button>`; }).join('')}</div>
      ${answered ? '' : `<div class="row between small muted" style="grid-column:1/-1"><span>${m.wrong ? `錯了 ${m.wrong} 次` : m.sel ? `已選「${esc(m.sel)}」，點它的意思` : '點一個單字'}</span><button type="button" class="btn btn-sm btn-ghost" data-act="custom-giveup">我不會，看答案</button></div>`}
    </div>`;
  }
  return '';
}
function finishCustom(e, ok, produced) {
  const q = e.q;
  if (!ok) q.options[1].text = produced;
  answerCurrent(ok ? 0 : 1);
}

function srsBadge(key) {
  const r = srsGet(key);
  if (!r) return '<span class="chip chip-accent">新</span>';
  return `<span class="row" style="gap:6px">${srsDots(r.b)}</span>`;
}

function feedbackHtml(e) {
  const q = e.q;
  const ok = e.chosen === q.answer;
  const right = q.options[q.answer];
  const full = q.fullJp && (q.fmt.startsWith('g-') || q.fmt === 'v-cloze' || q.fmt === 'm-card') ? `<div class="fb-full jp">${furi(q.fullJp)} <button type="button" class="btn btn-sm btn-ghost btn-icon" data-act="speak-full" title="朗讀">${icon('speaker')}</button></div>${q.zhText ? `<div class="small muted">${esc(q.zhText)}</div>` : ''}` : '';
  // other vocabulary formats: the word's example sentence, with its own play button (so it is not buried in the note text)
  const example = q.kind === 'v' && q.item && q.item.ex && q.fmt !== 'v-cloze' ? exampleHtml(q.item.ex, q.item.exZh, 'mt-2') : '';
  const why = example ? String(q.why || '').replace(/\n- 例：[^\n]*/g, '') : q.why;
  const cur = q.key ? state.srs[q.key] : null;
  const srsInfo = e.srs ? `<span>${srsDots(e.srs.rec.b)}</span><span>${srsLevelLabel(e.srs.rec, q.key)}・${dueLabel(e.srs.rec)}</span>`
    : e.encore && cur ? `<span>${srsDots(cur.b)}</span><span>${srsLevelLabel(cur, q.key)}・這次不影響排程</span>` : '';
  const mistake = !ok && q.kind !== 'x' && !e.slip ? '<span>已加入錯題本</span>' : '';
  const slip = e.slip ? '<span class="chip">手滑，不算</span>' : (!ok && e.undo ? '<button type="button" class="btn btn-sm btn-ghost" data-act="slip" title="選錯鍵、看錯行：不進錯題本，排程維持原狀">手滑，不算</button>' : '');
  const mNote = e.mistakeDone ? '<span class="chip chip-ok">已移出錯題本</span>' : '';
  return `
    <div class="feedback ${ok ? 'ok' : 'bad'}">
      <div class="fb-head ${ok ? 'ok' : 'bad'}">${ok ? icon('check') + '<span>答對了</span>' : icon('cross') + `<span>答錯了，正確答案是「<span class="jp">${q.kanaOptions ? `${esc(jaPlain(right.text))}（${esc(q.optKana[right.text])}）` : right.jp ? optionHtml(q, right) : esc(right.text)}</span>」</span>`}</div>
      ${full}${example}
      ${why ? `<div class="fb-why mt-2">${md(why)}</div>` : ''}
      <div class="fb-meta">${q.point ? `<span class="chip">考點：${esc(q.point)}</span>` : ''}${srsInfo}${mistake}${slip}${mNote}${q.kind === 'v' && q.key && ok && cur && srsLevelLabel(cur, q.key) !== '已熟練' ? `<button type="button" class="btn btn-sm btn-ghost" data-act="vocab-known" data-key="${esc(q.key)}">這個字我已經會了</button>` : ''}</div>
      <div id="aiExplainBox"></div>
    </div>`;
}

function answerCurrent(i) {
  const e = currentEntry();
  if (!e || e.done) return;
  const q = e.q;
  if (i < 0 || i >= q.options.length) return;
  e.done = true; e.chosen = i;
  const ok = i === q.answer;
  SESSION.lastFmt = q.fmt;
  if (!ok && !e.encore && !e.requeued) {   // kept so 「手滑，不算」 can put everything back
    const m0 = state.mistakes.find(x => (q.key && x.key === q.key) || x.prompt === (q.mistakePrompt || q.plainStem || ''));
    e.undo = { srs: q.key && state.srs[q.key] ? JSON.parse(JSON.stringify(state.srs[q.key])) : null, mistake: m0 ? JSON.parse(JSON.stringify(m0)) : null, mistakesLen: state.mistakes.length, today: Object.assign({}, state.today) };
  }
  if (['v', 'g', 'l', 'r', 'k'].includes(q.kind) && !e.encore) {
    e.srs = srsAnswer(q.key, ok);
    if (e.srs.isNew) SESSION.stats.newCount++;
  }
  if (q.kind === 'v' && q.fmt && q.fmt.startsWith('v-') && !e.requeued) recordFormat(state.srs[q.key], q.fmt, ok);   // a 再練一次 copy shows the answer first: not proof
  if (q.kind === 'g' && q.item && (q.item.t || 'choice') === 'choice' && q.fmt && !e.requeued) recordFormat(state.srs[q.key], q.fmt, ok, 'gf');
  if (e.srs && e.srs.isNew && q.kind === 'v' && !e.requeued) scheduleEncores(e, ok);
  if (q.fmt) {
    const f = state.statsFmt[q.fmt] || (state.statsFmt[q.fmt] = { ok: 0, ng: 0 });
    if (ok) f.ok++; else f.ng++;
  }
  const topic = q.kind === 'g' ? unitById(q.unit).short : q.kind === 'v' ? `單字「${jaPlain(q.item.w)}」` : q.kind === 'k' ? `漢字「${q.item.k}」` : q.kind === 'l' ? '聽力' : q.kind === 'r' ? '閱讀' : null;
  recordAction(q.kind === 'v' || q.kind === 'k' ? 'v' : q.kind === 'g' ? 'g' : 'q', topic);
  recordAccuracy(ok);
  if (ok) {
    SESSION.stats.correct++;
    const m = onCorrectForMistake(q);
    if (m && m.mastered) e.mistakeDone = true;
  } else {
    SESSION.stats.wrong++;
    addMistake(q, jaPlain(q.options[i].text));
    if (!e.requeued && !e.encore) {
      const at = Math.min(SESSION.entries.length, SESSION.idx + 3 + Math.floor(Math.random() * 3));
      const again = { item: e.item, mistake: e.mistake, requeued: true };
      if (q) again.q = requeueQuestion(q, shuffle(q.options));
      SESSION.entries.splice(at, 0, again);
    }
  }
  SESSION.results.push({ key: q.key, ok, q, chosen: i });
  saveState();
  renderPractice();
  if (state.settings.autoSpeak) {
    const text = q.fmt === 'v-meaning' || q.fmt === 'v-recall' || q.fmt === 'v-listen' || q.fmt === 'v-reading' || q.fmt === 'v-kanji' ? q.speakWord : q.fullJp;
    if (text) speak(text, speakOpts(q, text));
  }
}
function nextQuestion() {
  const e = currentEntry();
  if (!e || !e.done) return;
  SESSION.idx++;
  if (SESSION.idx < SESSION.entries.length) prepareEntry(SESSION.idx);
  renderPractice();
  window.scrollTo({ top: 0 });
}
function exitPractice() {
  stopSpeaking();
  const answered = SESSION ? SESSION.results.length : 0;
  if (SESSION && answered > 0 && SESSION.idx < SESSION.entries.length) { SESSION.idx = SESSION.entries.length; renderPractice(); return; }
  SESSION = null;
  document.body.classList.remove('practicing');
  go(lastMainRoute || '#/today');
  Sync.flushDeferred();
}

function renderSummary(view) {
  const s = SESSION;
  const n = s.results.length;
  const acc = n ? Math.round(s.stats.correct / n * 100) : 0;
  const wrongKeys = new Map();
  s.results.filter(r => !r.ok).forEach(r => { if (!wrongKeys.has(r.q.mistakePrompt)) wrongKeys.set(r.q.mistakePrompt, r); });
  const goal = state.settings.dailyGoal;
  const todayN = dayTotal(state.dailyLogs[todayStr()]);
  const wrongList = [...wrongKeys.values()].map(r => `<div class="list-item"><div class="grow"><div class="jp">${furi(tidyPrompt(r.q.mistakePrompt || ''))}</div><div class="small muted">正確：<span class="jp">${esc(jaPlain(r.q.options[r.q.answer].text))}</span>・你選：<span class="jp">${esc(jaPlain(r.q.options[r.chosen].text))}</span></div></div></div>`).join('');
  view.innerHTML = `
    <div class="pr-top"><button type="button" class="btn btn-ghost btn-icon" data-act="close-summary" aria-label="關閉">${icon('close')}</button><div class="grow"></div></div>
    <div class="card">
      <div class="row between" style="align-items:flex-start">
        <div>
          <div class="page-title">${n ? '完成了' : '已結束'}</div>
          <div class="page-sub">${esc(s.title)}・作答 ${n} 題・正確率 ${acc}%</div>
        </div>
        ${ringHtml(Math.min(1, todayN / Math.max(1, goal)), `<b>${todayN}</b><span class="tiny muted">/ ${goal}</span>`)}
      </div>
      <div class="grid grid-4 mt-4">
        <div class="stat"><span class="stat-v">${s.stats.correct}</span><span class="stat-l">答對</span></div>
        <div class="stat"><span class="stat-v">${s.stats.wrong}</span><span class="stat-l">答錯</span></div>
        <div class="stat"><span class="stat-v">${s.stats.newCount}</span><span class="stat-l">新學</span></div>
        <div class="stat"><span class="stat-v">${Math.max(1, Math.round((Date.now() - s.startedAt) / 60000))}</span><span class="stat-l">分鐘</span></div>
      </div>
      ${todayN >= goal ? '<div class="banner mt-4">今天的目標達成了。答對的題目會在幾天後再出現，答錯的會優先複習。</div>' : `<div class="hint mt-4">今天還差 ${goal - todayN} 題達成目標。</div>`}
      <div class="row-wrap mt-4">
        <button type="button" class="btn btn-primary" data-act="again">再練一組</button>
        ${wrongKeys.size ? '<button type="button" class="btn" data-act="retry-wrong">重練答錯的題目</button>' : ''}
        <button type="button" class="btn btn-ghost" data-act="close-summary">回到首頁</button>
      </div>
    </div>
    ${wrongKeys.size ? `<div class="card"><div class="card-head"><div class="card-title">這次答錯的題目</div><span class="chip">${wrongKeys.size}</span></div><div class="list">${wrongList}</div></div>` : ''}`;
}

function ringHtml(ratio, inner, size = 96) {
  const r = 42; const c = 2 * Math.PI * r;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--bg-sunken)" stroke-width="9"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="${ratio >= 1 ? 'var(--ok)' : 'var(--accent)'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - clamp(ratio, 0, 1))}"/></svg><div class="ring-txt"><div>${inner}</div></div></div>`;
}

// report a bad item: hide it from rotation (built-in) or delete it (custom)
function reportCurrentItem() {
  const e = currentEntry();
  if (!e || !e.q || !e.q.item) return;
  const it = e.q.item;
  if (!confirm('把這題移出題庫？之後不會再出現（可以在設定 → 資料中還原）。')) return;
  if (it.builtin) { if (!state.hidden.includes(it.id)) state.hidden.push(it.id); }
  else if (it.kind === 'g') state.customGrammar = state.customGrammar.filter(g => g.id !== it.id);
  else state.vocab = state.vocab.filter(v => v.id !== it.id);
  delete state.srs[it.key];
  state.mistakes = state.mistakes.filter(m => m.key !== it.key);
  saveState();
  buildRegistry();
  SESSION.entries = SESSION.entries.filter((x, i) => i <= SESSION.idx || !x.item || x.item.key !== it.key);
  toast('已移出題庫');
  nextQuestion();
}

  { id: 'today', label: '今日', icon: 'today', route: '#/today' },
  { id: 'course', label: '課程', icon: 'course', route: '#/course' },
  { id: 'vocab', label: '單字', icon: 'vocab', route: '#/vocab' },
  { id: 'stats', label: '學習分析', icon: 'chart', route: '#/stats' },
  { id: 'exam', label: '模擬考', icon: 'exam', route: '#/exam' },

  { id: 'tools', label: '工具與 AI', icon: 'tools', route: '#/tools' }
];
let lastMainRoute = '#/today';

function syncChipLabel() {
  switch (Sync.status) {
    case 'idle': {
      const t = Sync.meta && Sync.meta.lastSyncedAt ? new Date(Sync.meta.lastSyncedAt) : null;
      return t ? `已同步 ${pad2(t.getHours())}:${pad2(t.getMinutes())}` : '已登入';
    }
    case 'pending': case 'syncing': return '同步中';
    case 'error': return '同步失敗';
    default: return '未登入';
  }
}
function renderSyncChip() {
  const html = `<span class="sync-chip is-${Sync.status}" data-act="sync-open" title="${Sync.status === 'error' ? esc(Sync.lastError || '') : '雲端同步'}">${syncChipLabel()}</span>`;
  ['sideSync', 'syncChip'].forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = html; });
}

function go(hash) {
  if (location.hash === hash) route();
  else location.hash = hash;
}
function currentRoute() {
  const h = (location.hash || '#/today').replace(/^#\/?/, '');
  const [path, query] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  const params = {};
  (query || '').split('&').filter(Boolean).forEach(kv => { const [k, v] = kv.split('='); params[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
  return { name: parts[0] || 'today', parts, params };
}

function route() {
  const r = currentRoute();
  const view = document.getElementById('view');
  const tip = document.getElementById('chartTip');
  if (tip) tip.classList.remove('show');
  if (r.name !== 'practice') { document.body.classList.remove('practicing'); }
  if (r.name === 'practice') { renderPractice(); return; }
  if (r.name === 'exam' && r.parts[1] === 'run') { renderExamRunner(); return; }
  lastMainRoute = location.hash || '#/today';
  settingsDirty = false;
  closeModal(true);
  renderNav(r.name === 'course' ? 'course' : r.name);
  try {
    if (r.name === 'today') renderToday(view);
    else if (r.name === 'course') { if (r.parts[1] === 'intro') renderIntro(view); else if (r.parts[1]) renderUnit(view, r.parts[1], r.params.tab || 'lesson'); else renderCourse(view); }
    else if (r.name === 'vocab') renderVocab(view, r.parts[1] || 'cards', r.params);
    else if (r.name === 'mistakes') renderMistakes(view, r.params);
    else if (r.name === 'exam') renderExam(view, r.parts[1] || '', r.params);
    else if (r.name === 'tools') renderTools(view, r.params);
    else if (r.name === 'stats') renderStats(view);
    else renderToday(view);
  } catch (e) {
    console.error(e);
    view.innerHTML = `<div class="card"><div class="card-title">這個頁面出錯了</div><p class="muted small">${esc(e.message)}</p><button class="btn" data-act="nav" data-route="#/today">回到首頁</button></div>`;
  }

}

function closeModal(fromRoute) {

function applyTheme() {
  const t = state.settings.theme || 'dark';
  const resolved = t === 'auto' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t;
  document.documentElement.setAttribute('data-theme', resolved);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', resolved === 'light' ? '#f5f6f8' : '#0e0f13');
}

function furiState() { return !state.settings.furigana ? 'off' : (state.settings.furiMode === 'smart' ? 'smart' : 'all'); }

      <button type="button" class="list-item clickable" style="border:0;background:none;width:100%;text-align:left" data-act="settings">${icon('settings')}<span>設定</span></button></div>`, { width: 420 }),
  'close-modal': () => closeModal(),
  'modal-back': (el, ev) => { if (ev.target === el) closeModal(); },
  'toggle-furi': () => toggleFurigana(),
  'start-daily': (el) => startSession('daily', { size: Number(el.dataset.size) || undefined }),
  'start-unit': (el) => startSession('unit', { unit: el.dataset.unit, title: `${unitById(el.dataset.unit).short}・單元練習` }),
  'start-vocab': (el) => startSession('vocab', { filter: el.dataset.filter || 'all' }),
  'start-mistakes': () => startSession('mistakes'),

  next: () => nextQuestion(),

  slip: () => {   // 「手滑，不算」: the answer was a mis-tap, not a gap — schedule, notebook and stats go back to before it
    const e = currentEntry(); if (!e || !e.done || e.slip || !e.undo) return;
    const q = e.q, u = e.undo;
    if (q.key) { if (u.srs) state.srs[q.key] = u.srs; else delete state.srs[q.key]; }
    state.today = u.today;
    if (u.mistake) { const i = state.mistakes.findIndex(x => x.id === u.mistake.id); if (i >= 0) state.mistakes[i] = u.mistake; }
    else if (state.mistakes.length > u.mistakesLen) state.mistakes.shift();
    const f = state.statsFmt[q.fmt]; if (f && f.ng > 0) f.ng--;
    if (state.recent.length) state.recent.pop();
    if (e.srs && e.srs.isNew) SESSION.stats.newCount = Math.max(0, SESSION.stats.newCount - 1);
    SESSION.stats.wrong = Math.max(0, SESSION.stats.wrong - 1);
    SESSION.entries = SESSION.entries.filter((x, i) => i <= SESSION.idx || !(x.requeued && x.item === e.item));
    const last = SESSION.results[SESSION.results.length - 1]; if (last && last.q === q) SESSION.results.pop();
    e.slip = true; e.srs = null; e.mistakeDone = false; delete e.undo;
    saveState(); renderPractice(); toast('這題不算，排程維持原狀');
  },
  'exit-practice': () => exitPractice(),
  'close-summary': () => { SESSION = null; document.body.classList.remove('practicing'); go(lastMainRoute || '#/today'); Sync.flushDeferred(); },
  again: () => { const s = SESSION; SESSION = null; startSession(s.mode, s.opt || {}); },
  'retry-wrong': () => {
    const items = [];
    SESSION.results.filter(r => !r.ok).forEach(r => { if (r.q.item && !items.includes(r.q.item)) items.push(r.q.item); });
    SESSION = null;
    if (!items.length) { go(lastMainRoute); return; }
    startSession('items', { items: shuffle(items), title: '重練答錯的題目' });
  },
  'show-zh': () => { const e = currentEntry(); if (e) { e.zhShown = true; renderPractice(); } },
  replay: () => {
    const e = currentEntry();
    if (!e || !e.q) return;
    const q = e.q;
    // before answering a grammar question the full sentence would give the answer away
    const text = q.audio || (e.done ? (q.fullJp || q.speakWord) : (q.fmt && q.fmt.startsWith('g-') ? '' : q.speakWord)) || '';
    if (!text) { toast('作答後可以聽整句。'); return; }
    if (text === q.speakWord && q.speakReading) { speak(text, { reading: q.speakReading }); return; }
    if (q.audioScript && text === q.audio) speakScript(text); else speak(text);
  },
  'speak-full': () => { const e = currentEntry(); if (e && e.q) speak(e.q.fullJp); },
  'speak-example': () => { const e = currentEntry(); const it = e && ((e.q && e.q.item) || e.item); if (it && it.ex) speak(jaPlain(exPlain(it.ex))); },   // the example the question used
  'spell-tap': (el) => {
    const e = currentEntry(); if (!e || e.done || !e.q || e.q.custom !== 'v-spell') return;
    e.spell = e.spell || []; const i = Number(el.dataset.i); if (e.spell.includes(i)) return;
    e.spell.push(i);
    const typed = e.spell.map(k => e.q.tiles[k]).join(''); const want = e.q.options[0].text;
    if ([...typed].length >= [...want].length) finishCustom(e, typed === want, typed); else renderPractice();
  },
  'custom-giveup': () => {
    const e = currentEntry(); if (!e || e.done || !e.q || !e.q.custom) return;
    if (e.q.custom === 'v-spell') { e.spell = [...e.q.options[0].text].map(ch => e.q.tiles.indexOf(ch)); }   // show the right spelling
    if (e.q.custom === 'v-match') { e.match = { sel: null, matched: e.q.pairs.map(p => p[0]), wrong: (e.match || {}).wrong || 0 }; }   // reveal every pair
    finishCustom(e, false, '（看了答案）');
  },
  'spell-back': () => { const e = currentEntry(); if (!e || e.done || !e.spell || !e.spell.length) return; e.spell.pop(); renderPractice(); },
  'match-word': (el) => {
    const e = currentEntry(); if (!e || e.done || !e.q || e.q.custom !== 'v-match') return;
    e.match = e.match || { sel: null, matched: [], wrong: 0 };
    e.match.sel = e.match.sel === el.dataset.w ? null : el.dataset.w;
    if (e.match.sel) { const p = e.q.pairs.find(x => x[0] === e.match.sel); speak(e.match.sel, p && p[2] && p[2] !== e.match.sel ? { reading: p[2] } : undefined); }   // hear the word as you pick it
    renderPractice();
  },
  'match-meaning': (el) => {
    const e = currentEntry(); if (!e || e.done || !e.q || e.q.custom !== 'v-match') return;
    const m = e.match = e.match || { sel: null, matched: [], wrong: 0 };
    if (!m.sel) return;
    const pair = e.q.pairs.find(p => p[0] === m.sel);
    if (pair && pair[1] === el.dataset.m) { m.matched.push(m.sel); delete m.flash; }
    else { m.wrong++; m.flash = { w: m.sel, m: el.dataset.m, at: Date.now() }; setTimeout(() => { if (m.flash && Date.now() - m.flash.at >= 550) delete m.flash; }, 600); }   // flash the wrong pair red
    m.sel = null;
    if (m.matched.length === e.q.pairs.length) finishCustom(e, m.wrong === 0, `配對時錯了 ${m.wrong} 次`); else renderPractice();
  },
  speak: (el) => speak(el.dataset.text, el.dataset.reading ? { reading: el.dataset.reading } : undefined),
  'ai-explain': () => aiExplainCurrent(),
  'report-item': () => reportCurrentItem(),
  'dismiss-notice': (el) => { state.notices = state.notices.filter(n => n.id !== el.dataset.id); saveState(); route(); },
  'intro-dismiss': () => { state.introSeen = true; saveState(); route(); },
  glossary: (el) => { const h = glossaryHtml(el.dataset.term); if (h) openModal('這是什麼？', h, { width: 480, noFocus: true }); }
};

}
const CHANGE_ACTIONS = {};
function handleChange(ev) {

// ---------- keyboard ----------
function handleKey(ev) {
  const tag = (ev.target && ev.target.tagName || '').toUpperCase();
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) || (ev.target && ev.target.isContentEditable)) return;
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (modalOpen()) { if (ev.key === 'Escape') closeModal(); return; }
  const r = currentRoute();
  const k = ev.key;
  if (r.name === 'practice' && SESSION) {
    const e = currentEntry();
    if (e && e.preview && !e.previewDone) {
      if (k === 'Enter' || k === ' ') { ev.preventDefault(); dismissPreview(); }
      else if (k === 'r' || k === 'R') { ev.preventDefault(); ACTIONS.replay(); }
      else if (k === 'f' || k === 'F') { ev.preventDefault(); toggleFurigana(); }
      else if (k === 'Escape') { ev.preventDefault(); exitPractice(); }
      return;
    }
    if (['1', '2', '3', '4'].includes(k)) { ev.preventDefault(); if (e && !e.done && !(e.q && e.q.custom)) answerCurrent(Number(k) - 1); return; }
    if (k === 'Enter' || k === ' ') { if (e && e.done) { ev.preventDefault(); nextQuestion(); } else if (!e) { ev.preventDefault(); } return; }
    if (k === 'r' || k === 'R') { ev.preventDefault(); ACTIONS.replay(); return; }
    if (k === 'f' || k === 'F') { ev.preventDefault(); toggleFurigana(); return; }
    if (k === 't' || k === 'T') { ev.preventDefault(); ACTIONS['show-zh'](); return; }
    if (k === 'Escape') { ev.preventDefault(); exitPractice(); return; }
    return;
  }
  if (r.name === 'exam' && r.parts[1] === 'run') { examKey(ev); return; }
  if (r.name === 'vocab' && (r.parts[1] || 'cards') === 'cards') { flashKey(ev); return; }
  if (k === 'f' || k === 'F') { ev.preventDefault(); toggleFurigana(); }
}

// The topics the 開始練習 session touches: vocabulary themes (the active pair when new words are in, otherwise the
// themes most of the review words belong to) and the grammar points of its grammar questions, new ones first.
function sessionTopicsHtml(q, plan) {
  const allWords = q.items.filter(it => it.kind === 'v');
  const words = allWords.filter(it => it.builtin);
  const present = new Set(words.map(vocabTheme));
  const all = (q.focus || []).filter(c => present.has(c)).concat([...present].filter(c => !(q.focus || []).includes(c)));
  const themes = all.slice(0, 3); if (all.length > 3) themes.push(`等 ${all.length} 個`);
  if (allWords.length > words.length) themes.push('自訂字卡');
  // the line is always there: custom cards have no theme, and a finished day just says so
  const vocabText = themes.length ? themes.join('・') : '今天的單字已完成';
  const gItems = q.items.filter(it => it.kind === 'g');
  const pts = [];
  gItems.filter(it => !state.srs[it.key]).concat(gItems.filter(it => state.srs[it.key])).forEach(g => { if (g.pt && !pts.includes(g.pt)) pts.push(g.pt); });
  const shown = pts.slice(0, 5); if (pts.length > 5) shown.push(`等 ${pts.length} 個考點`);
  const noteText = [extraNote(q), plan.note].filter(Boolean).join(' ');
  const note = noteText ? `<div class="plan-note">${esc(noteText)}</div>` : '';
  return `<div class="plan-topics">
      <span><b>單字主題</b>${esc(vocabText)}</span>
      ${shown.length ? `<span><b>文法</b>${esc(shown.join('・'))}</span>` : ''}
    </div>${note}`;
}

function renderToday(view) {

  const newN = plan.newV.length + plan.newG.length;
  const exK = plan.dueK.length + plan.newK.length;
  const exL = Math.min(plan.dueL.length + plan.newL.length, state.settings.listenPerDay || 0);
  const exR = Math.min(1, plan.dueR.length + plan.newR.length);
  const size = state.settings.sessionSize;
  const exM = dailyQueue(size).mistakeN || 0;

  const sessionN = reviewN + newN + extraN ? dailyQueue(size).items.length + encoreEstimate(dailyQueue(size).items) : 0;   // new words come back twice more
  const d = parseDate(t);
  const greeting = `${d.getMonth() + 1} 月 ${d.getDate()} 日（${weekdayZh(t)}）`;

  let heroBody;
  if (reviewN + newN + extraN === 0) {

      </div>`;
  }

  const paceText = pace.daysLeft === 0 ? '考試日期已到或已過，可在設定中更新考試日期。'
    : pace.status === 'behind' ? `剩下 ${pace.remainingUnits} 個單元，每個單元平均只有約 ${pace.perUnit} 天，建議加快一點或提高每日題數。`

function heatLevel(n) { return n <= 0 ? 0 : n < 6 ? 1 : n < 15 ? 2 : n < 26 ? 3 : 4; }
// The grid runs from the week the learner started (first day with a record, or the day the profile was created) to
// this week, so a wide screen does not show months of blank cells before the first green one. At least 4 weeks so
// a brand-new profile still reads as a calendar; at most 26, as before.
function heatmapWeeks() {
  const t = todayStr();
  const monday = (ds) => { const d = parseDate(ds); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; };
  let first = state.createdAt && state.createdAt < t ? state.createdAt : t;
  for (const ds of Object.keys(state.dailyLogs)) if (dayTotal(state.dailyLogs[ds]) > 0 && ds < first) first = ds;
  const span = Math.round((monday(t) - monday(first)) / 864e5 / 7) + 1;
  return clamp(span, 4, 26);
}
function heatmapHtml() {
  const weeks = heatmapWeeks();
  const today = parseDate(todayStr());
  const dow = (today.getDay() + 6) % 7; // Monday = 0
  const start = new Date(today); start.setDate(start.getDate() - dow - (weeks - 1) * 7);
  const cells = []; const months = [];
  let lastMonth = -1; let lastLabel = -9;
  for (let w = 0; w < weeks; w++) {
    const first = new Date(start); first.setDate(first.getDate() + w * 7);
    // label a column when its month starts, but never two labels closer than three columns
    const isNew = first.getMonth() !== lastMonth;
    const nextMonthSoon = w === 0 && new Date(first.getFullYear(), first.getMonth(), first.getDate() + 14).getMonth() !== first.getMonth();
    months.push(isNew && w - lastLabel >= 3 && !nextMonthSoon ? `${first.getMonth() + 1}月` : '');
    if (months[w]) lastLabel = w;
    lastMonth = first.getMonth();
    for (let d = 0; d < 7; d++) {
      const day = new Date(start); day.setDate(day.getDate() + w * 7 + d);
      const ds = dateStr(day);
      if (day > today) { cells.push('<i class="future"></i>'); continue; }
      const n = dayTotal(state.dailyLogs[ds]);
      cells.push(`<i class="l${heatLevel(n)}${ds === todayStr() ? ' today' : ''}" data-act="heat-day" data-date="${ds}" title="${ds}：${n} 題"></i>`);
    }
  }
  return `<div class="heat-wrap"><div class="heat-months">${months.map(m => `<span>${m}</span>`).join('')}</div><div class="heat">${cells.join('')}</div></div>`;
}
function recentLogsHtml() {
  const days = Object.keys(state.dailyLogs).filter(d => dayTotal(state.dailyLogs[d]) > 0).sort().reverse().slice(0, 14);
  if (!days.length) return '<div class="empty">還沒有紀錄，完成第一組練習後就會出現。</div>';
  return `<div class="list mt-2">${days.map(d => {
    const e = state.dailyLogs[d];
    const topics = (e.topics || []).slice(0, 4).join('、');
    return `<div class="list-item"><div class="grow">
      <div class="row-wrap"><b class="num">${d}</b><span class="small muted">單字 ${e.vocabCount || 0}・文法 ${e.grammarCount || 0}・其他 ${(e.quizCount || 0) + (e.bonusCount || 0)}</span></div>
      ${topics ? `<div class="small dim">${esc(topics)}</div>` : ''}
      ${e.mistakeTopics && e.mistakeTopics.length ? `<div class="small muted">錯：${esc(e.mistakeTopics.slice(0, 3).join('、'))}</div>` : ''}
    </div><span class="chip num">${dayTotal(e)} 題</span>
    <button type="button" class="btn btn-sm btn-ghost" data-act="del-log" data-date="${d}" title="刪除這天的紀錄">刪除</button></div>`;
  }).join('')}</div>`;
}

Object.assign(ACTIONS, {
  'heat-day': (el) => {
    const d = el.dataset.date; const e = state.dailyLogs[d]; const n = dayTotal(e);
    const box = document.getElementById('heatInfo');

    const d = el.dataset.date;
    if (!confirm(`刪除 ${d} 的學習紀錄？`)) return;
    delete state.dailyLogs[d]; saveState(); route();
  },
  'set-goal': (el) => {
    const g = clamp(Number(el.dataset.goal) || 20, 5, 200);
    state.settings.dailyGoal = g;
    saveState(); toast(`每日目標：${g} 題`); route();

  'advance-unit': () => {
    const i = unitOrder(state.currentUnit);

    if (i < DATA.UNITS.length - 1) state.currentUnit = DATA.UNITS[i + 1].id;
    saveState();
    toast(`目前單元：${unitById(state.currentUnit).weeks}・${unitById(state.currentUnit).short}`);
    route();
  }
});

  vk: ['来る', '不規則動詞，只有這一個：来る（くる）。變化時讀音會變：来ます（きます）、来ない（こない）、来て（きて）。'],

  return `<div class="glossary"><div class="page-title" style="font-size:20px">${esc(g[0])}</div><p class="mt-2">${esc(g[1])}</p>

}

}

function lessonHtml(uid) {
  const L = DATA.LESSONS[uid];
  if (!L) return '<div class="empty">這個單元還沒有講義。</div>';
  return lessonHtmlFrom(L);
}
function lessonHtmlFrom(L) {
  const sections = (L.sections || []).map(s => `
    <h3>${bracketRuby(s.h)}</h3>
    ${s.rule ? `<div class="rule jp">${bracketRuby(s.rule)}</div>` : ''}
    <ul>${(s.points || []).map(p => `<li>${bracketRuby(p)}</li>`).join('')}</ul>
    ${s.kana ? kanaGridHtml() : ''}
    ${(s.ex || []).map(e => `<div class="example"><button type="button" class="btn btn-sm btn-ghost btn-icon" data-act="speak" data-text="${esc(e.jp)}" aria-label="朗讀">${icon('speaker')}</button><div><div class="jp">${furi(e.jp)}</div><div class="zh">${esc(e.zh)}</div></div></div>`).join('')}
  `).join('');
  return `<div class="lesson">
    ${L.formula ? `<div class="panel jp small">${bracketRuby(L.formula)}</div>` : ''}
    ${L.overview ? `<p class="dim mt-3">${bracketRuby(L.overview)}</p>` : ''}
    ${sections}
    ${L.tip ? `<div class="tipbox mt-4"><b>重點整理：</b>${bracketRuby(L.tip)}</div>` : ''}
  </div>`;
}

const TYPE_LABEL = { choice: '填空', meaning: '句意', order: '排序', correct: '選正確句', conj: '動詞變化', adj: '形容詞變化' };
function itemPreview(g) {
  if (g.t === 'order') return (g.pre || '') + (g.parts || []).join('') + (g.post || '');
  if (g.t === 'correct') return g.a;
  if (g.t === 'conj') return String(g.jp).replace('{V}', `（${g.v}→　）`);
  if (g.t === 'adj') return String(g.jp).replace('{A}', `（${g.w}→　）`);
  return g.jp;
}

  const u = DATA.UNITS.find(x => x.id === uid);

  const isCur = state.currentUnit === uid;
  const items = unitItems(uid);

  const aiNote = state.unitAiNotes && state.unitAiNotes[uid];
  let body = '';
  if (tab === 'items') {
    const t = todayStr();
    const rows = items.map(g => {
      const r = state.srs[g.key];
      return `<div class="list-item">
        <span class="chip">${TYPE_LABEL[g.t || 'choice'] || '題目'}</span>
        <div class="grow"><div class="jp">${furi(itemPreview(g))}</div><div class="tiny muted">${esc(g.pt || '')}${g.src === 'ai' ? '・AI' : ''}</div></div>

  }
  view.innerHTML = `
    <div class="row mb-3"><button type="button" class="btn btn-ghost btn-sm" data-act="nav" data-route="#/course">${icon('back')}課程</button></div>

// make `unit` the current unit; optionally mark every earlier unit as completed and apply the 我已有基礎 settings
function applyStartUnit(unit, markPrev, experienced = false) {
  if (!DATA.UNITS.some(u => u.id === unit)) return;
  state.currentUnit = unit;
  if (markPrev) DATA.UNITS.slice(0, unitOrder(unit)).forEach(u => { if (!state.completedUnits.includes(u.id)) state.completedUnits.push(u.id); });
  if (experienced) applyExperienced();
  saveState(); closeModal(); toast(`目前單元：${unitById(unit).weeks}・${unitById(unit).short}${experienced ? '・已套用「我已有基礎」設定' : ''}`); route();
}

Object.assign(ACTIONS, {
  'set-current': (el) => { state.currentUnit = el.dataset.unit; saveState(); toast(`目前單元：${unitById(el.dataset.unit).weeks}`); route(); },
  'toggle-done': (el) => {
    const id = el.dataset.unit;
    if (state.completedUnits.includes(id)) state.completedUnits = state.completedUnits.filter(x => x !== id);
    else state.completedUnits.push(id);
    saveState(); route();

  },

  'duo-apply': () => {

    applyStartUnit(recommendUnit(v), document.getElementById('startMarkPrev').checked, (document.getElementById('startExperienced') || {}).checked);
  },
  'ai-note': (el) => aiUnitNote(el.dataset.unit, (document.getElementById('aiNoteQ') || {}).value || '', el),

let FLASH = null;   // { deck, queue: [key], idx, flipped, extraNew }
const DECKS = [['all', '全部'], ['N5', 'N5'], ['N4', 'N4'], ['custom', '自訂／匯入']];

// ---- themes: the built-in words carry a theme (`c`); custom cards have none and stay in their own deck ----
const THEME_ORDER = ['問候', '指示', '代名詞', '疑問', '數量', '時間', '人物', '家庭', '身體', '飲食', '生活', '地點', '位置', '移動', '交通', '學校', '工作', '購物', '衣物', '顏色', '天氣', '自然', '興趣', '休閒', '動作', '形容', '副詞', '接續', '狀態', '溝通', '健康', '旅行', '社會', '抽象', '心情', '情感', '思考', '人際', '敬語', '自他動詞', '其他'];
function vocabTheme(v) { return !v.c || v.c === '舊版' ? '其他' : v.c; }
function vocabThemes() {
  const t = todayStr();
  const by = new Map();
  REG.vocab.filter(v => v.builtin).forEach(v => {
    const c = vocabTheme(v);
    const g = by.get(c) || by.set(c, { c, total: 0, seen: 0, learned: 0, mastered: 0, due: 0, N5: 0, N4: 0 }).get(c);
    g.total++; g[v.lv === 'N4' ? 'N4' : 'N5']++;
    const r = state.srs[v.key];
    if (r) { g.seen++; if (r.b >= SRS_LEARNED) g.learned++; if (srsLevelLabel(r, v.key) === '已熟練') g.mastered++; if (r.due <= t) g.due++; }
  });
  const rank = (c) => { const i = THEME_ORDER.indexOf(c); return i < 0 ? THEME_ORDER.length : i; };
  return [...by.values()].sort((a, b) => rank(a.c) - rank(b.c) || a.c.localeCompare(b.c, 'zh-Hant'));
}
// three stacked segments: mastered, learned (not yet mastered), seen (not yet learned)
// Three-segment bar painted as one gradient (no child layout to go wrong on any browser): segs = [[name, count]]
// left to right, brightest first. Names mastered / learned / seen map to heat-4 / heat-3 / heat-2.
const SEG_COLOR = { mastered: 'var(--heat-4)', learned: 'var(--heat-3)', seen: 'var(--heat-2)' };
function segBarHtml(total, segs, cls = 'mt-2') {
  let acc = 0; const stops = [];
  const attrs = segs.map(([name, n]) => { const from = acc; acc += n; stops.push(`${SEG_COLOR[name]} ${(from / Math.max(1, total) * 100).toFixed(1)}% ${(acc / Math.max(1, total) * 100).toFixed(1)}%`); return `data-${name}="${n}"`; }).join(' ');
  stops.push(`transparent ${(acc / Math.max(1, total) * 100).toFixed(1)}% 100%`);
  return `<div class="bar stack ${cls}" ${attrs} style="background-image:linear-gradient(to right, ${stops.join(', ')})"></div>`;
}
function stackBarHtml(g) { return segBarHtml(g.total, [['mastered', g.mastered], ['learned', g.learned - g.mastered], ['seen', g.seen - g.learned]]); }
// grammar units: answered correctly 3+ times / answered correctly / seen but not yet right
function unitBarHtml(s, cls) { return segBarHtml(s.total, [['mastered', s.ok3], ['learned', s.ok1], ['seen', s.seen0]], cls); }
function unitLegendHtml(s) { return `<i class="seg-dot mastered"></i>答對 3 次以上 ${s.ok3}　<i class="seg-dot learned"></i>答對過 ${s.ok1}　<i class="seg-dot seen"></i>出現過 ${s.seen0}　共 ${s.total} 題`; }
function vocabSessionCount(filter) { const items = buildVocabQueue(filter, 20); return items.length + encoreEstimate(items); }
function renderVocabThemes(view) {
  const cards = vocabThemes().map(g => `<div class="card theme-card" data-c="${esc(g.c)}">
      <div class="row between"><div class="card-title">${esc(g.c)}</div><span class="tiny muted">N5 ${g.N5}・N4 ${g.N4}</span></div>
      ${stackBarHtml(g)}
      <div class="small muted mt-2"><i class="seg-dot seen"></i>已學 ${g.seen}　<i class="seg-dot learned"></i>熟悉 ${g.learned}　<i class="seg-dot mastered"></i>熟練 ${g.mastered}　共 ${g.total} 字${g.due ? `・今天到期 ${g.due}` : ''}</div>
      <div class="row-wrap mt-3">
        <button type="button" class="btn btn-sm" data-act="nav" data-route="#/vocab/list?c=${encodeURIComponent(g.c)}">字表</button>
        <button type="button" class="btn btn-sm btn-primary" data-act="start-vocab" data-filter="c:${esc(g.c)}">練習・${vocabSessionCount('c:' + g.c)} 題</button>
      </div></div>`).join('');
  view.innerHTML = `
    <div class="page-head"><div><div class="page-title">單字</div><div class="page-sub">依主題分組的內建單字。每個主題都可以單獨看字表或練習。</div></div></div>
    ${vocabTabs('themes')}
    <div class="grid grid-3 theme-grid">${cards}</div>`;
}

function deckPool(deck) {
  if (deck === 'custom') return REG.vocab.filter(v => !v.builtin);
  if (deck === 'N5' || deck === 'N4') return REG.vocab.filter(v => v.builtin && v.lv === deck);
  // the mixed deck follows the daily rule: N4 words only after every N5 word has been introduced
  const n4Open = n4WordsOpen();
  return REG.vocab.filter(v => (v.builtin ? (v.lv !== 'N4' || n4Open) : state.settings.includeImported !== 'off'));
}
function deckAllowsN4(deck) { return deck === 'N4' || n4WordsOpen(); }
function buildFlashQueue(deck, extraNew = 0) {
  const t = todayStr();
  const pool = deckPool(deck);
  const due = pool.filter(v => { const r = state.srs[v.key]; return r && r.due <= t; }).sort(byDue);
  const quota = Math.max(0, state.settings.newVocabPerDay - state.today.newV) + extraNew;
  const fresh = (deck === 'custom' ? pool.filter(v => !state.srs[v.key]) : newVocabCandidates(pool, deckAllowsN4(deck))).slice(0, quota);
  return due.concat(fresh).map(v => v.key);
}
function ensureFlash(deck) {
  if (!FLASH || FLASH.deck !== deck || FLASH.date !== todayStr()) FLASH = { deck, queue: buildFlashQueue(deck), idx: 0, flipped: false, extraNew: 0, date: todayStr(), done: 0 };
  return FLASH;
}

function vocabTabs(tab) {
  return `<div class="seg mb-4">
    <button type="button" aria-pressed="${tab === 'cards'}" data-act="nav" data-route="#/vocab">字卡</button>
    <button type="button" aria-pressed="${tab === 'themes'}" data-act="nav" data-route="#/vocab/themes">主題</button>
    <button type="button" aria-pressed="${tab === 'kanji'}" data-act="nav" data-route="#/vocab/kanji">漢字</button>
    <button type="button" aria-pressed="${tab === 'list'}" data-act="nav" data-route="#/vocab/list">單字表</button>
    <button type="button" aria-pressed="${tab === 'import'}" data-act="nav" data-route="#/vocab/import">匯入與新增</button>
  </div>`;
}

      <button type="button" class="btn" data-act="start-vocab" data-filter="${deck}">單字測驗・${vocabSessionCount(deck)} 題</button></div>

function nextIntervalText(key, grade) {

async function renderFlashMedia(v) {
  const box = document.getElementById('flashMedia');
  if (!box || (!v.imageFile && !v.videoFile)) return;
  const url = async (f) => (/^(https?:|data:)/.test(f) ? f : await AnkiMedia.url(f));
  let html = '';
  if (v.imageFile) { const u = await url(v.imageFile); if (u) html += `<img src="${esc(u)}" alt="" style="max-height:200px;max-width:100%;border-radius:10px;margin-top:10px">`; }
  if (v.videoFile) { const u = await url(v.videoFile); if (u) html += `<video src="${esc(u)}" controls playsinline style="max-height:220px;max-width:100%;border-radius:10px;margin-top:10px"></video>`; }
  box.innerHTML = html;
}
function flashKey(ev) {
  const k = ev.key;
  if (!FLASH) return;
  if (k === ' ' || k === 'Enter') { ev.preventDefault(); if (!FLASH.flipped) ACTIONS['flash-flip'](); else ACTIONS['flash-rate']({ dataset: { g: 'good' } }); return; }
  if (FLASH.flipped && ['1', '2', '3', '4'].includes(k)) { ev.preventDefault(); ACTIONS['flash-rate']({ dataset: { g: ['again', 'hard', 'good', 'easy'][Number(k) - 1] } }); return; }
  if (k === 'r' || k === 'R') { ev.preventDefault(); ACTIONS['flash-speak']({ dataset: { mode: 'word' } }); return; }
  if (k === 'f' || k === 'F') { ev.preventDefault(); toggleFurigana(); }
}
function flashCurrent() { return FLASH && REG.byKey.get(FLASH.queue[FLASH.idx]); }

// ---------- word list ----------
// the word table's current selection (search, level tab, theme)
function vocabListFiltered(params) {
  const q = (params.q || '').trim().toLowerCase();
  const lv = params.lv || 'all';
  const theme = params.c || '';
  let list = REG.vocab;
  if (theme) list = list.filter(v => v.builtin && vocabTheme(v) === theme);
  if (lv === 'custom') list = list.filter(v => !v.builtin);
  else if (lv !== 'all') list = list.filter(v => v.builtin && v.lv === lv);
  if (q) list = list.filter(v => [v.w, v.r, v.m].some(x => String(x || '').toLowerCase().includes(q)));
  return list;
}

      <div class="setting-row"><div><div class="label">清除所有自訂與匯入字卡</div><div class="hint">內建單字、學習紀錄與錯題本不受影響。</div></div><button type="button" class="btn btn-sm btn-danger" data-act="vocab-clear-custom">清除 ${custom.length} 張</button></div>

Object.assign(ACTIONS, {
  'flash-deck': (el) => { FLASH = null; go(`#/vocab?deck=${el.dataset.deck}`); },
  'flash-flip': () => { if (!FLASH) return; FLASH.flipped = true; route(); const v = flashCurrent(); if (v && state.settings.autoSpeak) speak(v.r || jaPlain(v.w)); },
  'flash-rate': (el) => {
    const v = flashCurrent();
    if (!v) return;
    const g = el.dataset.g;
    const res = srsAnswer(v.key, g !== 'again', { grade: g });
    recordFormat(res.rec, 'flash', g !== 'again');
    recordAction('v', `單字「${jaPlain(v.w)}」`);
    recordAccuracy(g !== 'again');
    if (g === 'again') {
      addMistake({ key: v.key, cat: '單字', mistakePrompt: `${jaPlain(v.w)}${v.r && v.r !== v.w ? `（${v.r}）` : ''}`, answerText: v.m, why: vocabWhy(v) }, '字卡：忘記');
      FLASH.queue.splice(Math.min(FLASH.queue.length, FLASH.idx + 5), 0, v.key);
    } else onCorrectForMistake({ key: v.key });
    saveState();
    FLASH.idx++; FLASH.done++; FLASH.flipped = false;
    if (res.isNew && FLASH.idx >= FLASH.queue.length) FLASH.queue = FLASH.queue.concat(buildFlashQueue(FLASH.deck).filter(k => !FLASH.queue.slice(FLASH.idx).includes(k) && !state.srs[k]));
    route();
  },
  'flash-skip': () => { if (!FLASH) return; FLASH.idx++; FLASH.flipped = false; route(); },
  'flash-more': () => {
    if (!FLASH) return;
    FLASH.extraNew += 5;
    const fresh = (FLASH.deck === 'custom' ? deckPool('custom').filter(v => !state.srs[v.key]) : newVocabCandidates(deckPool(FLASH.deck), deckAllowsN4(FLASH.deck))).slice(0, 5).map(v => v.key);
    if (!fresh.length) { toast('這個牌組的新卡都學過了'); return; }
    FLASH.queue = FLASH.queue.slice(0, FLASH.idx).concat(fresh); FLASH.flipped = false; route();
  },
  'flash-speak': (el) => { const v = flashCurrent(); if (!v) return; playVocabAudio(v, el.dataset.mode === 'ex' ? 'ex' : 'word'); },
  'flash-ai': () => aiEnrichCard(flashCurrent()),
  'flash-translate': () => aiTranslateCards([flashCurrent()]),
  'vocab-filter': (el) => { const q = (document.getElementById('vocabSearch') || {}).value || ''; const c = currentRoute().params.c; go(`#/vocab/list?lv=${el.dataset.lv}&q=${encodeURIComponent(q)}${c ? `&c=${encodeURIComponent(c)}` : ''}`); },
  'vocab-known': (el) => {
    const v = REG.byKey.get(el.dataset.key); if (!v) return;
    markKnown(v.key);
    if (SESSION && SESSION.entries) SESSION.entries = SESSION.entries.filter((x, i) => i <= SESSION.idx || !(x.encore && x.item && x.item.key === v.key));   // no more encores for it
    toast(`「${jaPlain(v.w)}」已標成熟練，約六週後再確認一次`);
    if (SESSION && document.body.classList.contains('practicing')) renderPractice(); else route();
  },
  'vocab-unknown': (el) => {
    const v = REG.byKey.get(el.dataset.key); if (!v) return;
    unmarkKnown(v.key); toast(`「${jaPlain(v.w)}」回到熟悉，照正常排程複習`);
    if (SESSION && document.body.classList.contains('practicing')) renderPractice(); else route();
  },
  // 整批我會了: every word in the current table selection that is not vouched for yet; the previous records are kept for 復原
  'vocab-known-all': () => {
    const keys = vocabListFiltered(currentRoute().params).filter(v => !(state.srs[v.key] && state.srs[v.key].known)).map(v => v.key);
    if (!keys.length) return;
    const prev = {}; keys.forEach(k => { prev[k] = state.srs[k] ? JSON.parse(JSON.stringify(state.srs[k])) : null; markKnown(k, false); });
    saveState(); LAST_BULK_KNOWN = { keys, prev };
    toast(`已把 ${keys.length} 個字標成我會了，約六週後再各確認一次`); route();
  },
  'vocab-known-undo': () => {
    if (!LAST_BULK_KNOWN) return;
    Object.entries(LAST_BULK_KNOWN.prev).forEach(([k, r]) => { if (r) state.srs[k] = r; else delete state.srs[k]; });
    const n = LAST_BULK_KNOWN.keys.length; LAST_BULK_KNOWN = null; saveState(); toast(`已復原 ${n} 個字的紀錄`); route();
  },
  // 我會了 on the new-word preview card: vouch for the word and drop it (and any encore) from this session
  'preview-known': () => {
    const e = currentEntry(); if (!e || !e.preview || e.previewDone || !e.item || e.item.kind !== 'v') return;
    const v = e.item; markKnown(v.key);
    SESSION.entries = SESSION.entries.filter((x, i) => i !== SESSION.idx && !(x.item && x.item.key === v.key));
    toast(`「${jaPlain(v.w)}」已標成熟練，約六週後再確認一次`);
    renderPractice(); window.scrollTo({ top: 0 });
  },
  'vocab-remove': (el) => {
    const v = REG.byKey.get(el.dataset.key);
    if (!v) return;
    if (v.builtin) { if (!state.hidden.includes(v.id)) state.hidden.push(v.id); toast(`已隱藏「${jaPlain(v.w)}」`); }
    else { if (!confirm(`刪除字卡「${jaPlain(v.w)}」？`)) return; state.vocab = state.vocab.filter(x => x.id !== v.id); delete state.srs[v.key]; }
    saveState(); buildRegistry(); route();
  },
  'vocab-add': () => {
    const w = document.getElementById('addW').value.trim();
    const r = document.getElementById('addR').value.trim();
    const m = document.getElementById('addM').value.trim();
    const ex = document.getElementById('addEx').value.trim();
    const exZh = document.getElementById('addExZh').value.trim();
    if (!w || !m) { toast('請至少填寫日文與中文意思'); return; }
    state.vocab.unshift({ id: uid('cust'), w, r: IS_KANA.test(r) ? r : '', m, p: '', lv: 'CUSTOM', ex: markTarget(ex, w), exZh, src: 'user', posLabel: '自建' });
    saveState(); buildRegistry(); toast(`已新增「${w}」`); route();
  },
  'vocab-clear-custom': async () => {
    const n = state.vocab.length;
    if (!confirm(`確定要清除 ${n} 張自訂與匯入的字卡？這個動作無法復原（建議先到設定下載備份）。`)) return;
    state.vocab.forEach(v => { delete state.srs['v:' + v.id]; });
    state.vocab = [];
    await AnkiMedia.clear();
    saveState(); buildRegistry(); FLASH = null; toast(`已清除 ${n} 張字卡`); route();
  },
  'anki-paste': () => importAnkiText(document.getElementById('ankiPaste').value),
  'ai-deck': (el) => aiGenerateDeck((document.getElementById('aiDeckTopic') || {}).value || '', el),
  'ai-translate-batch': () => aiTranslateCards(REG.vocab.filter(v => !v.builtin && isEnglishOnly(v.m)).slice(0, 20))
});
Object.assign(CHANGE_ACTIONS, {
  'vocab-search': (el) => { const { lv = 'all', c } = currentRoute().params; go(`#/vocab/list?lv=${lv}&q=${encodeURIComponent(el.value)}${c ? `&c=${encodeURIComponent(c)}` : ''}`); },

/* ==========================================================================
   Mistake notebook
   ========================================================================== */
function renderMistakes(view, params = {}) {
  const filter = ['active', 'mastered', 'all'].includes(params.f) ? params.f : 'active';
  const sort = ['count', 'recent', 'stale'].includes(params.s) ? params.s : 'count';
  const cat = params.c || ''; const group = params.g === 'pt' ? 'pt' : '';
  const link = (o) => '#/mistakes?' + Object.entries(Object.assign({ f: filter, s: sort, c: cat, g: group }, o)).filter(([, v]) => v).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  const all = state.mistakes;
  const active = all.filter(m => !m.mastered);
  const base = filter === 'mastered' ? all.filter(m => m.mastered) : filter === 'all' ? all : active;
  const sorters = { count: mistakePriority, recent: (a, b) => mistakeLast(b).localeCompare(mistakeLast(a)), stale: (a, b) => mistakeLast(a).localeCompare(mistakeLast(b)) };
  const list = (cat ? base.filter(m => (m.cat || '綜合') === cat) : base).slice().sort(sorters[sort]);
  const cats = {};
  base.forEach(m => { cats[m.cat || '綜合'] = (cats[m.cat || '綜合'] || 0) + 1; });
  const catChips = Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([c, n]) => `<button type="button" class="chip ${cat === c ? 'chip-accent' : ''}" data-act="nav" data-route="${link({ c: cat === c ? '' : c })}">${esc(c)} ${n}</button>`).join(' ');
  const t = todayStr();
  const row = (m) => {
    const linked = m.key && REG.byKey.get(m.key);
    const rec = m.key && state.srs[m.key];
    const status = m.mastered ? '<span class="chip chip-ok">已掌握</span>'
      : linked ? (rec ? `<span class="nowrap">${srsDots(rec.b)} <span class="tiny muted">${srsLevelLabel(rec, m.key)}</span></span>` : '')
        : `<span class="tiny muted">答對 ${new Set(m.okDays || []).size}／2 天</span>`;
    const when = mistakeLast(m); const ago = when ? daysBetween(when, t) : null;
    return `<details class="mrow" data-id="${esc(m.id)}" data-count="${m.count || 1}">
      <summary>
        <span class="chip">${esc(m.cat || '綜合')}</span>
        <span class="jp mprompt">${furi(tidyPrompt(m.prompt))}</span>
        <span class="small nowrap">正確 <b class="jp">${furi(m.answer || '')}</b></span>
        <span class="tiny muted nowrap">錯 ${m.count || 1} 次${ago === null ? '' : ago === 0 ? '・今天' : `・${ago} 天前`}</span>
        ${status}
      </summary>
      <div class="mbody">
        <div class="row-wrap small">${m.wrong ? `<span class="muted">你選過：<span class="jp">${esc(m.wrong)}</span></span>` : ''}<button type="button" class="btn btn-sm btn-ghost btn-icon" data-act="speak" data-text="${esc(jaPlain(m.prompt))}" aria-label="朗讀">${icon('speaker')}</button></div>
        ${m.why ? `<div class="small mt-2">${md(m.why)}</div>` : ''}
        <div class="row-wrap mt-2">
          <input class="input grow" placeholder="自己的筆記或口訣" value="${esc(m.note || '')}" data-change="mistake-note" data-id="${esc(m.id)}" style="min-width:180px" />
          ${isAiConfigured() ? `<button type="button" class="btn btn-sm" data-act="mistake-ai" data-id="${esc(m.id)}">AI 解析</button>` : ''}
          <button type="button" class="btn btn-sm btn-ghost" data-act="mistake-toggle" data-id="${esc(m.id)}">${m.mastered ? '移回待複習' : '標為已掌握'}</button>
          <button type="button" class="btn btn-sm btn-ghost btn-danger" data-act="mistake-del" data-id="${esc(m.id)}">刪除</button>
        </div>
        ${linked ? '' : '<div class="hint mt-2">這題來自舊版或手動新增，練習時用自評卡出題，隔天以上答對兩次就移到已掌握。</div>'}
      </div></details>`;
  };
  let body;
  if (group === 'pt') {
    // grammar by 考點 (with a drill button), everything else by category
    const groups = new Map();
    list.forEach(m => {
      const it = m.key && REG.byKey.get(m.key);
      const name = it && it.kind === 'g' && it.pt ? it.pt : (m.cat || '綜合');
      const g = groups.get(name) || groups.set(name, { name, pt: it && it.kind === 'g' ? it.pt : '', items: [] }).get(name);
      g.items.push(m);
    });
    body = [...groups.values()].sort((a, b) => b.items.length - a.items.length).map(g => `<div class="card mgroup">
        <div class="row between"><div><b>${esc(g.name)}</b> <span class="small muted">${g.items.length} 題</span></div>${g.pt ? `<button type="button" class="btn btn-sm" data-act="stats-drill" data-pt="${esc(g.pt)}">練這個考點</button>` : ''}</div>
        <div class="mlist mt-2">${g.items.map(row).join('')}</div></div>`).join('');
  } else {
    body = `<div class="card mlist">${list.slice(0, 300).map(row).join('')}</div>`;
  }
  view.innerHTML = `
    <div class="page-head">
      <div><div class="page-title">錯題本</div><div class="page-sub">答錯的題目會自動收進來，每天練習會夾帶幾題（設定可調）；題目達到「熟悉」就移到「已掌握」。</div></div>
      <div class="row-wrap">
        <button type="button" class="btn btn-primary" data-act="start-mistakes" ${active.length ? '' : 'disabled'}>練習錯題（${active.length}）</button>
        <button type="button" class="btn" data-act="mistake-add">手動新增</button>
        ${filter === 'mastered' && base.length ? `<button type="button" class="btn btn-ghost" data-act="mistake-clear-mastered">清空已掌握（${base.length}）</button>` : ''}
      </div>
    </div>
    <div class="row-wrap mb-3" style="align-items:center">
      <div class="seg">
        <button type="button" aria-pressed="${filter === 'active'}" data-act="nav" data-route="${link({ f: 'active', c: '' })}">待複習 ${active.length}</button>
        <button type="button" aria-pressed="${filter === 'mastered'}" data-act="nav" data-route="${link({ f: 'mastered', c: '' })}">已掌握 ${all.length - active.length}</button>
        <button type="button" aria-pressed="${filter === 'all'}" data-act="nav" data-route="${link({ f: 'all', c: '' })}">全部 ${all.length}</button>
      </div>
      <div class="seg">
        <button type="button" aria-pressed="${group === ''}" data-act="nav" data-route="${link({ g: '' })}">列表</button>
        <button type="button" aria-pressed="${group === 'pt'}" data-act="nav" data-route="${link({ g: 'pt' })}">依考點</button>
      </div>
      <select class="select" style="width:auto" data-change="mistake-sort" data-base="${esc(link({ s: '' }))}">
        <option value="count" ${sort === 'count' ? 'selected' : ''}>錯最多次</option>
        <option value="recent" ${sort === 'recent' ? 'selected' : ''}>最近錯的</option>
        <option value="stale" ${sort === 'stale' ? 'selected' : ''}>最久沒練</option>
      </select>
    </div>
    ${catChips ? `<div class="row-wrap mb-3">${catChips}</div>` : ''}
    ${list.length ? body : '<div class="card empty">這裡沒有題目。</div>'}
    ${list.length > 300 && group !== 'pt' ? '<p class="hint">只顯示前 300 題。</p>' : ''}`;
}

Object.assign(ACTIONS, {
  'mistake-clear-mastered': () => {
    const n = state.mistakes.filter(m => m.mastered).length;
    if (!n || !confirm(`刪除 ${n} 題已掌握的錯題？`)) return;
    state.mistakes = state.mistakes.filter(m => !m.mastered); saveState(); route();
  },
  'mistake-toggle': (el) => {
    const m = state.mistakes.find(x => x.id === el.dataset.id);
    if (!m) return;
    m.mastered = !m.mastered; m.streak = m.mastered ? 3 : 0;
    saveState(); route();
  },
  'mistake-del': (el) => {
    state.mistakes = state.mistakes.filter(x => x.id !== el.dataset.id);
    saveState(); route();
  },
  'mistake-ai': (el) => {
    const m = state.mistakes.find(x => x.id === el.dataset.id);
    if (m) aiExplainMistake(m, el);
  },
  'mistake-add': () => openModal('手動新增錯題', `
    <div class="field"><label>題目（可用「（　）」表示空格）</label><input class="input jp" id="mkPrompt" placeholder="バス（　）乗ります。" /></div>
    <div class="grid grid-2 mt-3">
      <div class="field"><label>正確答案</label><input class="input jp" id="mkAnswer" placeholder="に" /></div>
      <div class="field"><label>容易選錯的答案</label><input class="input jp" id="mkWrong" placeholder="を" /></div>
    </div>
    <div class="field mt-3"><label>說明（可留空）</label><textarea class="input" id="mkWhy" rows="3" placeholder="乗る的對象用「に」。"></textarea></div>
    <div class="row-wrap mt-4"><button type="button" class="btn btn-primary" data-act="mistake-save">儲存</button></div>`, { width: 560 }),
  'mistake-save': () => {
    const prompt = document.getElementById('mkPrompt').value.trim();
    const answer = document.getElementById('mkAnswer').value.trim();
    if (!prompt || !answer) { toast('請填寫題目與正確答案'); return; }
    state.mistakes.unshift({ id: uid('mk'), key: '', cat: '自訂', prompt, answer, wrong: document.getElementById('mkWrong').value.trim(), why: document.getElementById('mkWhy').value.trim(), count: 1, streak: 0, mastered: false, note: '', date: todayStr() });
    saveState(); closeModal(); toast('已加入錯題本'); route();
  }
});
Object.assign(CHANGE_ACTIONS, {
  'mistake-sort': (el) => go(`${el.dataset.base}&s=${el.value}`),
  'mistake-note': (el) => {
    const m = state.mistakes.find(x => x.id === el.dataset.id);
    if (m) { m.note = el.value; saveState(); toast('已儲存筆記'); }
  }
});

function exQ(base) {

function curatedUnits(level) {

      exOptions(q, x.a, x.op.filter(o => o !== x.a), true);

    } else if (m === 'S1-M5') {

      exOptions(q, x.a, x.op.filter(o => o !== x.a), true);

    } else if (m === 'S3-M3') {
      const q = exQ({ examId: x.id, m, stemHtml: `<div class="small dim" style="font-size:15px">${esc(x.scene || '')}</div><div class="mt-2">${furi(x.q || '何と言いますか。')}</div>`, why, audio: '' });

function derivedQuestion(item, m) {

    q = makeGrammarQuestion(item, { forceFmt: 'g-choice' });   // the mock exam always asks the plain fill-in

function derivedUnits(level, m, need, usedKeys) {

  let pool = [];

  else if (m === 'S2-M1') pool = REG.grammar.filter(g => g.lv === level && ['choice', 'conj', 'adj'].includes(g.t || 'choice'));
  else if (m === 'S2-M2') pool = REG.grammar.filter(g => g.lv === level && g.t === 'order');
  const ranked = rankBySeen(shuffle(pool), it => 'd:' + it.key + ':' + m);
  const out = [];
  for (const it of ranked) {
    if (out.length >= need) break;
    if (usedKeys.has(it.key)) continue;
    const q = derivedQuestion(it, m);
    if (!q) continue;
    usedKeys.add(it.key);

function rankBySeen(list, idOf) {

function assemblePaper(level, size, subjects) {
  const plan = EXAM_PLAN[level];
  const si = SIZE_INDEX[size] ?? 1;
  const curated = curatedUnits(level);
  const usedKeys = new Set();
  const paper = [];
  const shortage = [];
  Object.keys(plan.mondai).forEach(m => {
    const sec = m.slice(0, 2);
    if (!subjects.includes(sec)) return;
    const want = plan.mondai[m][si];
    if (!want) return;
    let units = rankBySeen(shuffle(curated.filter(u => u.m === m)), u => u.ids[0]);
    // freshly generated AI items go first so the learner actually sees them
    if (EXAM && EXAM.prefer) units = units.filter(u => EXAM.prefer.has(u.ids[0])).concat(units.filter(u => !EXAM.prefer.has(u.ids[0])));
    units = units.slice(0, want);
    if (units.length < want) units = units.concat(derivedUnits(level, m, want - units.length, usedKeys));
    if (units.length < want) shortage.push(`${MONDAI[m].t.replace('　', ' ')}（${units.length}/${want}）`);
    units.forEach(u => u.qs.forEach(q => paper.push(Object.assign(q, { sec, mondaiTitle: MONDAI[m].t, mondaiDesc: MONDAI[m].d, isListening: sec === 'S3' }))));

function formatDuration(sec) {

function startExam(opt = {}) {
  const level = opt.level || (document.getElementById('exLevel') || {}).value || 'N5';
  const size = opt.size || (document.getElementById('exSize') || {}).value || 'std';
  const subjects = opt.subjects || $$('.exSubj').filter(x => x.checked).map(x => x.value);
  const instantEl = document.getElementById('exInstant');
  const formalEl = document.getElementById('exFormal');
  if (instantEl) state.settings.examInstant = instantEl.checked;
  if (formalEl) state.settings.examFormal = formalEl.checked;
  saveState();
  if (!subjects.length) { toast('請至少選一個科目'); return; }
  const formal = opt.formal !== undefined ? opt.formal : Boolean(state.settings.examFormal);
  EXAM = { strategy: examStrategy(), prefer: opt.prefer ? new Set(opt.prefer) : null };
  const { paper, shortage } = assemblePaper(level, size, subjects);
  if (!paper.length) { toast('題庫不足，無法組卷'); EXAM = null; return; }
  const plan = EXAM_PLAN[level];
  const fullTime = subjects.reduce((a, s) => a + plan.time[s], 0);
  const factor = size === 'full' ? 1 : size === 'std' ? 0.5 : 15 / fullTime;
  const sections = ['S1', 'S2', 'S3'].filter(sec => paper.some(q => q.sec === sec)).map(sec => {
    const idx = paper.map((q, i) => (q.sec === sec ? i : -1)).filter(i => i >= 0);
    return { sec, limitMin: Math.max(3, Math.round(plan.time[sec] * factor)), from: idx[0], to: idx[idx.length - 1], start: null, end: null };
  });
  if (formal) {
    // 聴解 問題3・4: the replies are only spoken, as in the real test
    paper.forEach(q => {
      if (q.m !== 'S3-M3' && q.m !== 'S3-M4') return;
      q.audioOptions = true;
      if (q.m === 'S3-M3') q.audio = '';   // the scene is read on screen; the replies are played per option
    });
  }
  const sizeLabel = { mini: '迷你', std: '標準', full: '完整' }[size];
  EXAM = Object.assign(EXAM, {
    level, size, subjects, paper, idx: 0, answers: new Array(paper.length).fill(-1), locked: new Array(paper.length).fill(false),
    title: `JLPT ${level} 模擬考（${sizeLabel}・${paper.length} 題${formal ? '・正式模式' : ''}）${opt.ai ? '・含 AI 新題' : ''}`, isAi: Boolean(opt.ai),
    start: Date.now(), limitMin: sections.reduce((a, s) => a + s.limitMin, 0), instant: formal ? false : state.settings.examInstant,
    finished: false, shortage, formal, sections, secIdx: 0

  sections[0].start = Date.now();
  if (shortage.length && size === 'full') toast(`部分大題題庫不足：${shortage.slice(0, 3).join('、')}${shortage.length > 3 ? '…' : ''}`, 4200);
  go('#/exam/run');
}

function scoreExam() {
  const P = EXAM.paper;
  const lr = P.filter(q => q.sec !== 'S3'); const li = P.filter(q => q.sec === 'S3');
  const correct = (arr) => arr.filter(q => EXAM.answers[P.indexOf(q)] === q.answer).length;
  const lrC = correct(lr); const liC = correct(li);
  let lr120 = lr.length ? Math.round(lrC / lr.length * 120) : null;
  let li60 = li.length ? Math.round(liC / li.length * 60) : null;
  // a single-subject paper is extrapolated so the total stays comparable
  if (lr120 === null && li60 !== null) lr120 = li60 * 2;
  if (li60 === null && lr120 !== null) li60 = Math.round(lr120 / 2);
  const total = (lr120 || 0) + (li60 || 0);
  const pass = EXAM_PLAN[EXAM.level].pass;
  const passed = total >= pass && lr120 >= 38 && li60 >= 19;
  const byM = {};
  P.forEach((q, i) => { const k = q.m; byM[k] = byM[k] || { n: 0, c: 0, t: q.mondaiTitle }; byM[k].n++; if (EXAM.answers[i] === q.answer) byM[k].c++; });
  // 参考情報 on the official report: A ≥ 67%, B ≥ 34%, C below
  const share = (pred) => { const idx = P.map((q, i) => (pred(q) ? i : -1)).filter(i => i >= 0); return idx.length ? idx.filter(i => EXAM.answers[i] === P[i].answer).length / idx.length : null; };
  const grade = (r) => (r === null ? '—' : r >= 0.67 ? 'A' : r >= 0.34 ? 'B' : 'C');
  const refVocab = grade(share(q => q.sec === 'S1'));
  const refGrammar = grade(share(q => ['S2-M1', 'S2-M2', 'S2-M3'].includes(q.m)));
  return { lrC, lrN: lr.length, liC, liN: li.length, lr120, li60, total, pass, passed, byM, correct: lrC + liC, n: P.length, lrOnly: !li.length, liOnly: !lr.length, refVocab, refGrammar };
}

const ADJ_ROWS = {
  i: [['kunai', '否定'], ['katta', '過去'], ['kunakatta', '過去否定'], ['kute', 'て形（連接）'], ['ku', '副詞形'], ['kereba', '條件形（ば）'], ['sou', '看起來（そう）'], ['sugiru', '太…（すぎる）']],

};
const GODAN_RU = new Set(['帰る', 'かえる', '入る', 'はいる', '走る', 'はしる', '切る', 'きる', '知る', 'しる', '要る', 'いる', '減る', 'へる', '限る', 'かぎる', '滑る', 'すべる', 'しゃべる', '喋る', '焦る', 'あせる', '蹴る', 'ける', '参る', 'まいる', '握る', 'にぎる', '散る', 'ちる']);
const E_I_RU = /[えけせてねへめれげぜでべぺいきしちにひみりぎじびぴ]る$/;

// Look the word up first; fall back to the shape of the ending.
function detectWordType(w) {
  const hit = REG.vocab.find(v => jaPlain(v.w) === w || v.r === w);
  if (hit && ['v5', 'v1', 'vs', 'vk', 'i', 'na'].includes(hit.p)) {
    return { kind: hit.p, word: jaPlain(hit.w), reading: hit.r, meaning: hit.m, sure: true };
  }
  if (/する$/.test(w)) return { kind: 'vs', word: w, sure: false };
  if (w === '来る' || w === 'くる') return { kind: 'vk', word: '来る', sure: true };
  if (/る$/.test(w)) {
    if (GODAN_RU.has(w)) return { kind: 'v5', word: w, sure: false };
    if (E_I_RU.test(w)) return { kind: 'v1', word: w, sure: false };
    if (/[一-鿿]る$/.test(w) && w.length === 2) return { kind: 'v1', word: w, sure: false };
    return { kind: 'v5', word: w, sure: false };
  }
  if (/[うくぐすつぬぶむ]$/.test(w)) return { kind: 'v5', word: w, sure: false };
  if (/い$/.test(w)) return { kind: 'i', word: w, sure: false };
  return { kind: 'na', word: w, sure: false };
}
const KIND_LABEL = { v5: '五段動詞（第一類）', v1: '一段動詞（第二類）', vs: 'する動詞（第三類）', vk: '来る（第三類）', i: 'い形容詞', na: 'な形容詞' };

function conjTableHtml(raw, forced) {
  const w = String(raw || '').trim();
  if (!w) return '';
  const det = detectWordType(w);
  const kind = forced && forced !== 'auto' ? forced : det.kind;
  const word = det.word || w;
  let rows = '';
  if (['v5', 'v1', 'vs', 'vk'].includes(kind)) {
    const g = GROUP_OF_POS[kind];
    rows = CONJ_ROWS.map(([f, label, lv]) => {
      const out = JConj.conjVerb(word, g, f);
      if (!out) return '';
      return `<tr><td class="small muted nowrap">${label}</td><td class="jp" style="font-size:17px">${furi(out)}</td><td class="tiny muted">${lv}</td><td style="text-align:right"><button type="button" class="btn btn-sm btn-ghost btn-icon" data-act="speak" data-text="${esc(out)}" aria-label="朗讀">${icon('speaker')}</button></td></tr>`;
    }).join('');
  } else {
    rows = [['dict', '辭書形']].concat(ADJ_ROWS[kind] || []).map(([f, label]) => {
      const out = JConj.conjAdj(word, kind, f);
      if (!out) return '';
      return `<tr><td class="small muted nowrap">${label}</td><td class="jp" style="font-size:17px">${furi(out)}</td><td></td><td style="text-align:right"><button type="button" class="btn btn-sm btn-ghost btn-icon" data-act="speak" data-text="${esc(out)}" aria-label="朗讀">${icon('speaker')}</button></td></tr>`;
    }).join('');
  }
  const note = forced && forced !== 'auto' ? '已依你的選擇變化。' : det.sure ? `單字表裡的詞性：${KIND_LABEL[kind]}${det.meaning ? `・${esc(det.meaning)}` : ''}` : `依字尾判斷為${KIND_LABEL[kind]}，如果不對請在右邊手動選擇。`;
  return `<div class="small dim mb-2">${note}</div><div class="table-wrap"><table class="table"><tbody>${rows}</tbody></table></div>`;
}

  [/てしま|ちゃ[っうい]/, '〜てしまう', '完了，或做了不該做的事（遺憾）。'], [/ところ/, '〜ところ', '正要／正在／剛剛（看前面的形）。']
];
const PARTICLE_NOTES = [
  ['に', '「に」：時間點、存在的位置、移動的目的地、動作的對象。'], ['で', '「で」：動作發生的場所、手段或工具、範圍。'],
  ['を', '「を」：動作的對象，或離開、經過的地方。'], ['が', '「が」：主語、喜好與能力的對象、存在的主體。'],
  ['へ', '「へ」：移動的方向。'], ['から', '「から」：起點，或原因。'], ['まで', '「まで」：終點、範圍的結束。'], ['と', '「と」：和（一起）、引用。']
];
function offlineAnalysis(text) {
  const s = String(text || '').trim();
  if (!s) return '';
  const words = [];
  const seen = new Set();
  REG.vocab.filter(v => v.builtin).forEach(v => {
    const w = jaPlain(v.w);
    if (w.length < 2 && !HAS_KANJI.test(w)) return;
    let hit = s.includes(w);
    if (!hit && GROUP_OF_POS[v.p]) {
      const stem = JConj.conjVerb(w, GROUP_OF_POS[v.p], 'stem');
      const te = JConj.conjVerb(w, GROUP_OF_POS[v.p], 'te');
      const nai = JConj.conjVerb(w, GROUP_OF_POS[v.p], 'nai');
      hit = [stem, te && te.slice(0, -1), nai && nai.slice(0, -2)].some(x => x && jaPlain(x).length >= 2 && s.includes(jaPlain(x)));
    }
    if (!hit && v.p === 'i') hit = s.includes(w.slice(0, -1) + 'く') || s.includes(w.slice(0, -1) + 'か');
    if (hit && !seen.has(w)) { seen.add(w); words.push(v); }
  });
  words.sort((a, b) => s.indexOf(jaPlain(a.w).slice(0, 2)) - s.indexOf(jaPlain(b.w).slice(0, 2)));
  const pats = PATTERNS.filter(([re]) => re.test(s)).slice(0, 6);
  const parts = PARTICLE_NOTES.filter(([p]) => s.includes(p)).slice(0, 4);
  return `
    <div class="panel mt-3">
      <div class="jp" style="font-size:20px;line-height:2">${furi(s)}</div>
      ${words.length ? `<div class="small muted mt-3">單字</div><div class="list">${words.slice(0, 12).map(v => `<div class="list-item"><span class="jp">${esc(jaPlain(v.w))}</span><span class="small muted jp">${esc(v.r && v.r !== v.w ? v.r : '')}</span><span class="small grow">${esc(v.m)}</span><span class="tiny muted">${esc(posLabel(v.p))}</span></div>`).join('')}</div>` : ''}
      ${pats.length ? `<div class="small muted mt-3">句型</div><ul class="small">${pats.map(([, n, d]) => `<li><b class="jp">${esc(n)}</b>：${esc(d)}</li>`).join('')}</ul>` : ''}
      ${parts.length ? `<div class="small muted mt-3">助詞提示</div><ul class="small">${parts.map(([, d]) => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}
      <div class="hint mt-2">這是離線的簡易分析（只比對單字表與常見句型）。設定 AI 後可以得到完整的翻譯與結構說明。</div>
    </div>`;
}

    <div class="row"><input class="input num" type="number" style="width:96px" min="${min}" max="${max}" step="${step}" value="${esc(state.settings[key])}" data-change="setting" data-key="${key}" data-type="num" data-min="${min}" data-max="${max}" />${unit ? `<span class="small muted">${unit}</span>` : ''}</div></div>`;
}
function boolRow(key, label, hint) {
  return `<div class="setting-row"><div><div class="label">${label}</div>${hint ? `<div class="hint">${hint}</div>` : ''}</div>
    <label class="switch"><input type="checkbox" ${state.settings[key] ? 'checked' : ''} data-change="setting" data-key="${key}" data-type="bool" /><span class="track"></span></label></div>`;

function selRow(key, label, hint, options, target = 'setting') {

  return `<div class="setting-row"><div><div class="label">${label}</div>${hint ? `<div class="hint">${hint}</div>` : ''}</div>
    <select class="select" style="width:auto;max-width:260px" data-change="${target}" data-key="${key}">${options.map(([v, l]) => `<option value="${esc(v)}" ${String(cur) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
}
function textRow(key, label, hint, target, opt = {}) {

}

// ---------- backup ----------
function downloadFile(name, text, type = 'application/json') {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function exportBackup(withKeys) {
  state.lastBackup = todayStr();
  saveState();
  const copy = deepClone(state);
  if (!withKeys) {
    if (copy.aiConfig) ['geminiKey', 'openaiKey'].forEach(k => { if (copy.aiConfig[k]) copy.aiConfig[k] = ''; });
    if (copy.ttsConfig) TTS_SECRET_KEYS.forEach(k => { if (copy.ttsConfig[k]) copy.ttsConfig[k] = ''; });
  }
  const payload = { app: 'nihongo-quest', v: 3, exportedAt: new Date().toISOString(), state: copy };
  downloadFile(`nihongo-quest-backup-${todayStr()}.json`, JSON.stringify(payload));
  toast('已下載備份');
}
function isLegacyBackup(o) { return o && !o.v && (Array.isArray(o.grammarDrills) || Array.isArray(o.vocab) || o.dailyLogs || Array.isArray(o.mistakes)); }
function applyImportedState(next, msg) {
  const keepAi = state.aiConfig; const keepTts = state.ttsConfig; const hadAi = isAiConfigured();
  state = normalizeState(next);
  // a backup saved without keys should not wipe the keys already entered here
  if (hadAi && !isAiConfigured()) state.aiConfig = keepAi;
  if (keepTts && !(state.ttsConfig && TTS_SECRET_KEYS.some(k => state.ttsConfig[k]))) state.ttsConfig = Object.assign({}, state.ttsConfig || {}, Object.fromEntries(TTS_SECRET_KEYS.map(k => [k, keepTts[k] || ''])));
  saveState(); buildRegistry(); applyTheme(); applyFurigana();
  SESSION = null; FLASH = null; EXAM = null;

function buildKanjiQueue(size = 15) {
  const t = todayStr();
  const k4 = n5KanjiLeft() === 0;
  const pool = REG.kanji.filter(k => k.lv === 'N5' || k4);
  const due = pool.filter(k => { const r = state.srs[k.key]; return r && r.due <= t; }).sort(byDue);
  const left = Math.max(0, (state.settings.newKanjiPerDay || 0) - (state.today.newK || 0));
  const fresh = newKanjiCandidates(k4).slice(0, Math.max(left, Math.min(5, size - due.length)));
  const weak = reinforcementItems(pool, new Set(due.map(x => x.key)));
  const list = due.slice(0, size);
  list.push(...fresh.slice(0, Math.max(0, size - list.length)));
  list.push(...weak.slice(0, Math.max(0, size - list.length)));
  list.push(...aheadItems(pool, new Set(list.map(x => x.key))).slice(0, Math.max(0, size - list.length)));   // then reviews due in the next two days
  return shuffle(list.slice(0, due.length)).concat(list.slice(due.length));
}

// the past week's practice, from the daily logs: 單字（含漢字）／文法／其他（聽力、閱讀、模擬考）
function weekPractice(days = 7) {
  const t = todayStr();
  return Array.from({ length: days }, (_, i) => {
    const date = addDays(t, i - (days - 1)); const e = state.dailyLogs[date] || {};
    const v = e.vocabCount || 0, g = e.grammarCount || 0, q = (e.quizCount || 0) + (e.bonusCount || 0);
    return { date, v, g, q, total: v + g + q };
