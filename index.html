<style>
:root, [data-theme="dark"] {
  --bg: #0e0f13; --bg-elev: #15161b; --bg-elev-2: #1c1d24; --bg-sunken: #0a0b0e; --bg-hover: #20222a;
  --line: #262830; --line-2: #343743;
  --fg: #ecedf1; --fg-2: #b3b6c3; --fg-3: #80838f;
  --accent: #8b9cff; --accent-fg: #0d0f1a; --accent-soft: rgba(139,156,255,.14); --accent-line: rgba(139,156,255,.45);
  --ok: #34d399; --ok-soft: rgba(52,211,153,.12); --ok-line: rgba(52,211,153,.5);
  --bad: #fb7185; --bad-soft: rgba(251,113,133,.12); --bad-line: rgba(251,113,133,.5);
  --warn: #fbbf24; --warn-soft: rgba(251,191,36,.12);
  --heat-0: #1c1d24; --heat-1: #14432f; --heat-2: #17694a; --heat-3: #1f9a68; --heat-4: #43d39a; --gauge-seen: #17694a;
  --shadow: 0 1px 2px rgba(0,0,0,.45), 0 8px 24px -12px rgba(0,0,0,.5);
  --ruby: #9ea1ad;
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: #f5f6f8; --bg-elev: #ffffff; --bg-elev-2: #f0f1f4; --bg-sunken: #e9ebef; --bg-hover: #eceef2;
  --line: #e1e3e9; --line-2: #cfd2da;
  --fg: #16171c; --fg-2: #474a55; --fg-3: #767986;
  --accent: #4b57d1; --accent-fg: #ffffff; --accent-soft: rgba(75,87,209,.09); --accent-line: rgba(75,87,209,.45);
  --ok: #04885b; --ok-soft: rgba(4,136,91,.09); --ok-line: rgba(4,136,91,.45);
  --bad: #d7264f; --bad-soft: rgba(215,38,79,.08); --bad-line: rgba(215,38,79,.45);
  --warn: #a35d00; --warn-soft: rgba(217,119,6,.1);
  --heat-0: #e6e8ed; --heat-1: #b9e8cf; --heat-2: #74cfa1; --heat-3: #2fa96f; --heat-4: #0b7a4a; --gauge-seen: #4dbd8a;
  --shadow: 0 1px 2px rgba(20,22,30,.06), 0 8px 24px -14px rgba(20,22,30,.18);
  --ruby: #6b6e79;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { touch-action: manipulation; overscroll-behavior: none; }   /* …and no rubber-band past the content (iOS 16+, Android) or pull-to-refresh */   /* no double-tap zoom; pinch zoom is off too (viewport meta + the gesture handlers below): a zoomed page breaks the one-screen layout */
body {
  background: var(--bg); color: var(--fg);
  font-family: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans JP", sans-serif;
  font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
.jp { font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans TC", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; border-right: 1px solid var(--line); background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-family: "Noto Sans JP", sans-serif; }
.brand-name { font-weight: 700; letter-spacing: .01em; }
.brand-sub { font-size: 12px; color: var(--fg-3); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--fg-2); cursor: pointer; text-align: left; font-size: 14px; }
.nav-item:hover { background: var(--bg-hover); color: var(--fg); }
.nav-item[aria-current="page"] { background: var(--bg-elev-2); color: var(--fg); font-weight: 500; }
.nav-item svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav-item .count { margin-left: auto; font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: none; position: sticky; top: 0; z-index: 20; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar-title { font-weight: 600; font-size: 15px; }
.content { width: 100%; max-width: 1000px; margin: 0 auto; padding: 28px 32px 72px; }
.content:focus { outline: none; }
.bottomnav { display: none; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .topbar { display: flex; }
  .content { padding: 16px 16px calc(92px + env(safe-area-inset-bottom)); }
  .page-head .page-title.dup-title { display: none; }   /* the topbar shows it already */
  .page-head.today-head { display: none; }   /* 今日: the card carries the date on a phone */
  .page-head .page-title.dup-title + .page-sub { margin-top: 0; }
  .page-head { margin-bottom: 14px; }
  body.practicing .content { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }   /* no tab bar while practising, so no room kept for it */
  body.practicing .content:has(.pr-next) { padding-bottom: 0; }   /* the sticky 下一題 strip carries its own bottom padding: the page ends exactly under the button */
  .bottomnav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg-elev) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
  .bottomnav button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; border: 0; background: transparent; color: var(--fg-3); font-size: 11px; cursor: pointer; border-radius: 8px; }
  .bottomnav button svg { width: 22px; height: 22px; }
  .bottomnav button[aria-current="page"] { color: var(--accent); }
}
body.practicing .sidebar, body.practicing .bottomnav, body.practicing .topbar { display: none; }
body.practicing .app { grid-template-columns: 1fr; }
body.practicing .content { max-width: 760px; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }   /* the topbar (which clears the notch) is hidden here, so the page clears it itself: in an installed app ✕ and the progress bar sat under the status bar */

/* ---------- typography ---------- */
h1, h2, h3, h4 { margin: 0; line-height: 1.35; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.page-title { font-size: 22px; font-weight: 700; letter-spacing: .01em; }
.page-sub { color: var(--fg-3); font-size: 14px; margin-top: 2px; }
.muted { color: var(--fg-3); }
.dim { color: var(--fg-2); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.center { text-align: center; }
.mt-0 { margin-top: 0; } .mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; }
.mb-0 { margin-bottom: 0; } .mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; }
.hidden { display: none !important; }

/* ---------- surfaces ---------- */
.card { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
.card + .card, .stack > * + * { margin-top: 14px; }
.grid > .card + .card { margin-top: 0; }
.card + .grid, .grid + .card, .grid + .grid, .banner + .grid { margin-top: 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-title { font-size: 15px; font-weight: 600; }
.card-sub { font-size: 13px; color: var(--fg-3); }
.panel { background: var(--bg-sunken); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 760px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.row { display: flex; align-items: center; gap: 10px; }
.row-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.divider { height: 1px; background: var(--line); margin: 14px 0; }

/* ---------- buttons & inputs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 14px; min-height: 38px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg-elev-2); color: var(--fg); cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s, transform .06s; text-decoration: none; }
.btn:hover { background: var(--bg-hover); border-color: var(--line-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, white); border-color: var(--accent); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--fg); }
.btn-danger { color: var(--bad); }
.btn-sm { min-height: 30px; padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.btn-lg { min-height: 48px; padding: 10px 20px; font-size: 16px; border-radius: 12px; }
.btn-block { width: 100%; }
.btn-icon { width: 36px; min-height: 36px; padding: 0; }
.btn svg { width: 16px; height: 16px; flex: none; }
.ico-furi { display: inline-flex; align-items: flex-end; justify-content: center; width: 18px; height: 18px; font-size: 14px; line-height: 1; flex: none; }
.ico-furi rt { font-size: 8px; color: currentColor; opacity: .75; }
.input, .select, textarea.input { width: 100%; min-height: 38px; padding: 8px 11px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg-sunken); color: var(--fg); font-size: 14px; }
.select { padding-right: 30px; }
.input:focus, .select:focus { outline: none; border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .label { font-size: 13px; color: var(--fg-2); font-weight: 500; }
.hint { font-size: 12px; color: var(--fg-3); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--bg-sunken); border: 1px solid var(--line); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--fg-2); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--bg-elev); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.2); font-weight: 500; }
.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 38px; height: 22px; border-radius: 99px; background: var(--line-2); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting-row:last-child { border-bottom: 0; }
.setting-row .label { color: var(--fg); font-size: 14px; }
.setting-row .hint { font-size: 11.5px; line-height: 1.45; opacity: 0.8; margin-top: 2px; }
.setting-row > .row, .setting-row > .btn, .setting-row > select { flex: none; }

/* ---------- chips, badges, progress ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; font-size: 12px; background: var(--bg-elev-2); color: var(--fg-2); border: 1px solid var(--line); white-space: nowrap; }
.chip-accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip-ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip-bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--bg-sunken); color: var(--fg-3); font-size: 12px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; flex: none; }
.bar { height: 8px; border-radius: 99px; background: var(--bg-sunken); overflow: hidden; border: 1px solid var(--line); }
.bar > span { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .3s; }
.bar.ok > span { background: var(--ok); }
.bar.thin { height: 5px; }
.bar.stack { height: 10px; background-repeat: no-repeat; background-size: 100% 100%; }
.bar.stack.thin { height: 6px; }
.bar.stack.grow { margin-top: 0; }
.seg-dot.mastered { background: var(--heat-4); }
.seg-dot.learned { background: var(--heat-3); }
.seg-dot.seen { background: var(--heat-2); }
.seg-dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.legs { display: flex; flex-wrap: wrap; gap: 4px 12px; } .leg { white-space: nowrap; }   /* a legend item never breaks between its name and number */
.plan-topics { display: flex; flex-direction: column; gap: 4px; margin: -6px 0 14px; color: var(--fg-2); font-size: 14px; line-height: 1.6; }
.plan-topics b { color: var(--fg-3); font-weight: 500; font-size: 12px; margin-right: 8px; }
.plan-note { background: var(--warn-soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; margin: 0 0 14px; }
.dots { display: inline-flex; gap: 3px; vertical-align: middle; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); display: inline-block; }
.dots i.on { background: var(--ok); }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat-v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat-l { font-size: 12px; color: var(--fg-3); }
.ring { position: relative; width: 96px; height: 96px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .ring-txt { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.15; }
.ring .ring-txt b { font-size: 22px; font-variant-numeric: tabular-nums; }

/* ---------- lists & tables ---------- */
.list { display: flex; flex-direction: column; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }
.list-item.clickable { cursor: pointer; border-radius: 10px; padding: 12px 10px; }
.list-item > svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.list-item.clickable:hover { background: var(--bg-hover); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-weight: 500; color: var(--fg-3); font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--bg-elev); position: sticky; top: 0; }
.table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.empty { text-align: center; color: var(--fg-3); padding: 28px 12px; font-size: 14px; }

/* ---------- today ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.hero h2 { font-size: 20px; }
.plan-line { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0 14px; color: var(--fg-2); font-size: 14px; }
.plan-line b { color: var(--fg); font-variant-numeric: tabular-nums; }
.today-seg { display: flex; margin-bottom: 12px; }
.today-seg button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.today-seg .n { font-size: 11px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.seg-live { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.install-guide ol { padding-left: 20px; margin: 4px 0 0; } .install-guide li { margin-bottom: 4px; } .install-guide p { margin: 6px 0 0; }
@media (min-width: 901px) { .hero-center .hero-date { display: none; } }   /* the page head shows the date on wide screens */
/* 練習: the ring on top, then the start button, the date and the fold tabs, all centred */
.hero.hero-center { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 14px 0 4px; }
.hero-center > .ring { order: -1; }
.hero-center > div { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; min-width: 0; }
.hero-center .hero-tabs { justify-content: center; margin: 0; }
.hero-center .hero-panel { text-align: left; width: 100%; }
.hero-center .plan-note { width: 100%; }
.listen.compact .listen-opts { position: relative; }
@media (max-width: 600px) { .listen.compact .listen-opts { padding-right: 84px; } }   /* the pills keep clear of the count at the corner */
.listen.compact .listen-count { position: absolute; right: 0; bottom: 6px; font-size: 11px; color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
/* 沉浸播放 (the full-page player): no chrome, the card fills the screen, always the landscape layout (word + meaning | example).
   A portrait viewport (iPhone cannot be turned by script) gets the whole page rotated 90°: the box is sized to the swapped
   viewport and turned around its top-left corner, so the notch (device top) ends up at the page's left edge. */
body.immersive .sidebar, body.immersive .bottomnav, body.immersive .topbar { display: none; }
body.immersive .app { grid-template-columns: 1fr; height: 100svh; } @supports (height: 1dvh) { body.immersive .app { height: 100dvh; } }
body.immersive .main { min-height: 0; background: var(--bg); }
body.immersive .content { max-width: none; flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
@media (orientation: portrait) {
  body.immersive .main { position: fixed; top: 0; left: 0; width: 100svh; height: 100svw; transform: translateX(100svw) rotate(90deg); transform-origin: top left; }
  @supports (height: 1dvh) { body.immersive .main { width: 100dvh; height: 100dvw; transform: translateX(100dvw) rotate(90deg); } }
  body.immersive .content { padding: 8px calc(8px + env(safe-area-inset-bottom, 0px)) 8px calc(8px + env(safe-area-inset-top, 0px)); }
}
body.immersive .card.listen.full { position: relative; flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; padding: 10px 16px 10px; }
body.immersive .listen.full .listen-x { position: absolute; top: 6px; right: 6px; z-index: 2; }
body.immersive .listen.full .listen-meta { position: absolute; left: 18px; bottom: 26px; font-size: 12px; white-space: nowrap; max-width: 34%; overflow: hidden; text-overflow: ellipsis; }
body.immersive .listen.full .listen-opts { position: absolute; right: 16px; bottom: 20px; margin: 0; }
.listen.full .listen-x, .listen.full .listen-meta { }   /* (in the plain full page these sit in flow via the rules below) */
body:not(.immersive) .listen.full .listen-x { float: right; } body:not(.immersive) .listen.full .listen-meta { display: block; margin-bottom: 6px; }

.lbtn svg { width: 28px; height: 28px; } .lbtn:hover { color: var(--fg); } .lbtn:active { background: var(--bg-sunken); }
.lplay { width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; cursor: pointer; box-shadow: 0 8px 24px rgba(0, 0, 0, .28); }
.lplay svg { width: 32px; height: 32px; } .lplay:active { transform: scale(.96); }
.listen-opts { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
.lopt { font: inherit; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--fg-3); cursor: pointer; white-space: nowrap; }
.lopt svg { width: 16px; height: 16px; }
.lopt-scope { padding: 0 4px; gap: 0; } .lopt-scope span { padding: 3px 7px; border-radius: 99px; color: var(--fg-3); font-size: 12px; line-height: 1.4; } .lopt-scope span.on { color: var(--accent); background: var(--accent-soft); }   /* 字｜文: both sides visible, the lit one is playing */ .lopt { min-width: 44px; justify-content: center; font-weight: 600; } .lopt.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.rate.two { grid-template-columns: repeat(2, 1fr); }
.flash .front-stem { font-size: 24px; line-height: 1.8; }
.rate .btn { flex-direction: column; gap: 0; min-height: 56px; }
.rate .btn small { font-size: 11px; color: var(--fg-3); font-weight: 400; }

/* ---------- ruby ---------- */
ruby { ruby-position: over; ruby-align: center; }
rt { font-size: .5em; color: var(--ruby); font-weight: 400; letter-spacing: .02em; user-select: none; }
body.no-furi rt { visibility: hidden; }
body.no-furi .keep-furi rt { visibility: visible; }
body.furi-smart ruby.known rt { visibility: hidden; }
/* ---------- kanji, passages, charts ---------- */
.kanji-big { font-size: 72px; line-height: 1.1; font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; }
.kanji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; }
.kanji-tile { position: relative; display: grid; place-items: center; aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-elev-2); font-size: 26px; cursor: pointer; color: var(--fg); }
.kanji-tile:hover { border-color: var(--accent-line); }
.kanji-tile.lv1 { background: var(--heat-1); } .kanji-tile.lv2 { background: var(--heat-2); } .kanji-tile.lv3 { background: var(--heat-3); color: #fff; } .kanji-tile.lv4 { background: var(--heat-4); color: #08130d; }
.kanji-tile.big { width: 88px; height: 88px; font-size: 52px; cursor: default; flex: none; }
.passage { font-size: 16px; line-height: 2; }
.chart-tip { position: fixed; z-index: 80; pointer-events: none; background: var(--bg-elev); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--fg-2); box-shadow: var(--shadow); opacity: 0; transition: opacity .1s; }
.chart-tip b { color: var(--fg); font-size: 14px; display: block; }
.chart-tip.show { opacity: 1; }
.cols { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding-top: 22px; border-bottom: 1px solid var(--line); }
.cols .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; outline: none; }
.cols .col .colbar { width: min(24px, 70%); background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.cols .col .colbar.stack { display: flex; flex-direction: column; background: transparent; overflow: hidden; }
tr.lag td { color: var(--warn, #d08a00); font-weight: 600; }
.gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.gauge { min-width: 0; } .gauge svg { width: 100%; max-width: 260px; height: auto; display: block; margin: 0 auto; }
@media (max-width: 600px) { .gauges { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .gauge svg { max-width: 170px; } .col-left { display: none; } }
.gauge .track { fill: none; stroke: var(--heat-0); }
.gauge path.arc { fill: none; outline: none; } .gauge path.arc:hover, .gauge path.arc:focus { filter: brightness(1.15); }
.gauge .arc.seen { stroke: var(--gauge-seen); } .gauge .arc.learned { stroke: var(--heat-3); } .gauge .arc.mastered { stroke: var(--heat-4); }
.gauge .tick { stroke: var(--fg-3); stroke-width: 1; opacity: .55; } .gauge .tick-l { fill: var(--fg-3); font-size: 8px; opacity: .8; }
.gauge .needle { stroke: var(--fg); stroke-width: 2.5; stroke-linecap: round; } .gauge .pivot { fill: var(--fg); }
.gauge .hero { fill: var(--fg); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; } .gauge .hero-l { fill: var(--fg-3); font-size: 11px; }
.gauge .glegend { text-align: center; } .gauge .glegend span { white-space: nowrap; display: inline-block; margin: 0 5px; } .seg-dot.gseen { background: var(--gauge-seen); }
.cseg { flex-basis: 0; min-height: 0; } .cseg.v, .seg-dot.v { background: var(--heat-4); } .cseg.g, .seg-dot.g { background: var(--heat-3); } .cseg.q, .seg-dot.q { background: var(--heat-2); }
.cols .col:hover .colbar, .cols .col:focus .colbar { filter: brightness(1.15); }
.cols .col .collabel { position: absolute; top: -20px; font-size: 12px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.col-axis { display: flex; gap: 10px; margin-top: 6px; }
.col-axis span { flex: 1; text-align: center; font-size: 11px; color: var(--fg-3); }
.barrow { display: grid; grid-template-columns: minmax(90px, 32%) 1fr auto; gap: 10px; align-items: center; padding: 6px 0; }
.barrow .track { height: 10px; border-radius: 0 4px 4px 0; background: var(--bg-sunken); overflow: hidden; outline: none; }
.barrow .fill { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.barrow .val { font-size: 12px; color: var(--fg-2); font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }

/* ---------- markdown ---------- */
.md p { margin: 0 0 8px; } .md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 4px 0 8px; padding-left: 20px; }
.md h1, .md h2, .md h3, .md h4 { font-size: 15px; margin: 12px 0 6px; }
.md code { background: var(--bg-sunken); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; font-size: .92em; }
.md pre { background: var(--bg-sunken); border: 1px solid var(--line); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
.md table { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; }
.md blockquote { margin: 6px 0; padding: 4px 12px; border-left: 3px solid var(--line-2); color: var(--fg-2); }
.md strong { color: var(--fg); }

/* ---------- modal & toast ---------- */
/* The dialog is a column: fixed header, scrolling body, (mobile) footer with a close button. Heights use the small
   viewport unit so a mobile browser's toolbar never hides the header; no backdrop-filter (Brave repaint issues). */
.modal-back { position: fixed; inset: 0; z-index: 60; background: rgba(5,6,10,.7); display: grid; place-items: center; padding: 16px; }
.modal { display: flex; flex-direction: column; width: min(720px, 100%); max-height: min(88svh, 900px); overflow: hidden; background: var(--bg-elev); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 64px -16px rgba(0,0,0,.6); }
.modal-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; background: var(--bg-elev); border-bottom: 1px solid var(--line); }
.modal-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 18px 20px; }
.modal-foot { display: none; flex: none; padding: 10px 18px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg-elev); }
.modal-title { font-weight: 600; font-size: 16px; }
@supports (height: 1dvh) { .modal { max-height: min(88dvh, 900px); } }
@media (max-width: 600px) {
  .modal-back { padding: 0; place-items: end stretch; }
  .modal { width: 100%; max-height: calc(100svh - env(safe-area-inset-top) - 8px); border-radius: 16px 16px 0 0; }
  @supports (height: 1dvh) { .modal { max-height: calc(100dvh - env(safe-area-inset-top) - 8px); } }
  .modal-foot { display: flex; justify-content: flex-end; }
}
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); z-index: 80; max-width: min(560px, calc(100vw - 32px)); padding: 10px 16px; border-radius: 12px; background: var(--fg); color: var(--bg); font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.sync-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-3); cursor: pointer; white-space: nowrap; }
.sync-chip::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3); flex: none; }
.sync-chip.is-idle::before { background: var(--ok); }
.sync-chip.is-pending::before, .sync-chip.is-syncing::before { background: var(--warn); }
.sync-chip.is-error::before { background: var(--bad); }
.topbar #syncChip { margin-left: auto; }
@media (max-width: 900px) { .toast { bottom: calc(84px + env(safe-area-inset-bottom)); } body.practicing .toast { bottom: 24px; } }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--accent-line); background: var(--accent-soft); margin-bottom: 14px; font-size: 14px; }
.banner.warn { border-color: transparent; background: var(--warn-soft); }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--accent); animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
details.disclose > summary { cursor: pointer; list-style: none; color: var(--fg-2); font-size: 14px; }
details.disclose > summary::-webkit-details-marker { display: none; }
details.disclose > summary::before { content: "▸"; display: inline-block; width: 1em; color: var(--fg-3); transition: transform .15s; }
details.disclose[open] > summary::before { transform: rotate(90deg); }
.api-guide > summary { font-weight: 600; color: var(--fg); padding: 6px 0; }
.api-steps { padding-left: 1.3em; } .api-steps li { margin: 6px 0; } .api-steps li > div { margin-top: 2px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="主選單">
    <div class="brand">
      <div class="brand-mark">日</div>
      <div><div class="brand-name">Nihongo Quest</div><div class="brand-sub">JLPT N4 學習計畫</div></div>
    </div>
    <nav class="nav" id="sideNav"></nav>
    <div class="sidebar-foot" id="sideFoot"></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="row"><div class="brand-mark">日</div><span class="topbar-title" id="topTitle">今日</span></div>
      <span id="syncChip"></span>
      <div class="row" id="topActions"></div>
    </header>
    <main id="view" class="content" tabindex="-1"></main>
  </div>
  <nav class="bottomnav" id="bottomNav" aria-label="主選單"></nav>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// ---- conj.js ----
// Japanese conjugation engine shared by the app and the content validator.
// Readings for 来る are written inline as 来[こ]ない so the UI can render ruby.
(function (root) {
  const ROWS = {
    'う': ['わ', 'い', 'う', 'え', 'お'], 'く': ['か', 'き', 'く', 'け', 'こ'], 'ぐ': ['が', 'ぎ', 'ぐ', 'げ', 'ご'],
    'す': ['さ', 'し', 'す', 'せ', 'そ'], 'つ': ['た', 'ち', 'つ', 'て', 'と'], 'ぬ': ['な', 'に', 'ぬ', 'ね', 'の'],
    'ぶ': ['ば', 'び', 'ぶ', 'べ', 'ぼ'], 'む': ['ま', 'み', 'む', 'め', 'も'], 'る': ['ら', 'り', 'る', 'れ', 'ろ']
  };
  const TE = { 'う': 'って', 'つ': 'って', 'る': 'って', 'む': 'んで', 'ぶ': 'んで', 'ぬ': 'んで', 'く': 'いて', 'ぐ': 'いで', 'す': 'して' };
  const HONORIFIC_I = new Set(['いらっしゃる', 'おっしゃる', 'くださる', 'なさる', 'ござる']);

  function stripReading(s) {
    return String(s || '').replace(/\[[^\]]*\]/g, '').replace(/（[ぁ-ゖー]+）/g, '').trim();
  }
  // Comparison key: a bracketed reading replaces the kanji run before it (来[こ]ない → こない).
  function normJa(s) {
    return String(s || '').replace(/[\u4e00-\u9fff々〆ヶ]+\[([ぁ-ゖー]+)\]/g, '$1').replace(/（[ぁ-ゖー]+）/g, '').replace(/\s+/g, '').trim();
  }

  // Basic stems for a verb. Returns null for unknown shapes.
  function verbStems(dict, g) {
    const d = String(dict || '').trim();
    if (!d) return null;
    if (g === 's' || (g !== 'k' && /する$/.test(d))) {
      const p = d.slice(0, -2);
      return { kind: 's', p, a: p + 'し', i: p + 'し', e: p + 'すれ', o: p + 'しよう', te: p + 'して', ta: p + 'した',
        pot: p + 'でき', pass: p + 'さ', caus: p + 'さ' };
    }
    if (g === 'k' || d === '来る' || d === 'くる') {
      const k = d.startsWith('来') ? '来' : '';
      const r = (kana) => k ? `来[${kana}]` : kana;
      return { kind: 'k', a: r('こ'), i: r('き'), e: r('く') + 'れ', o: r('こ') + 'よう', te: r('き') + 'て', ta: r('き') + 'た',
        pot: r('こ') + 'られ', pass: r('こ') + 'られ', caus: r('こ') + 'させ', dict: r('く') + 'る' };
    }
    if (g === '1') {
      if (!d.endsWith('る')) return null;
      const s = d.slice(0, -1);
      return { kind: '1', a: s, i: s, e: s + 'れ', o: s + 'よう', te: s + 'て', ta: s + 'た', pot: s + 'られ', pass: s + 'られ', caus: s + 'させ' };
    }
    const last = d.slice(-1);
    const row = ROWS[last];
    if (!row) return null;
    const s = d.slice(0, -1);
    let te = s + TE[last];
    let ta = te.replace(/て$/, 'た').replace(/で$/, 'だ');
    if (d === '行く' || d === 'いく') { te = s + 'って'; ta = s + 'った'; }
    let i = s + row[1];
    if (HONORIFIC_I.has(d)) i = s + 'い';
    return { kind: '5', a: s + row[0], i, e: s + row[3], o: s + row[4] + 'う', te, ta,
      pot: s + row[3], pass: s + row[0] + 'れ', caus: s + row[0] + 'せ', last };
  }

  // form keys documented in SPEC.md
  function conjVerb(dict, g, form) {
    const st = verbStems(dict, g);
    if (!st) return null;
    const isAru = (dict === 'ある');
    const dictForm = st.dict || dict;
    const nai = isAru ? '' : st.a; // ある → ない
    const potStem = st.kind === '5' ? st.pot : st.pot; // 書け / 食べられ / でき / 来られ
    const passStem = st.kind === 's' ? st.p + 'され' : (st.kind === '5' ? st.pass : st.pass);
    const causStem = st.kind === 's' ? st.p + 'させ' : (st.kind === '5' ? st.caus : st.caus);
    const map = {
      dict: dictForm,
      stem: st.i,
      masu: st.i + 'ます', masen: st.i + 'ません', mashita: st.i + 'ました', masendeshita: st.i + 'ませんでした', mashou: st.i + 'ましょう',
      te: st.te, ta: st.ta, tara: st.ta + 'ら', tari: st.ta + 'り',
      nai: nai + 'ない', nakatta: nai + 'なかった', naide: nai + 'ないで', nakereba: nai + 'なければ', nakutemo: nai + 'なくても', nakute: nai + 'なくて',
      ba: st.e + 'ば',
      pot: potStem + 'る', potmasu: potStem + 'ます', potmasen: potStem + 'ません', potmashita: potStem + 'ました', potnai: potStem + 'ない', potte: potStem + 'て',
      vol: st.o,
      pass: passStem + 'る', passmasu: passStem + 'ます', passmashita: passStem + 'ました', passte: passStem + 'て', passnai: passStem + 'ない',
      caus: causStem + 'る', causmasu: causStem + 'ます', causmashita: causStem + 'ました', causte: causStem + 'て', causnai: causStem + 'ない',
      imp: st.kind === '5' ? st.e : (st.kind === '1' ? st.i + 'ろ' : (st.kind === 's' ? st.p + 'しろ' : '来[こ]い')),
      kinshi: dictForm + 'な'
    };
    if (st.kind === '5') {
      map.pot = st.pot + 'る';
      map.vol = st.o;
      // 使役受身: 書かされる (not for す-row), 話させられる
      const cp = st.last === 'す' ? st.caus + 'られ' : (st.a + 'され');
      map.causpass = cp + 'る'; map.causpassmashita = cp + 'ました';
    } else if (st.kind === '1') {
      map.causpass = st.i + 'させられる'; map.causpassmashita = st.i + 'させられました';
    } else if (st.kind === 's') {
      map.causpass = st.p + 'させられる'; map.causpassmashita = st.p + 'させられました';
    } else {
      map.causpass = '来[こ]させられる'; map.causpassmashita = '来[こ]させられました';
    }
    if (st.kind === 'k') {
      map.vol = '来[こ]よう';
    }
    return map[form] !== undefined ? map[form] : null;
  }

  function conjAdj(word, t, form) {
    const w = String(word || '').trim();
    if (t === 'i') {
      if (!w.endsWith('い')) return null;
      const s = (w === 'いい') ? 'よ' : (w.endsWith('いい') && w.length > 2 ? w.slice(0, -2) + 'よ' : w.slice(0, -1));
      const souStem = (w === 'いい' || w.endsWith('いい')) ? s + 'さ' : (w === 'ない' ? 'なさ' : s);
      const m = {
        dict: w, stem: s, kunai: s + 'くない', katta: s + 'かった', kunakatta: s + 'くなかった', kute: s + 'くて', ku: s + 'く',
        kereba: s + 'ければ', kattara: s + 'かったら', kunakereba: s + 'くなければ', sou: souStem + 'そう', sugiru: s + 'すぎる',
        kunaidesu: s + 'くないです', kattadesu: s + 'かったです', kunakattadesu: s + 'くなかったです', kuarimasen: s + 'くありません'
      };
      return m[form] !== undefined ? m[form] : null;
    }
    if (t === 'na') {
      const m = {
        dict: w, da: w + 'だ', na: w + 'な', de: w + 'で', ni: w + 'に', desu: w + 'です', deshita: w + 'でした', datta: w + 'だった',
        janai: w + 'じゃない', janakatta: w + 'じゃなかった', jaarimasen: w + 'じゃありません', jaarimasendeshita: w + 'じゃありませんでした',
        nara: w + 'なら', sou: w + 'そう', sugiru: w + 'すぎる', datara: w + 'だったら'
      };
      return m[form] !== undefined ? m[form] : null;
    }
    return null;
  }

  function uniqPush(arr, v, answer) {
    if (!v) return;
    const n = normJa(v);
    if (!n || n === normJa(answer)) return;
    if (arr.some(x => normJa(x) === n)) return;
    arr.push(v);
  }

  // Plausible wrong options for a verb form: invalid learner errors first,
  // other real forms of the same verb only when needed to reach three.
  function verbDistractors(dict, g, form, answer) {
    const st = verbStems(dict, g);
    if (!st) return [];
    const alt = (f) => conjVerb(dict, g, f);
    const wrongGroup = (st.kind === '5' && dict.endsWith('る')) ? '1' : (st.kind === '1' ? '5' : null);
    const wg = (f) => (wrongGroup ? conjVerb(dict, wrongGroup, f) : null);
    const base = dict.slice(0, -1);
    const K = (r, tail) => `来[${r}]` + tail;
    const errors = [];
    const others = [];
    // Split a derived form into a known stem and its tail, e.g. 書かなかった → 書か + なかった
    const tailOf = (full, stemPart) => (full && stemPart && full.startsWith(stemPart) ? full.slice(stemPart.length) : '');

    if (['te', 'ta', 'tara', 'tari'].includes(form)) {
      const conv = (x) => {
        if (form === 'te') return x;
        const t = x.replace(/て$/, 'た').replace(/で$/, 'だ');
        return t + ({ ta: '', tara: 'ら', tari: 'り' })[form];
      };
      if (st.kind === '5') {
        ['って', 'んで', 'いて', 'して'].forEach(e => errors.push(conv(base + e)));
        errors.push(conv(st.i + 'て'));
      } else if (st.kind === '1') {
        errors.push(conv(st.i + 'って'), conv(st.i + 'んで'), conv(st.i + 'いて'));
      } else if (st.kind === 's') {
        errors.push(conv(st.p + 'すて'), conv(st.p + 'しって'), conv(st.p + 'さて'));
      } else {
        errors.push(conv(K('く', 'て')), conv(K('こ', 'て')), conv(K('き', 'って')));
      }
      if (wg(form)) errors.unshift(wg(form));
      others.push(alt('dict'), alt('nai'));
    } else if (/^na/.test(form)) {
      const tail = dict === 'ある' ? alt(form) : tailOf(alt(form), st.a);
      if (st.kind === '5') {
        if (st.last === 'う') errors.push(base + 'あ' + tail);
        errors.push(dict + tail, st.i + tail, base + ROWS[st.last][4] + tail);
        if (dict === 'ある') errors.unshift('あら' + tail);
      } else if (st.kind === '1') {
        errors.push(st.i + 'ら' + tail, dict + tail, st.i + 'り' + tail);
      } else if (st.kind === 's') {

function normalizeState(s) {
  stateRev++;
  if (typeof DAILY_CACHE !== 'undefined') DAILY_CACHE = null;
  const base = defaultState();
  const out = Object.assign(base, s || {});
  out.settings = Object.assign(defaultSettings(), (s && s.settings) || {});
  // v65: 每日目標 became 每天負荷上限 (a brake, not a target); an old goal below 40 would brake every day
  if (!(s && s.settings && 'loadCap' in s.settings)) out.settings.loadCap = Math.max(40, Number(out.settings.dailyGoal) || 0);
  delete out.settings.dailyGoal;
  // v69: the v65 default of 40 became 100 (reviews are never cut, so 40 braked the new items within weeks); raised once, a cap set by hand stays
  if (out.settings.loadCap === 40 && !out.settings.capRaised) out.settings.loadCap = 100;
  out.settings.capRaised = true;
  // 1.0.15: no longer settings — the speech switches are always on, 複習強度 follows the review accuracy (autoRetention), 入門 ends by itself
  ['autoSpeak', 'listening', 'audioOptions', 'retention'].forEach(k => { delete out.settings[k]; });
  delete out.preDoneDismissed;
  ['srs', 'dailyLogs', 'questionHistory', 'unitAiNotes', 'statsFmt', 'stageTests'].forEach(k => { if (!out[k] || typeof out[k] !== 'object' || Array.isArray(out[k])) out[k] = {}; });
  ['vocab', 'customGrammar', 'customExam', 'hidden', 'mistakes', 'examHistory', 'completedUnits', 'recent', 'reviewRecent', 'notices', 'lessonSeen'].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  if (!DATA.UNITS.some(u => u.id === out.currentUnit)) out.currentUnit = 'm1';
  if (out.stage !== 'pre' && out.stage !== 'main') out.stage = 'main';   // 入門階段 (1.0.6); accounts from before it are in the main course
  if (typeof out.kanaKnown !== 'boolean') out.kanaKnown = false;
  if (!out.themeLane || !Array.isArray(out.themeLane.order)) out.themeLane = { order: [], count: {} };
  if (!out.themeLane.count || typeof out.themeLane.count !== 'object') out.themeLane.count = {};
  // 1.0.8: themes were renamed per level; an old lane order keeps its place under the new names
  const mig = (c) => THEME_ORDER.includes(c) ? c : (THEME_MIGRATE[c] || c);   // a current name (入門 問候) is never an old one
  out.themeLane.order = [...new Set(out.themeLane.order.map(mig))];
  out.themeLane.count = Object.fromEntries(Object.entries(out.themeLane.count).map(([c, n]) => [mig(c), n]));
  if (!out.today || out.today.date !== todayStr()) out.today = { date: todayStr(), newV: 0, newG: 0, newK: 0, newL: 0, newR: 0, newC: 0, newA: 0 };
  Object.values(out.srs).forEach(ensureFsrs);
  Object.entries(out.srs).forEach(([k, r]) => { if (k.startsWith('v:') && (!r.f || typeof r.f !== 'object')) r.f = {}; });   // words answered before per-format tracking
  if (out.aiConfig && out.aiConfig.geminiModel === 'gemini-3.8-flash') out.aiConfig.geminiModel = 'auto';   // the old default name: auto picks a live model
  // built-in words merged into another entry (名詞 + 名詞する → one card): the record follows; when both exist the one answered more stays
  Object.entries(DATA.VOCAB_MERGED || {}).forEach(([from, to]) => {
    const a = out.srs['v:' + from]; if (!a) return;
    const b = out.srs['v:' + to];
    if (!b || (a.n || 0) > (b.n || 0)) out.srs['v:' + to] = a;
    delete out.srs['v:' + from];
  });
  return out;
}

async function loadState() {
  const stored = await Store.get('state');
  if (stored) {
    try { state = normalizeState(stored); return 'loaded'; } catch (e) { console.warn('stored state invalid', e); }
  }
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { storageOk = false; }
  if (raw) {
    // first run of this version: copy into IndexedDB, keep the localStorage copy as a safety net
    try { state = normalizeState(JSON.parse(raw)); await Store.set('state', state); return 'migrated'; } catch (e) { console.warn('state parse failed', e); }
  }
  let legacyRaw = null;
  try { legacyRaw = localStorage.getItem(LEGACY_KEY); } catch (e) { /* ignore */ }
  if (legacyRaw) {
    try {
      state = normalizeState(migrateLegacy(JSON.parse(legacyRaw)));
      saveState();
      return 'migrated';
    } catch (e) { console.warn('legacy migration failed', e); }
  }
  state = defaultState();   // currentUnit is m1: everyone starts at week 1 unless they pick another start in 課程
  saveState();
  return 'fresh';
}

function guessUnitFromCategory(cat, level) {
  const c = String(cat || '');
  if (/助詞/.test(c)) return 'm1';
  if (/形容詞/.test(c)) return 'm2';
  if (/動詞/.test(c)) return level === 'N4' ? 'm7' : 'm3';
  if (/N5/.test(c)) return 'm6';
  return 'm10';
}

function recommendUnit(score) {
  const s = Number(score) || 22;
  if (s < 15) return 'm1';
  if (s <= 23) return 'm2';
  if (s < 30) return 'm3';
  if (s <= 35) return 'm7';
  if (s < 42) return 'm8';
  if (s < 50) return 'm10';
  return 'm13';
}

// used for display and question formats. Answers anywhere in the app go through srsAnswer().

function recordFormat(rec, fmt, ok, field = 'f') {   // words keep `f` (counts toward 已熟練); grammar keeps `gf` (format rotation only)
  if (!rec || !fmt) return;

// answers in a row hand it back to FSRS spacing, a miss on the way restarts it. `rl` on the record is the step reached; the

// Align a reading onto a word that mixes kanji and kana: 間に合う/まにあう → [[間,ま],[に],[合,あ],[う]]
function alignReading(word, reading) {
  const segs = word.match(/[一-鿿々〆ヶ]+|[^一-鿿々〆ヶ]+/g) || [word];
  if (segs.length === 1) return KANJI_RE.test(word) ? [[word, reading]] : [[word]];
  const pattern = '^' + segs.map(sg => KANJI_RE.test(sg) ? '(.+?)' : sg.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('') + '$';
  const m = new RegExp(pattern).exec(reading);

}

// Readings for counters written after a number (7時, 30分, 3本 …). Some change with the last digit;
// irregular ones (1人, 2人, dates) are left bare.
const COUNTER_READ = {
  '時半': 'じはん', '時間': 'じかん', '時': 'じ', '円': 'えん', '年間': 'ねんかん', '年': 'ねん', '回目': 'かいめ', '回': 'かい', '枚': 'まい', '歳': 'さい', '月': 'がつ',
  '週間': 'しゅうかん', '個': 'こ', '冊': 'さつ', '台': 'だい', '度': 'ど', '番線': 'ばんせん', '番目': 'ばんめ', '番': 'ばん', '号': 'ごう', '倍': 'ばい', '万': 'まん', '点': 'てん',
  '分間': (d) => (/[134680]$/.test(d) ? 'ぷんかん' : 'ふんかん'),
  '分': (d) => (/[134680]$/.test(d) ? 'ぷん' : 'ふん'),
  '本': (d) => (/[1680]$/.test(d) ? 'ぽん' : /3$/.test(d) ? 'ぼん' : 'ほん'),
  '杯': (d) => (/[1680]$/.test(d) ? 'ぱい' : /3$/.test(d) ? 'ばい' : 'はい'),
  '匹': (d) => (/[1680]$/.test(d) ? 'ぴき' : /3$/.test(d) ? 'びき' : 'ひき'),
  '階': (d) => (/(^|[^0-9])3$/.test(d) ? 'がい' : 'かい'),
  '人': (d) => (/^[12]$/.test(d) ? null : 'にん'),
  '千': (d) => (/^3$/.test(d) ? 'ぜん' : 'せん'),
  '百': (d) => (/^3$/.test(d) ? 'びゃく' : /^[68]$/.test(d) ? 'ぴゃく' : 'ひゃく')

const COUNTER_KEYS = Object.keys(COUNTER_READ).sort((a, b) => b.length - a.length);
function counterRuby(s, i, j) {
  // digits right before position i (ASCII or full-width, commas allowed)
  let k = i; while (k > 0 && /[0-9０-９,，]/.test(s[k - 1])) k--;
  const digits = s.slice(k, i).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[,，]/g, '');
  const run = s.slice(i, j);
  const key = COUNTER_KEYS.find(c => run.startsWith(c));

  const rule = COUNTER_READ[key];
  const r = typeof rule === 'function' ? rule(digits) : rule;
  return { len: key.length, html: r ? rubyHtml(key, r) : esc(key) };
}

// Japanese text → HTML with furigana. Only whole kanji runs found in the dictionary get readings,
// so an unknown compound stays bare instead of getting a wrong reading.
function furi(text, opt = {}) {
  const s = String(text == null ? '' : text);
  let out = '';

  const bracket = /^([一-鿿々〆ヶ]+)\[([ぁ-ゖー]+)\]/;
  const isK = (c) => c !== undefined && KANJI_RE.test(c);
  while (i < s.length) {
    const ch = s[i];
    if (isK(ch)) {
      const bm = bracket.exec(s.slice(i));
      if (bm) { out += opt.plain ? esc(bm[1]) : rubyHtml(bm[1], bm[2]); i += bm[0].length; continue; }
      let j = i; while (j < s.length && isK(s[j])) j++;
      const run = s.slice(i, j);
      if (opt.plain) { out += esc(run); i = j; continue; }
      if (i > 0 && /[0-9０-９]/.test(s[i - 1])) {
        const cr = counterRuby(s, i, j);
        if (cr) { out += cr.html; i += cr.len; continue; }
      }
      let done = false;
      for (let L = Math.min(FURI_MAX, s.length - i); L >= j - i; L--) {
        const k = s.substr(i, L);
        const r = FURI.get(k);
        if (!r) continue;
        // a key ending in kanji must end exactly where the kanji run ends
        if (isK(k[k.length - 1]) && isK(s[i + L])) continue;
        out += rubyHtml(k, r, knownCls(k)); i += L; done = true; break;
      }
      if (!done) {
        const seg = segmentRun(run, s.slice(j, j + FURI_MAX));
        if (seg) { out += seg.segs.map(([k, r]) => rubyHtml(k, r, knownCls(k))).join(''); i = j + seg.extra; }
        else { out += esc(run); i = j; }
      }
      continue;
    }
    if (ch === '[') {
      const close = s.indexOf(']', i);
      if (close > i && /^[ぁ-ゖー]+$/.test(s.slice(i + 1, close))) { i = close + 1; continue; }
    }
    // kana-initial keys such as お茶 / ご飯 / バス停 / パン屋 (one or more kana, then kanji within the key)
    if (!opt.plain && KANJI_RE.test(s.substr(i + 1, Math.max(0, FURI_MAX - 1)))) {
      let done = false;
      for (let L = Math.min(FURI_MAX, s.length - i); L >= 2; L--) {
        const k = s.substr(i, L);
        if (!KANJI_RE.test(k)) continue;
        const r = FURI.get(k);
        if (!r) continue;
        if (isK(k[k.length - 1]) && isK(s[i + L])) continue;
        let j = i + 1; while (j < s.length && isK(s[j])) j++;

        out += rubyHtml(k, r, knownCls(k)); i += L; done = true; break;
      }

}

// Split a kanji run into known words (日本語学校 → 日本語 + 学校). Inner pieces need two or more kanji;
// only the last piece may be a single kanji, and then only together with its okurigana
// (一番好き → 一番 + 好き), so a compound like 夜中 is never read as 夜 + 中.
function segmentRun(run, after) {
  const n = run.length;
  if (n < 3) return null;
  const best = new Array(n + 1).fill(null);
  best[0] = [];
  for (let a = 0; a < n; a++) {
    if (!best[a]) continue;
    for (let b = a + 2; b <= n; b++) {
      const k = run.slice(a, b);
      const r = FURI.get(k);
      if (!r) continue;
      const cand = best[a].concat([[k, r]]);
      if (!best[b] || cand.length < best[b].length) best[b] = cand;
    }
  }
  if (best[n]) return { segs: best[n], extra: 0 };
  const tail = String(after || '').match(/^[ぁ-ゖ]*/)[0];
  for (let a = n - 1; a >= 2; a--) {
    if (!best[a]) continue;
    for (let L = Math.min(FURI_MAX, n - a + tail.length); L > n - a; L--) {
      const k = run.slice(a) + tail.slice(0, L - (n - a));
      const r = FURI.get(k);
      if (r) return { segs: best[a].concat([[k, r]]), extra: L - (n - a) };
    }
  }
  return null;
}

// Chinese text with a few inline readings (「来[こ]られる」): only the bracketed words become ruby, so
// Chinese words are never given Japanese readings by the dictionary
function bracketRuby(s) {
  return esc(s).replace(/([一-鿿々〆ヶ]+)\[([ぁ-ゖー]+)\]/g, (m, k, r) => rubyHtml(k, r));
}

// Prompts keep the blank as typed (legacy ones pad it: （早い → 　　　）); show a short, even blank instead
function tidyPrompt(s) { return String(s || '').replace(/\s*(→|->)[\s　]*）/g, ' → ＿＿）').replace(/（[\s　]*）/g, '（＿＿）'); }

// Turn legacy "来なくても（こなくても）" into bracket syntax "来[こ]なくても"
function parenReadingToBracket(s) {
  const m = /^(.*?)（([ぁ-ゖー]+)）$/.exec(String(s || ''));
  if (!m || !KANJI_RE.test(m[1])) return s;
  const parts = alignReading(m[1], m[2]);
  if (parts.length === 1 && parts[0].length === 2 && m[1] === parts[0][0]) return `${m[1]}[${m[2]}]`;
  return parts.map(([w, r]) => (r ? `${w}[${r}]` : w)).join('');
}

// ---------- markdown (explanations, AI answers) ----------
function mdInline(line) {
  let s = esc(line);
  s = s.replace(/([一-鿿々〆ヶ]+)\[([ぁ-ゖー]+)\]/g, (m, k, r) => rubyHtml(k, r));   // 来[こ]られる
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__(.+?)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<strong>$2</strong>');
  return s;
}
function md(raw) {
  if (!raw) return '';
  const lines = String(raw).replace(/\r\n/g, '\n').trim().split('\n');
  let html = ''; let ul = false; let ol = false; let code = null; let table = [];
  const closeLists = () => { if (ul) { html += '</ul>'; ul = false; } if (ol) { html += '</ol>'; ol = false; } };
  const flushTable = () => {
    if (!table.length) return;
    html += '<table>' + table.map((r, i) => '<tr>' + r.map(c => `<${i ? 'td' : 'th'}>${mdInline(c.trim())}</${i ? 'td' : 'th'}>`).join('') + '</tr>').join('') + '</table>';
    table = [];
  };
  for (const raw of lines) {
    const t = raw.trim();
    if (t.startsWith('```')) { closeLists(); flushTable(); if (code === null) code = []; else { html += `<pre><code>${esc(code.join('\n'))}</code></pre>`; code = null; } continue; }
    if (code !== null) { code.push(raw); continue; }
    if (t.startsWith('|') && t.endsWith('|') && t.length > 2) { closeLists(); if (!/^\|[\s\-:|]+\|$/.test(t)) table.push(t.slice(1, -1).split('|')); continue; }
    flushTable();
    if (!t) { closeLists(); continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { closeLists(); html += '<hr/>'; continue; }
    const h = /^(#{1,4})\s+(.+)$/.exec(t);
    if (h) { closeLists(); html += `<h4>${mdInline(h[2])}</h4>`; continue; }
    if (t.startsWith('>')) { closeLists(); html += `<blockquote>${mdInline(t.replace(/^>+\s*/, ''))}</blockquote>`; continue; }
    const li = /^[-*•]\s+(.+)$/.exec(t);
    if (li) { if (ol) { html += '</ol>'; ol = false; } if (!ul) { html += '<ul>'; ul = true; } html += `<li>${mdInline(li[1])}</li>`; continue; }
    const oli = /^\d+[.)]\s+(.+)$/.exec(t);
    if (oli) { if (ul) { html += '</ul>'; ul = false; } if (!ol) { html += '<ol>'; ol = true; } html += `<li>${mdInline(oli[1])}</li>`; continue; }
    closeLists();
    html += `<p>${mdInline(t)}</p>`;
  }
  if (code !== null) html += `<pre><code>${esc(code.join('\n'))}</code></pre>`;
  closeLists(); flushTable();
  return `<div class="md">${html}</div>`;
}

    const isV = t === 'conj';
    const slot = isV ? '{V}' : '{A}';
    const idx = String(g.jp).indexOf(slot);
    if (idx < 0) return null;
    const pre = g.jp.slice(0, idx); const post = g.jp.slice(idx + slot.length);
    const base = isV ? g.v : g.w;
    const ans = isV ? JConj.conjVerb(g.v, g.g, g.f) : JConj.conjAdj(g.w, g.k, g.f);
    if (!ans) return null;
    let wrongs = isV ? JConj.verbDistractors(g.v, g.g, g.f, ans) : JConj.adjDistractors(g.w, g.k, g.f, ans);
    if (wrongs.length < 3) return null;
    // keep at most one real (grammatical) form among the distractors; show the translation when one is used
    const real = isV ? new Set(VERB_FORMS.map(f => JConj.normJa(JConj.conjVerb(g.v, g.g, f) || ''))) : new Set((g.k === 'i' ? I_FORMS : NA_FORMS).map(f => JConj.conjAdj(g.w, g.k, f)));
    const errs = wrongs.filter(w => !real.has(isV ? JConj.normJa(w) : w));
    const reals = wrongs.filter(w => real.has(isV ? JConj.normJa(w) : w));
    let chosen = shuffle(errs.slice(0, 4)).slice(0, 3);
    if (chosen.length < 3) chosen = chosen.concat(reals.slice(0, 3 - chosen.length));
    else if (reals.length && Math.random() < 0.5) { chosen[2] = reals[0]; }
    q.forceZh = chosen.some(w => real.has(isV ? JConj.normJa(w) : w));
    const fam = formFamily(g.f || '');
    // form-identification variant for learned items
    // 食べられる / 来られる are both potential and passive, and たら・たり・ないで are not a single "form"
    const surfaceDup = isV && ['pot', 'pass'].includes(fam) && JConj.normJa(JConj.conjVerb(g.v, g.g, 'pass') || '') === JConj.normJa(JConj.conjVerb(g.v, g.g, 'pot') || '');
    const identifiable = !['tara', 'tari', 'naide', 'nakereba', 'nakutemo', 'nakute', 'kinshi', 'causpass', 'causpassmashita', 'stem'].includes(g.f);
    if (isV && rec && rec.b >= 2 && FORM_LABEL[fam] && identifiable && !surfaceDup && !ctx.encore && !ctx.forceFmt && Math.random() < 0.3) {   // not for an encore (that is the spelled version) nor a forced format
      const pool = g.lv === 'N4' ? ['pot', 'pass', 'caus', 'vol', 'ba', 'te', 'nai', 'imp'] : ['te', 'ta', 'nai', 'dict', 'masu'];
      const others = shuffle(pool.filter(f => f !== fam)).slice(0, 3);
      if (others.length === 3) {
        q.fmt = 'g-identify';
        q.instr = '畫線的動詞是哪一種形？';
        q.stemHtml = `${furi(pre)}<span class="uline">${furi(ans)}</span>${furi(post)}`;
        q.fullJp = pre + ans + post;
        q.mistakePrompt = `${jaPlain(pre)}【${jaPlain(ans)}】${jaPlain(post)} 是哪一種形？`;
        q.why = `「${jaPlain(ans)}」是「${base}」的${FORM_LABEL[fam]}。${g.why ? '\n\n' + g.why : ''}`;
        finalizeOptions(q, FORM_LABEL[fam], others.map(f => FORM_LABEL[f]), false);
        q.answerText = FORM_LABEL[fam];
        return q;
      }
    }
    // 輸入模式: the learner spells the form with kana tiles or types it (no options to eliminate)
    const typedFmt = isV ? 'g-conj-type' : 'g-adj-type';
    const avoid = ctx.encore ? [].concat(ctx.avoidFmts || ctx.avoidFmt || []) : [];   // only an encore is steered by the formats used; an ordinary question follows mastery
    const choiceFmt = isV ? 'g-conj' : 'g-adj';
    let mode = ctx.forceFmt === typedFmt ? (state.settings.conjInput === 'type' ? 'type' : 'tiles')
      : (ctx.forceFmt === 'g-conj' || ctx.forceFmt === 'g-adj') ? 'choice' : conjInputMode(rec, ctx);
    if (!ctx.forceFmt && avoid.length) {   // 換個方式再考: the format not yet used this session
      if (avoid.includes(choiceFmt) && !avoid.includes(typedFmt)) mode = state.settings.conjInput === 'type' ? 'type' : 'tiles';
      else if (avoid.includes(typedFmt) && !avoid.includes(choiceFmt)) { if ((state.settings.conjInput || 'auto') === 'auto') mode = 'choice'; else return null; }
    }
    if (mode !== 'choice') {
      q.fmt = typedFmt; q.custom = typedFmt; q.inputMode = mode;
      q.instr = mode === 'tiles' ? (isV ? '點假名，拼出正確的動詞變化' : '點假名，拼出正確的形容詞變化') : (isV ? '輸入正確的動詞變化' : '輸入正確的形容詞變化');
      q.stemHtml = `${furi(pre)}${blankChip(base)}${furi(post)}`;
      q.fillHtml = furi(ans);
      q.fullJp = pre + ans + post;
      q.mistakePrompt = `${pre}（${base}→　）${post}`;
      if (!q.why) q.why = `「${base}」→「${jaPlain(ans)}」`;
      q.tiles = conjTiles(ans, wrongs);
      q.options = [{ text: ans, jp: true }, { text: '', jp: true }]; q.answer = 0; q.answerText = ans;
      return q;
    }
    q.fmt = isV ? 'g-conj' : 'g-adj';
    q.instr = isV ? '選出正確的動詞變化' : '選出正確的形容詞變化';
    q.stemHtml = `${furi(pre)}${blankChip(base)}${furi(post)}`;
    q.fillHtml = furi(ans);
    q.fullJp = pre + ans + post;
    q.mistakePrompt = `${pre}（${base}→　）${post}`;
    if (!q.why) q.why = `「${base}」→「${jaPlain(ans)}」`;
    finalizeOptions(q, ans, chosen, true);
    q.wide = q.options.some(o => jaPlain(o.text).length > 9);
    return q;
  }
  return null;
}

// ---------- 假名辨識 (kind a) ----------
// First look: 看字選音 (the character is shown and spoken, like a preview). Afterwards 聽音選字 2 : 看字選音 1 : 平片對照 1.
function makeKanaQuestion(item, ctx = {}) {
  const rec = srsGet(item.key);
  const b = rec ? rec.b : -1;
  let fmt = ctx.forceFmt;
  if (!fmt) {
    if (b < 0) fmt = 'a-read';
    else { const bag = (speechAvailable() ? ['a-sound', 'a-sound', 'a-read', 'a-pair'] : ['a-read', 'a-pair']).filter(f => f !== ctx.avoidFmt); fmt = bag[Math.floor(Math.random() * bag.length)] || 'a-read'; }   // 聽音選字 only when something can play it
  }
  const other = item.script === 'hira' ? '片假名' : '平假名';
  const q = baseQ(item);
  q.cat = '假名'; q.lv = 'PRE_N5'; q.point = '假名辨識';
  q.label = `假名 · ${item.script === 'hira' ? '平假名' : '片假名'}`;
  q.why = `「${item.ch}」讀 ${item.roma}，${other}是「${item.pair}」。`;
  q.mistakePrompt = `假名「${item.ch}」`;
  q.speakWord = item.ch;
  const looks = kanaLookalikes(item);
  if (fmt === 'a-read') {
    const wrongs = []; looks.forEach(c => { const r = KANA_ROMAJI[c] || KANA_ROMAJI[Object.keys(KATA).find(h => KATA[h] === c)]; if (r && r !== item.roma && !wrongs.includes(r) && wrongs.length < 3) wrongs.push(r); });
    const all = ['ka', 'sa', 'ta', 'na', 'ma', 'ra', 'ya', 'wa', 'ki', 'su', 'te', 'no', 'mi', 'ru', 'he', 'yu'];
    shuffle(all).forEach(r => { if (wrongs.length < 3 && r !== item.roma && !wrongs.includes(r)) wrongs.push(r); });
    q.fmt = 'a-read'; q.instr = '這個假名怎麼讀？';
    q.stemHtml = `<span class="kanji-big jp">${esc(item.ch)}</span>`; q.stemClass = 'word';
    finalizeOptions(q, item.roma, wrongs, false);
    if (!ctx.choiceOnly) q.audio = item.ch;   // spoken once when shown: the first look teaches the sound (not in a 階段測驗: the sound is the answer)
  } else if (fmt === 'a-sound') {
    q.fmt = 'a-sound'; q.instr = '聽到的是哪一個？';
    q.stemHtml = playButton('再聽一次');
    finalizeOptions(q, item.ch, looks.slice(0, 3), true);
    q.noFuriOptions = true;
    q.audio = item.ch;
  } else {
    const pairItem = REG.byKey.get('a:' + item.pair) || item;
    q.fmt = 'a-pair'; q.instr = `它的${other}是？`;
    q.stemHtml = `<span class="kanji-big jp">${esc(item.ch)}</span>`; q.stemClass = 'word';
    finalizeOptions(q, item.pair, kanaLookalikes(pairItem).slice(0, 3), true);
    q.noFuriOptions = true;
  }
  return q;
}

function makeQuestion(item, ctx) {
  if (ctx && ctx.choiceOnly && !ctx._inChoice) {   // 階段測驗: only a question with options; a spelled / ordered / matched format is retried, then given up
    for (let i = 0; i < 6; i++) { const q = makeQuestion(item, Object.assign({}, ctx, { _inChoice: true })); if (!q) return null; if (!q.custom) return q; }
    return null;
  }
  try {
    if (item.kind === 'a') return makeKanaQuestion(item, ctx);
    if (item.kind === 'l') return makeListenQuestion(item, ctx);
    if (item.kind === 'r') return makeReadQuestion(item, ctx);
    if (item.kind === 'k') return makeKanjiQuestion(item, ctx);
    if (item.kind === 'c') return makeConjDrillQuestion(item, ctx);
    return item.kind === 'v' ? makeVocabQuestion(item, ctx) : makeGrammarQuestion(item, ctx);
  } catch (e) {
    console.warn('question build failed', item && item.key, e);
    return null;
  }
}

// A mistake that is not linked to any current item (e.g. from the old version)
function makeMistakeCard(m) {
  const q = { id: uid('q'), key: m.key || '', mistakeId: m.id, kind: 'm', fmt: 'm-card', cat: m.cat, label: `錯題本 · ${m.cat || '綜合'}`, instr: '選出正確答案', options: [], answer: 0, why: m.why || '', point: '', stemHtml: '', zhText: '' };
  const b = splitBlank(m.prompt);
  q.stemHtml = b ? `${furi(b.pre)}${blankChip(b.hint)}${furi(b.post)}` : furi(m.prompt);
  if (b) { q.fillHtml = furi(m.answer); q.fullJp = b.pre + m.answer + b.post; }
  q.mistakePrompt = m.prompt;
  const others = new Set();
  if (m.wrong && m.wrong !== m.answer && !/^(未作答|手動|SRS|自訂)/.test(m.wrong)) others.add(m.wrong);
  shuffle(state.mistakes.filter(x => x.id !== m.id && x.cat === m.cat && x.answer && x.answer !== m.answer)).forEach(x => { if (others.size < 3) others.add(x.answer); });
  const filler = /^[ぁ-ん]{1,2}$/.test(m.answer) ? ['に', 'で', 'を', 'が', 'へ', 'と', 'は', 'から'] : shuffle(state.mistakes.map(x => x.answer).filter(a => a && a !== m.answer));
  filler.forEach(f => { if (others.size < 3 && f !== m.answer) others.add(f); });
  if (others.size < 3) return null;
  finalizeOptions(q, m.answer, [...others].slice(0, 3), /[ぁ-んァ-ン一-龯]/.test(m.answer));
  q.wide = q.options.some(o => o.text.length > 10);
  return q;
}

// ---- 52_more_questions.js ----
/* ==========================================================================
   More question types: listening, reading passages, kanji
   ========================================================================== */
function playButton(label = '再聽一次') {
  return `<div class="center"><button type="button" class="speak-big" data-act="replay">${icon('speaker')}<span>${label}</span></button>
    <div class="speech-prog" id="speechProg" hidden><div class="bar"><span></span></div><div class="tiny muted lab"></div></div></div>`;
}
// Playback progress of a listening script: line n of N, the bar advancing by the clip's real time (external engines) or
// by the length estimate (browser voice, which reports no progress), snapping at each line boundary.
const SPEECH_PROG = { token: -1, total: 0, idx: 0, start: 0, est: 0, real: null, done: false, timer: null };
function speechProgStart(token, total) { Object.assign(SPEECH_PROG, { token, total, idx: 0, start: Date.now(), est: 1, real: null, done: false }); if (!SPEECH_PROG.timer) SPEECH_PROG.timer = setInterval(renderSpeechProg, 120); renderSpeechProg(); }
function speechProgLine(i, text, rate) { Object.assign(SPEECH_PROG, { idx: i, start: Date.now(), est: 2500 + String(text).length * 350 / (rate || 1), real: null }); renderSpeechProg(); }
function speechProgEnd() { SPEECH_PROG.done = true; renderSpeechProg(); }
function renderSpeechProg() {
  const el = document.getElementById('speechProg');
  const live = SPEECH_PROG.token === speechToken && SPEECH_PROG.total > 0;
  if (!live || !el) { if (!live && SPEECH_PROG.timer) { clearInterval(SPEECH_PROG.timer); SPEECH_PROG.timer = null; } if (el && !live) el.hidden = true; return; }
  const P = SPEECH_PROG;
  const frac = P.done ? 1 : (P.idx + (P.real != null ? P.real : Math.min(0.95, (Date.now() - P.start) / P.est))) / P.total;
  el.hidden = false; el.classList.toggle('done', P.done);
  el.querySelector('.bar span').style.width = `${Math.round(frac * 100)}%`;
  el.querySelector('.lab').textContent = P.done ? '播放完畢' : `第 ${P.idx + 1} / ${P.total} 句`;
  if (P.done && P.timer) { clearInterval(P.timer); P.timer = null; }
}
// Audio-only options (q.audioOptions): each option is a play button and is spoken only when tapped; nothing is
// read in sequence, so no option can be skipped and no option number needs to be spoken.
function audioOptionHtml(i, cls, o, answerAct, disabled) {
  return `<div class="${cls} opt-audio">
      <button type="button" class="opt-play" data-act="speak" data-text="${esc(o.text)}" title="播放選項 ${i + 1}">${icon('speaker')}<span>選項 ${i + 1}</span></button>
      <button type="button" class="opt-pick" data-act="${answerAct}" data-i="${i}" ${disabled ? 'disabled' : ''}><span class="kbd">${i + 1}</span><span>選這個</span></button>
    </div>`;
}
// external engines: fetch the option clips while the learner listens to the prompt, so a tap plays at once
function prefetchSpeech(texts) {
  const cfg = ttsConfig();
  if (!cfg.engine || cfg.engine === 'browser_neural') return;
  texts.forEach(t => { const x = ttsText(t); if (x) engineBlob(x, '').catch(() => {}); });
}
// a copy of q with the options in a new order (the answer index follows)
function requeueQuestion(q, opts) {
  const again = Object.assign({}, q, { id: uid('q'), options: opts, answer: opts.indexOf(q.options[q.answer]) });
  delete again._rmap;
  return again;
}

function makeListenQuestion(it) {
  const q = baseQ(it);
  const others = (it.op || []).filter(o => o !== it.a);
  q.cat = '聽力'; q.lv = it.lv; q.unit = it.u; q.why = it.why || ''; q.wide = true;
  q.point = { dialog: '聽力：對話', resp: '聽力：即時應答', scene: '聽力：情境表達' }[it.t] || '聽力';
  const audioOnly = it.t === 'resp' || it.t === 'scene';   // replies and scene lines are only heard, like the real test
  if (it.t === 'dialog') {
    q.fmt = 'l-dialog';
    q.label = `聽力 · ${it.lv} · 對話`;
    q.instr = '先聽問題和對話，再選出答案。';
    finalizeOptions(q, it.a, others, true);
    q.stemHtml = `${playButton()}<div class="mt-3">${furi(it.q)}</div>`;
    q.audio = `${it.q}\n${it.script}\n${it.q}`;   // like the test: question, dialogue, question again
    q.audioScript = true;
    q.revealHtml = transcriptHtml(it.script, it.zh);
    q.mistakePrompt = `【聽力】${it.q}`;
  } else if (it.t === 'resp') {
    q.fmt = 'l-resp';
    q.label = `聽力 · ${it.lv} · 即時應答`;
    q.instr = '聽對方說的話，選出最合適的回應。';
    finalizeOptions(q, it.a, others, true);
    q.stemHtml = playButton();
    q.audio = it.line;
    q.audioScript = true;
    q.audioOptions = audioOnly;
    q.revealHtml = transcriptHtml(it.line, it.zh);
    q.mistakePrompt = `【聽力】${it.line}`;
  } else {
    q.fmt = 'l-scene';
    q.label = `聽力 · ${it.lv} · 情境表達`;
    q.instr = '看情境，選出最合適的說法。';
    finalizeOptions(q, it.a, others, true);
    q.stemHtml = `<div class="dim" style="font-size:17px;line-height:1.7">${esc(it.scene)}</div>`;
    if (audioOnly) q.audioOptions = true;
    q.mistakePrompt = `【情境】${it.scene}`;
  }
  q.answerText = jaPlain(it.a);
  return q;
}
function transcriptHtml(script, zh) {
  const lines = String(script || '').split('\n').filter(Boolean).map(l => `<div>${furi(l)}</div>`).join('');
  return `<div class="panel mt-3"><div class="tiny muted mb-2">原文</div><div class="jp" style="line-height:1.9">${lines}</div>
    ${zh ? `<details class="disclose mt-2"><summary>中文翻譯</summary><div class="small dim mt-2" style="white-space:pre-line">${esc(zh)}</div></details>` : ''}</div>`;
}

function makeReadQuestion(it) {
  const q = baseQ(it);
  q.cat = '閱讀'; q.lv = it.lv; q.unit = it.u; q.why = it.why || ''; q.wide = true;
  q.point = '閱讀理解';
  q.fmt = 'r-passage';
  q.label = `閱讀 · ${it.lv}`;
  q.instr = '閱讀短文，回答問題。';
  q.passageHtml = furi(it.passage).replace(/\n/g, '<br>');
  q.stemHtml = furi(it.q);
  finalizeOptions(q, it.a, (it.op || []).filter(o => o !== it.a), true);
  q.revealHtml = it.zh ? `<details class="disclose mt-2"><summary>短文的中文翻譯</summary><div class="small dim mt-2" style="white-space:pre-line">${esc(it.zh)}</div></details>` : '';
  q.mistakePrompt = `【閱讀】${it.q}`;
  q.answerText = jaPlain(it.a);
  return q;
}

// ---------- kanji ----------
// To a reader of Chinese most kanji mean what they look like (四, 木 = 樹、木頭), so practice leans on
// readings; the meaning question is kept for kanji whose meaning does not contain the kanji itself.
const kunText = (k) => (k.kun || []).map(r => r.replace(/\((.+)\)/, '（$1）')).join('・');
const kataToHira = (s) => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const kanjiReadSet = (k) => new Set((k.on || []).map(kataToHira).concat((k.kun || []).map(r => r.replace(/\(.*\)/, ''))));
const meaningShowsKanji = (k) => String(k.m || '').includes(k.k);
function kanjiReadingsHtml(k) {
  const parts = [];
  if ((k.on || []).length) parts.push(`<span class="chip">音 <span class="jp">${esc(k.on.join('・'))}</span></span>`);
  if ((k.kun || []).length) parts.push(`<span class="chip">訓 <span class="jp">${esc(kunText(k))}</span></span>`);
  return parts.join(' ');
}
// the readings as the question itself, larger than the chips
function kanjiReadingsLine(k) {
  // on a phone a long list breaks only between readings
  const part = (label, rs) => `<span style="display:inline-block;max-width:100%"><span class="small muted">${label}</span> <span class="jp">${rs.map(r => `<span class="nowrap">${esc(r)}</span>`).join('・<wbr>')}</span></span>`;
  const kun = (k.kun || []).map(r => r.replace(/\((.+)\)/, '（$1）'));
  return `<div style="line-height:1.7">${[(k.on || []).length ? part('音', k.on) : '', kun.length ? part('訓', kun) : ''].filter(Boolean).join('　　')}</div>`;
}
function kanjiWhy(k, withReadings = true) {
  const lines = k.m === k.k ? [] : [`**${k.k}**：${k.m}`];
  if (withReadings && (k.on || []).length) lines.push(`- 音讀：${k.on.join('・')}`);
  if (withReadings && (k.kun || []).length) lines.push(`- 訓讀：${kunText(k)}`);
  const ex = (k.ex || []).map(([w, r, m]) => `${w}（${r}）${m}`).join('；');
  if (ex) lines.push(`- 例：${ex}`);
  return lines.join('\n');
}
function kanjiPeers(k) { return REG.kanji.filter(x => x.key !== k.key); }

function makeKanjiQuestion(k, ctx = {}) {
  const rec = srsGet(k.key);
  const b = rec ? rec.b : -1;
  const meaningOk = !meaningShowsKanji(k);
  const pairs = b < 0 ? [[meaningOk ? 'k-meaning' : 'k-read', 1]]
    : [['k-read', 3], ['k-shape', 2]].concat(meaningOk ? [['k-meaning', b <= 2 ? 2 : 1]] : []);
  // a first look that cannot be a reading question falls back to the meaning card, which shows the readings
  const order = meaningOk || b < 0 ? ['k-meaning', 'k-read', 'k-shape'] : ['k-read', 'k-shape', 'k-meaning'];
  const q = baseQ(k);
  q.cat = '漢字'; q.lv = k.lv; q.point = '漢字';
  q.mistakePrompt = `漢字「${k.k}」`;
  q.mistakeWhy = kanjiWhy(k);
  const first = (k.ex || [])[0];
  q.speakWord = first ? first[1] : '';
  const build = (f) => {
    if (f === 'k-meaning') {
      const pool = shuffle(kanjiPeers(k)).sort((a, c) => (c.lv === k.lv) - (a.lv === k.lv));
      const opts = [];
      for (const x of pool) {
        if (!x.m || x.m === k.m || zhOverlap(x.m, k.m) || opts.some(o => o === x.m || zhOverlap(o, x.m))) continue;
        opts.push(x.m);
        if (opts.length === 3) break;
      }
      if (opts.length < 3) return false;
      q.fmt = f; q.label = `漢字 · ${k.lv} · 意思`;
      q.instr = '這個漢字的意思是？';
      q.stemHtml = `<span class="kanji-big">${esc(k.k)}</span>`; q.stemClass = 'word';
      q.subHtml = kanjiReadingsHtml(k);
      finalizeOptions(q, k.m, opts, false);
      q.answerText = k.m;
      return true;
    }
    if (f === 'k-shape') {
      // which kanji is read like this: the decoys share none of its readings, look-alikes first
      const mine = kanjiReadSet(k);
      const cands = [];
      const push = (x) => { if (x && x.key !== k.key && !cands.includes(x.k) && ![...kanjiReadSet(x)].some(r => mine.has(r))) cands.push(x.k); };
      shuffle([...new Set((k.look || []).concat(LOOKALIKE_OF[k.k] || []))]).forEach(c => { if (cands.length < 2) push(REG.byKey.get('k:' + c)); });

// The counter counts the session's planned items; an encore or a 再練一次 copy is shown apart as 加考 and moves neither number.
function sessionCount() {
  const planned = (x) => !x.encore && !x.requeued;
  const es = SESSION.entries; let before = 0, extra = 0;
  for (let i = 0; i < Math.min(SESSION.idx, es.length); i++) { if (planned(es[i])) before++; else extra++; }
  const cur = es[SESSION.idx]; const curPlanned = cur ? planned(cur) : false;
  return { before, n: before + (curPlanned ? 1 : 0), total: es.filter(planned).length, extra: extra + (cur && !curPlanned ? 1 : 0) };
}
function prCountHtml() {
  const c = sessionCount();

}

// 假名拼字 / 配對 are answered by tapping, not by picking one of four options. They still end in answerCurrent():

  }
  if (q.custom === 'g-order') {

    return `<div class="order">

      <div class="order-tiles">${q.tiles.map((p, i) => `<button type="button" class="order-tile jp" data-act="order-tap" data-i="${i}" ${used.includes(i) || answered ? 'disabled' : ''}><span class="kbd">${i + 1}</span>${furi(p)}</button>`).join('')}</div>
      ${answered ? '' : `<div class="row between mt-2"><button type="button" class="btn btn-sm btn-ghost" data-act="order-back" ${used.length ? '' : 'disabled'}>退一格</button><button type="button" class="btn btn-sm btn-ghost" data-act="custom-giveup">看答案</button></div>`}
    </div>`;
  }
  if (q.custom === 'v-match') {

      <div class="match-col">${q.words.map(w => `<button type="button" class="match-word jp ${m.matched.includes(w) ? 'matched' : ''} ${m.sel === w ? 'selected' : ''} ${m.flash && m.flash.w === w ? 'wrong-flash' : ''}" data-act="match-word" data-w="${esc(w)}" ${m.matched.includes(w) || answered ? 'disabled' : ''}>${esc(w)}</button>`).join('')}</div>
      <div class="match-col">${q.meanings.map(mm => { const done = q.pairs.some(p => p[1] === mm && m.matched.includes(p[0])); return `<button type="button" class="match-meaning ${done ? 'matched' : ''} ${m.flash && m.flash.m === mm ? 'wrong-flash' : ''}" data-act="match-meaning" data-m="${esc(mm)}" ${done || answered ? 'disabled' : ''}>${esc(mm)}</button>`; }).join('')}</div>
      ${answered ? '' : `<div class="row between small muted" style="grid-column:1/-1"><span>${m.wrong ? `錯了 ${m.wrong} 次` : m.sel ? `已選「${esc(m.sel)}」，點它的意思` : '點一個單字'}</span><button type="button" class="btn btn-sm btn-ghost" data-act="custom-giveup">我不會，看答案</button></div>`}

function finishCustom(e, ok, produced) {
  const q = e.q;

}

function srsBadge(key) {

function feedbackHtml(e) {
  const q = e.q;

  const right = q.options[q.answer];
  const full = q.fullJp && (q.fmt.startsWith('g-') || q.fmt === 'v-cloze' || q.fmt === 'm-card') ? `<div class="fb-full jp">${furi(q.fullJp)} <button type="button" class="btn btn-sm btn-ghost btn-icon" data-act="speak-full" title="朗讀">${icon('speaker')}</button></div>${q.zhText ? `<div class="small muted">${esc(q.zhText)}</div>` : ''}` : '';
