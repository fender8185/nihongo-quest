function answerCurrent(i) {
  const e = currentEntry();
  if (!e || e.done) return;
  const q = e.q;
  if (i < 0 || i >= q.options.length) return;
  e.done = true; e.chosen = i;
  const ok = i === q.answer;
  SESSION.lastFmt = q.fmt;
  if (SESSION.test) {   // 階段測驗: score only — no SRS, notebook, logs, encores or 再練一次
    SESSION.stats[ok ? 'correct' : 'wrong']++;
    SESSION.results.push({ key: q.key, ok, q, chosen: i });
    if (SESSION.results.length === SESSION.entries.length) finishStageTest();
    renderPractice(); speakAnswered(q);
    return;
  }
  if (!ok && !e.encore && !e.requeued) {   // kept so 「手滑，不算」 can put everything back
    const m0 = state.mistakes.find(x => (q.key && x.key === q.key) || x.prompt === (q.mistakePrompt || q.plainStem || ''));
    const t = todayStr();
    e.undo = {
      srs: q.key && state.srs[q.key] ? JSON.parse(JSON.stringify(state.srs[q.key])) : null,
      mistake: m0 ? JSON.parse(JSON.stringify(m0)) : null,
      mistakesLen: state.mistakes.length,
      today: Object.assign({}, state.today),
      logDate: t,
      dailyLog: state.dailyLogs[t] ? JSON.parse(JSON.stringify(state.dailyLogs[t])) : null,
      themeLane: state.themeLane ? JSON.parse(JSON.stringify(state.themeLane)) : null,
      currentUnit: state.currentUnit,
      completedUnits: (state.completedUnits || []).slice(),
    };
  }
  // the 再練一次 copy is a learning step: it counts as a question done today, nothing else (the first answer set the schedule)
  if (e.requeued) {
    recordAction(q.kind === 'v' || q.kind === 'k' || q.kind === 'a' ? 'v' : q.kind === 'g' || q.kind === 'c' ? 'g' : 'q', null, q.kind === 'c' ? 'g' : q.kind);
    SESSION.stats[ok ? 'correct' : 'wrong']++;
    SESSION.results.push({ key: q.key, ok, q, chosen: i, requeued: true });
    saveState(); renderPractice(); speakAnswered(q);
    return;
  }
  if (['v', 'g', 'l', 'r', 'k', 'c', 'a'].includes(q.kind) && !e.encore) {
    e.srs = srsAnswer(q.key, ok);
    if (e.srs.isNew) SESSION.stats.newCount++;
  }
  if (q.kind === 'v' && q.fmt && q.fmt.startsWith('v-')) recordFormat(state.srs[q.key], q.fmt, ok);
  if (q.kind === 'g' && q.item && ((q.item.t || 'choice') === 'choice' || (q.fmt && q.fmt.endsWith('-type'))) && q.fmt) recordFormat(state.srs[q.key], q.fmt, ok, 'gf');
  // a new word comes back once more in another format; so does a new grammar item answered right (a miss gets the 再練一次 copy instead)
  if (e.srs && e.srs.isNew && (q.kind === 'v' || (q.kind === 'g' && ok && grammarHasFormats(q.item)))) scheduleEncores(e, ok);
  if (q.fmt) {
    const f = state.statsFmt[q.fmt] || (state.statsFmt[q.fmt] = { ok: 0, ng: 0 });
    if (ok) f.ok++; else f.ng++;
  }
  const topic = q.kind === 'g' ? unitById(q.unit).short : q.kind === 'c' ? '變化練習' : q.kind === 'v' ? `單字「${jaPlain(q.item.w)}」` : q.kind === 'k' ? `漢字「${q.item.k}」` : q.kind === 'a' ? `假名「${q.item.ch}」` : q.kind === 'l' ? '聽力' : q.kind === 'r' ? '閱讀' : null;
  recordAction(q.kind === 'v' || q.kind === 'k' || q.kind === 'a' ? 'v' : q.kind === 'g' || q.kind === 'c' ? 'g' : 'q', topic, q.kind === 'c' ? 'g' : q.kind);
  recordAccuracy(ok);
  if (ok) {
    SESSION.stats.correct++;
    const m = onCorrectForMistake(q);
    if (m && m.mastered) e.mistakeDone = true;
  } else {
    SESSION.stats.wrong++;
    addMistake(q, jaPlain(q.options[i].text));
    if (!e.encore && q.kind !== 'l' && q.kind !== 'r') {   // no 再練一次 for listening and reading (see srsAnswer)
      const at = Math.min(SESSION.entries.length, SESSION.idx + 3 + Math.floor(Math.random() * 3));
      const again = { item: e.item, mistake: e.mistake, requeued: true, orig: q };
      if (!e.item && q) again.q = requeueQuestion(q, shuffle(q.options));   // a notebook card has no other format
      SESSION.entries.splice(at, 0, again);
    }
  }
  SESSION.results.push({ key: q.key, ok, q, chosen: i });
  saveState();
  renderPractice();
  speakAnswered(q);
}
function speakAnswered(q) {
  const text = q.fmt === 'v-meaning' || q.fmt === 'v-recall' || q.fmt === 'v-listen' || q.fmt === 'v-reading' || q.fmt === 'v-kanji' || (q.fmt && q.fmt.startsWith('a-')) ? q.speakWord : q.fullJp;
  if (text) speak(text, speakOpts(q, text));
}
function nextQuestion() {
  const e = currentEntry();
  if (!e || !e.done) return;

  renderPractice();
  window.scrollTo({ top: 0 });
}
function exitPractice() {
  stopSpeaking();
  const answered = SESSION ? SESSION.results.length : 0;
  if (SESSION && answered > 0 && SESSION.idx < SESSION.entries.length) { SESSION.idx = SESSION.entries.length; renderPractice(); return; }
  SESSION = null;
  document.body.classList.remove('practicing');
  go(lastMainRoute || '#/today');
  Sync.flushDeferred();
}

function renderSummary(view) {

  const s = SESSION;
  const n = s.results.length;
  const acc = n ? Math.round(s.stats.correct / n * 100) : 0;
  const wrongKeys = new Map();
  s.results.filter(r => !r.ok).forEach(r => { if (!wrongKeys.has(r.q.mistakePrompt)) wrongKeys.set(r.q.mistakePrompt, r); });
  const prog = dayProgress();   // same ring as 今日: items answered today / today's items
  const dayDone = prog.left === 0;
  const wrongList = [...wrongKeys.values()].map(r => `<div class="list-item"><div class="grow"><div class="jp">${furi(tidyPrompt(r.q.mistakePrompt || ''))}</div><div class="small muted">正確：<span class="jp">${esc(jaPlain(r.q.options[r.q.answer].text))}</span>・你選：<span class="jp">${esc(jaPlain(r.q.options[r.chosen].text))}</span></div></div></div>`).join('');
  view.innerHTML = `
    <div class="pr-top"><button type="button" class="btn btn-ghost btn-icon" data-act="close-summary" aria-label="關閉">${icon('close')}</button><div class="grow"></div></div>
    <div class="card">
      <div class="row between" style="align-items:flex-start">
        <div>
          <div class="page-title">${n ? '完成了' : '已結束'}</div>
          <div class="page-sub">${esc(s.title)}・作答 ${n} 題・正確率 ${acc}%</div>
        </div>
        ${ringHtml(Math.min(1, prog.done / Math.max(1, prog.total)), `<b>${prog.done}</b><span class="tiny muted">/ ${prog.total}</span>`)}
      </div>
      <div class="grid grid-4 mt-4">
        <div class="stat"><span class="stat-v">${s.stats.correct}</span><span class="stat-l">答對</span></div>
        <div class="stat"><span class="stat-v">${s.stats.wrong}</span><span class="stat-l">答錯</span></div>
        <div class="stat"><span class="stat-v">${s.stats.newCount}</span><span class="stat-l">新學</span></div>
        <div class="stat"><span class="stat-v">${Math.max(1, Math.round((Date.now() - s.startedAt) / 60000))}</span><span class="stat-l">分鐘</span></div>
      </div>
      ${dayDone ? '<div class="banner mt-4">今天的進度完成了。答對的題目會在幾天後再出現，答錯的明天再複習。</div>' : `<div class="hint mt-4">今天還有 ${prog.left} 題。</div>`}
      <div class="row-wrap mt-4">
        <button type="button" class="btn btn-primary" data-act="again">再練一組</button>
        ${wrongKeys.size ? '<button type="button" class="btn" data-act="retry-wrong">重練答錯的題目</button>' : ''}
        <button type="button" class="btn btn-ghost" data-act="close-summary">回到首頁</button>
      </div>
    </div>
    ${wrongKeys.size ? `<div class="card"><div class="card-head"><div class="card-title">這次答錯的題目</div><span class="chip">${wrongKeys.size}</span></div><div class="list">${wrongList}</div></div>` : ''}`;
}

// the 開始作答 button under a word preview or a lesson-section card (Enter also dismisses it)
function previewGoBtn() { return '<button type="button" class="btn btn-primary" data-act="preview-go" id="btnNext">開始作答 <span class="kbd kbd-hint" style="background:transparent;border-color:currentColor;color:inherit">Enter</span></button>'; }

function ringHtml(ratio, inner, size = 96) {
  const r = 42; const c = 2 * Math.PI * r;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--bg-sunken)" stroke-width="9"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="${ratio >= 1 ? 'var(--ok)' : 'var(--accent)'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - clamp(ratio, 0, 1))}"/></svg><div class="ring-txt"><div>${inner}</div></div></div>`;
}

// report a bad item: hide it from rotation (built-in) or delete it (custom)
function reportCurrentItem() {
  const e = currentEntry();
  if (!e || !e.q || !e.q.item) return;
  const it = e.q.item;
  if (!confirm('把這題移出題庫？之後不會再出現（可以在設定 → 資料中還原）。')) return;
  if (it.builtin) { if (!state.hidden.includes(it.id)) state.hidden.push(it.id); }
  else if (it.kind === 'g') state.customGrammar = state.customGrammar.filter(g => g.id !== it.id);
  else state.vocab = state.vocab.filter(v => v.id !== it.id);
  delete state.srs[it.key];
  state.mistakes = state.mistakes.filter(m => m.key !== it.key);
  saveState();
  buildRegistry();
  SESSION.entries = SESSION.entries.filter((x, i) => i <= SESSION.idx || !x.item || x.item.key !== it.key);
  toast('已移出題庫');
  nextQuestion();
}

   ========================================================================== */
const NAV = [
  { id: 'today', label: '今日', icon: 'today', route: '#/today' },
  { id: 'course', label: '課程', icon: 'course', route: '#/course' },
  { id: 'vocab', label: '單字', icon: 'vocab', route: '#/vocab' },
  { id: 'stats', label: '學習分析', icon: 'chart', route: '#/stats' },
  { id: 'exam', label: '模擬考', icon: 'exam', route: '#/exam' },
  { id: 'mistakes', label: '錯題本', icon: 'mistakes', route: '#/mistakes' },
  { id: 'tools', label: '工具與 AI', icon: 'tools', route: '#/tools' }
];
let lastMainRoute = '#/today';

function syncChipLabel() {
  switch (Sync.status) {
    case 'idle': {
      const t = Sync.meta && Sync.meta.lastSyncedAt ? new Date(Sync.meta.lastSyncedAt) : null;
      return t ? `已同步 ${pad2(t.getHours())}:${pad2(t.getMinutes())}` : '已登入';
    }
    case 'pending': case 'syncing': return '同步中';
    case 'error': return '同步失敗';
    default: return '未登入';
  }
}
function renderSyncChip() {
  const html = `<span class="sync-chip is-${Sync.status}" data-act="sync-open" title="${Sync.status === 'error' ? esc(Sync.lastError || '') : '雲端同步'}">${syncChipLabel()}</span>`;
  ['sideSync', 'syncChip'].forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = html; });
}

function go(hash) {
  if (location.hash === hash) route();
  else location.hash = hash;
}
function currentRoute() {
  const h = (location.hash || '#/today').replace(/^#\/?/, '');
  const [path, query] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  const params = {};
  (query || '').split('&').filter(Boolean).forEach(kv => { const [k, v] = kv.split('='); params[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
  return { name: parts[0] || 'today', parts, params };
}

function renderNav(active) {
  const mistakeCount = activeMistakes().length;
  document.getElementById('sideNav').innerHTML = NAV.map(n => `
    <button type="button" class="nav-item" data-act="nav" data-route="${n.route}" ${n.id === active ? 'aria-current="page"' : ''}>
      ${icon(n.icon)}<span>${n.label}</span>${n.id === 'mistakes' && mistakeCount ? `<span class="count">${mistakeCount}</span>` : ''}
    </button>`).join('');
  const st = streakStats();
  document.getElementById('sideFoot').innerHTML = `
    <div class="panel small">
      <div class="row between"><span class="muted">連續天數</span><b class="num">${st.current} 天</b></div>
      <div class="row between"><span class="muted">今日</span><b class="num">${dayTotal(state.dailyLogs[todayStr()])} 題</b></div>
      <div class="row between"><span class="muted">雲端</span><span id="sideSync"></span></div>
    </div>
    <button type="button" class="nav-item" data-act="toggle-furi" title="快速鍵 F">${icon('furi')}<span>振假名：${FURI_LABEL[furiState()]}</span></button>
    <button type="button" class="nav-item" data-act="settings">${icon('settings')}<span>設定</span></button>`;
  const mobile = [NAV[0], NAV[1], NAV[2], NAV[3], { id: 'more', label: '更多', icon: 'more' }];
  document.getElementById('bottomNav').innerHTML = mobile.map(n => `
    <button type="button" data-act="${n.id === 'more' ? 'more-menu' : 'nav'}" data-route="${n.route || ''}" ${n.id === active || (n.id === 'more' && ['exam', 'stats', 'tools'].includes(active)) ? 'aria-current="page"' : ''}>${icon(n.icon)}<span>${n.label}</span></button>`).join('');
  const navItem = NAV.find(n => n.id === active);
  document.getElementById('topTitle').textContent = navItem ? navItem.label : 'Nihongo Quest';
  renderSyncChip();
  document.getElementById('topActions').innerHTML = `<button type="button" class="btn btn-ghost btn-icon" data-act="toggle-furi" title="振假名">${icon('furi')}</button><button type="button" class="btn btn-ghost btn-icon" data-act="settings" aria-label="設定">${icon('settings')}</button>`;
}

function route() {
  const r = currentRoute();
  const view = document.getElementById('view');
  view.classList.toggle('fit', r.name === 'today'); document.body.classList.toggle('today', r.name === 'today');
  if (r.name !== 'today') { todayTab = 'practice'; heroTab = 'unit'; }
  document.body.classList.toggle('immersive', (r.name === 'mistakes' || r.name === 'vocab') && r.parts[1] === 'listen');
  const tip = document.getElementById('chartTip');
  if (tip) tip.classList.remove('show');
  if (r.name !== 'practice') { document.body.classList.remove('practicing'); }
  if (LISTEN && !(r.name === 'today' || ((r.name === 'mistakes' || r.name === 'vocab') && r.parts[1] === 'listen'))) listenStop(true);   // leaving the pages that host the player ends it
  if (r.name === 'practice') { renderPractice(); return; }
  if (r.name === 'exam' && r.parts[1] === 'run') { renderExamRunner(); return; }
  lastMainRoute = location.hash || '#/today';
  settingsDirty = false;
  closeModal(true);
  renderNav(r.name === 'course' ? 'course' : r.name);
  try {
    if (r.name === 'today') renderToday(view);
    else if (r.name === 'course') { if (r.parts[1] === 'intro') renderIntro(view); else if (r.parts[1]) renderUnit(view, r.parts[1], r.params.tab || 'lesson'); else renderCourse(view); }
    else if (r.name === 'vocab') {
      if (!r.parts[1] || r.parts[1] === 'themes') { location.replace('#/vocab/level?lv=' + defaultVocabLevel()); return route(); }   // replace, so Back leaves the vocab page   // the vocab page opens on the learner's level; the old 主題 tab lives there too
      if (r.parts[1] === 'kanji') { location.replace('#/vocab/level?lv=' + (['PRE_N5', 'N5', 'N4'].includes(r.params.lv) ? r.params.lv : defaultVocabLevel())); return route(); }   // the old 漢字 tab: kanji sit on the level pages
      if (r.parts[1] === 'listen') renderListen(view); else renderVocab(view, r.parts[1], r.params);
    }
    else if (r.name === 'mistakes') { if (r.parts[1] === 'loop') renderMistakeLoop(view); else if (r.parts[1] === 'listen') renderListen(view); else renderMistakes(view, r.params); }
    else if (r.name === 'exam') renderExam(view, r.parts[1] || '', r.params);
    else if (r.name === 'tools') renderTools(view, r.params);
    else if (r.name === 'stats') renderStats(view);
    else renderToday(view);
    // the phone topbar already names the page: a page title that repeats it is hidden there (unit names, scores etc. stay)
    const top = document.getElementById('topTitle').textContent.trim();
    view.querySelectorAll('.page-head .page-title').forEach(el => el.classList.toggle('dup-title', el.textContent.trim() === top));
  } catch (e) {
    console.error(e);
    view.innerHTML = `<div class="card"><div class="card-title">這個頁面出錯了</div><p class="muted small">${esc(e.message)}</p><button class="btn" data-act="nav" data-route="#/today">回到首頁</button></div>`;
  }
  view.focus({ preventScroll: true });
}

// ---------- modal ----------
function openModal(title, bodyHtml, opt = {}) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-back" data-act="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" style="${opt.width ? `width:min(${opt.width}px,100%)` : ''}">
    <div class="modal-head"><div class="modal-title">${esc(title)}</div><button type="button" class="btn btn-ghost btn-icon" data-act="close-modal" aria-label="關閉">${icon('close')}</button></div>
    <div class="modal-body" id="modalBody">${bodyHtml}</div>
    <div class="modal-foot"><button type="button" class="btn" data-act="close-modal">關閉</button></div></div></div>`;
  document.body.style.overflow = 'hidden';
  const first = root.querySelector('.modal-body input, .modal-body select, .modal-body button');
  if (first && !opt.noFocus) first.focus({ preventScroll: true });
}
function closeModal(fromRoute) {
  const root = document.getElementById('modalRoot');
  if (root && root.innerHTML) {
    root.innerHTML = ''; document.body.style.overflow = '';
    // settings changed while the modal was open: redraw the page underneath
    if (!fromRoute && settingsDirty) { settingsDirty = false; if (!['practice'].includes(currentRoute().name) && !(currentRoute().name === 'exam' && currentRoute().parts[1] === 'run')) route(); }
  }
}
function modalOpen() { return Boolean(document.getElementById('modalRoot').innerHTML); }

// ---------- theme & furigana ----------
function applyTheme() {
  const t = state.settings.theme || 'dark';
  const resolved = t === 'auto' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t;
  document.documentElement.setAttribute('data-theme', resolved);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', resolved === 'light' ? '#f5f6f8' : '#0e0f13');
}
// furigana: all → smart (no readings on mastered words) → off
const FURI_LABEL = { all: '顯示', smart: '熟練的字不標', off: '隱藏' };
function furiState() { return !state.settings.furigana ? 'off' : (state.settings.furiMode === 'smart' ? 'smart' : 'all'); }
function applyFurigana() {
  const st = furiState();
  document.body.classList.toggle('no-furi', st === 'off');
  document.body.classList.toggle('furi-smart', st === 'smart');
}
function toggleFurigana() {
  const next = { all: 'smart', smart: 'off', off: 'all' }[furiState()];
  state.settings.furigana = next !== 'off';
  if (next !== 'off') state.settings.furiMode = next;
  saveState(); applyFurigana();
  toast(`振假名：${FURI_LABEL[next]}`);
  if (SESSION && currentRoute().name === 'practice') renderPractice();
  else if (!modalOpen() && !(currentRoute().name === 'exam' && currentRoute().parts[1] === 'run')) renderNav(currentRoute().name);
}

// ---------- actions (event delegation) ----------
const ACTIONS = {
  'sync-open': () => openSettings('data'),
  'sync-login': async () => { const inp = document.getElementById('syncEmail'); await Sync.signIn(inp ? inp.value : ''); },
  'sync-verify': async () => { const inp = document.getElementById('syncCode'); await Sync.verifyCode(inp ? inp.value : ''); },
  'sync-cancel-code': () => { Sync.pendingEmail = null; if (modalOpen()) refreshSettings(); },
  'sync-now': async () => { await Sync.push(); await Sync.pull(); if (modalOpen()) refreshSettings(); },
  'sync-retry': async () => { await Sync.push(); await Sync.pull(); if (modalOpen()) refreshSettings(); },
  'sync-logout': async () => { await Sync.signOut(); if (modalOpen()) refreshSettings(); route(); },
  'sync-delete-cloud': async () => { if (!confirm('確定刪除雲端上的進度？本機進度不受影響。')) return; await Sync.deleteCloud(); if (modalOpen()) refreshSettings(); },
  nav: (el) => go(el.dataset.route),
  settings: () => openSettings(),
  'more-menu': () => openModal('更多', `<div class="list">
      ${NAV.slice(4).map(n => `<button type="button" class="list-item clickable" style="border:0;background:none;width:100%;text-align:left" data-act="nav" data-route="${n.route}">${icon(n.icon)}<span>${n.label}</span></button>`).join('')}
      <button type="button" class="list-item clickable" style="border:0;background:none;width:100%;text-align:left" data-act="settings">${icon('settings')}<span>設定</span></button></div>`, { width: 420 }),
  'close-modal': () => closeModal(),
  'modal-back': (el, ev) => { if (ev.target === el) closeModal(); },
  'toggle-furi': () => toggleFurigana(),
  'start-daily': (el) => startSession('daily', { size: Number(el.dataset.size) || undefined }),
  'start-extra': () => startSession('daily', { extra: true }),
  'start-unit': (el) => startSession('unit', { unit: el.dataset.unit, title: `${unitById(el.dataset.unit).short}・單元練習` }),
  'start-vocab': (el) => startSession('vocab', { filter: el.dataset.filter || 'all' }),
  'start-mistakes': () => startSession('mistakes'),
  answer: (el) => answerCurrent(Number(el.dataset.i)),
  next: () => nextQuestion(),
  'preview-go': () => dismissPreview(),
  slip: () => {   // 「手滑，不算」: the answer was a mis-tap, not a gap — schedule, notebook and stats go back to before it
    const e = currentEntry(); if (!e || !e.done || e.slip || !e.undo) return;
    const q = e.q, u = e.undo;
    const wasNew = Boolean(e.srs && e.srs.isNew);
    if (q.key) { if (u.srs) state.srs[q.key] = u.srs; else delete state.srs[q.key]; }
    state.today = u.today;
    if (u.logDate) {
      if (u.dailyLog) state.dailyLogs[u.logDate] = u.dailyLog;
      else delete state.dailyLogs[u.logDate];
    }
    if ('themeLane' in u) state.themeLane = u.themeLane;
    if ('currentUnit' in u) state.currentUnit = u.currentUnit;
    if ('completedUnits' in u) state.completedUnits = u.completedUnits;
    if (u.mistake) { const i = state.mistakes.findIndex(x => x.id === u.mistake.id); if (i >= 0) state.mistakes[i] = u.mistake; }
    else if (state.mistakes.length > u.mistakesLen) state.mistakes.shift();
    const f = state.statsFmt[q.fmt]; if (f && f.ng > 0) f.ng--;
    if (state.recent.length) state.recent.pop();
    if (e.srs && e.srs.reviewed && state.reviewRecent.length) state.reviewRecent.pop();
    if (wasNew) SESSION.stats.newCount = Math.max(0, SESSION.stats.newCount - 1);
    SESSION.stats.wrong = Math.max(0, SESSION.stats.wrong - 1);
    SESSION.entries = SESSION.entries.filter((x, i) => i <= SESSION.idx || !((x.requeued || (wasNew && x.encore)) && x.item === e.item));
    const last = SESSION.results[SESSION.results.length - 1]; if (last && last.q === q) SESSION.results.pop();
    e.slip = true; e.srs = null; e.mistakeDone = false; delete e.undo;
    saveState(); renderPractice(); toast('這題不算，排程維持原狀');
  },
  'exit-practice': () => exitPractice(),
  'close-summary': () => { SESSION = null; document.body.classList.remove('practicing'); go(lastMainRoute || '#/today'); Sync.flushDeferred(); },
  again: () => { const s = SESSION; SESSION = null; startSession(s.mode, s.opt || {}); },
  'retry-wrong': () => {
    const items = [];
    SESSION.results.filter(r => !r.ok).forEach(r => { if (r.q.item && !items.includes(r.q.item)) items.push(r.q.item); });
    SESSION = null;
    if (!items.length) { go(lastMainRoute); return; }
    startSession('items', { items: shuffle(items), title: '重練答錯的題目' });
  },
  'show-zh': () => { const e = currentEntry(); if (e) { e.zhShown = true; renderPractice(); } },
  replay: () => {
    const e = currentEntry();
    if (!e || !e.q) return;
    const q = e.q;
    // before answering a grammar question the full sentence would give the answer away
    const text = q.audio || (e.done ? (q.fullJp || q.speakWord) : (q.fmt && q.fmt.startsWith('g-') ? '' : q.speakWord)) || '';
    if (!text) { toast('作答後可以聽整句。'); return; }
    if (text === q.speakWord && q.speakReading) { speak(text, { reading: q.speakReading }); return; }
    if (q.audioScript && text === q.audio) speakScript(text); else speak(text);
  },
  'speak-full': () => { const e = currentEntry(); if (e && e.q) speak(e.q.fullJp); },
  'speak-example': () => { const e = currentEntry(); const it = e && ((e.q && e.q.item) || e.item); if (it && it.ex) speak(jaPlain(exPlain(it.ex))); },   // the example the question used
  'spell-tap': (el) => {
    const e = currentEntry(); if (!e || e.done || !e.q || e.q.custom !== 'v-spell') return;
    e.spell = e.spell || []; const i = Number(el.dataset.i); if (e.spell.includes(i)) return;
    e.spell.push(i);
    const typed = e.spell.map(k => e.q.tiles[k]).join(''); const want = e.q.options[0].text;
    if ([...typed].length >= [...want].length) finishCustom(e, typed === want, typed); else renderPractice();
  },
  'conj-tap': (el) => {
    const e = currentEntry(); if (!e || e.done || !e.q || !(e.q.custom === 'g-conj-type' || e.q.custom === 'g-adj-type')) return;
    e.conj = e.conj || []; const i = Number(el.dataset.i); if (!(i >= 0 && i < e.q.tiles.length) || e.conj.includes(i)) return;
    e.conj.push(i);
    const ans = e.q.options[0].text; const built = e.conj.map(k => e.q.tiles[k]).join('');
    if (e.conj.length >= conjTokens(ans).length) finishCustom(e, conjMatch(built, ans), jaPlain(built)); else renderPractice();
  },
  'conj-back': () => { const e = currentEntry(); if (!e || e.done || !e.conj || !e.conj.length) return; e.conj.pop(); renderPractice(); },
  'conj-submit': () => {
    const e = currentEntry(); if (!e || e.done || !e.q || !(e.q.custom === 'g-conj-type' || e.q.custom === 'g-adj-type')) return;
    const inp = document.querySelector('input.conj-in'); e.typed = inp ? inp.value : (e.typed || '');
    if (!kanaKey(e.typed)) { toast('先輸入答案'); return; }
    finishCustom(e, conjMatch(e.typed, e.q.options[0].text), e.typed.trim());
  },
  'custom-giveup': () => {
    const e = currentEntry(); if (!e || e.done || !e.q || !e.q.custom) return;
    if (e.q.custom === 'g-conj-type' || e.q.custom === 'g-adj-type') { e.conj = conjTokens(e.q.options[0].text).map(t => e.q.tiles.indexOf(t)); }   // show the right form
    if (e.q.custom === 'v-spell') { e.spell = [...e.q.options[0].text].map(ch => e.q.tiles.indexOf(ch)); }   // show the right spelling
    if (e.q.custom === 'v-match') { e.match = { sel: null, matched: e.q.pairs.map(p => p[0]), wrong: (e.match || {}).wrong || 0 }; }   // reveal every pair
    if (e.q.custom === 'g-order') { e.order = e.q.orderParts.map(p => e.q.tiles.indexOf(p)); }   // show the right order
    finishCustom(e, false, '（看了答案）');
  },
  'order-tap': (el) => {
    const e = currentEntry(); if (!e || e.done || !e.q || e.q.custom !== 'g-order') return;
    e.order = e.order || []; const i = Number(el.dataset.i); if (!(i >= 0 && i < e.q.tiles.length) || e.order.includes(i)) return;
    e.order.push(i);
    if (e.order.length < e.q.orderParts.length) { renderPractice(); return; }
    const built = e.order.map(k => e.q.tiles[k]).join('');
    finishCustom(e, built === e.q.orderParts.join(''), e.q.pre + built + e.q.post);
  },
  'order-back': () => { const e = currentEntry(); if (!e || e.done || !e.order || !e.order.length) return; e.order.pop(); renderPractice(); },
  'spell-back': () => { const e = currentEntry(); if (!e || e.done || !e.spell || !e.spell.length) return; e.spell.pop(); renderPractice(); },
  'match-word': (el) => {
    const e = currentEntry(); if (!e || e.done || !e.q || e.q.custom !== 'v-match') return;
    e.match = e.match || { sel: null, matched: [], wrong: 0 };
    e.match.sel = e.match.sel === el.dataset.w ? null : el.dataset.w;
    if (e.match.sel) { const p = e.q.pairs.find(x => x[0] === e.match.sel); speak(e.match.sel, p && p[2] && p[2] !== e.match.sel ? { reading: p[2] } : undefined); }   // hear the word as you pick it
    renderPractice();
  },
  'match-meaning': (el) => {
    const e = currentEntry(); if (!e || e.done || !e.q || e.q.custom !== 'v-match') return;
    const m = e.match = e.match || { sel: null, matched: [], wrong: 0 };
    if (!m.sel) return;
    const pair = e.q.pairs.find(p => p[0] === m.sel);
    if (pair && pair[1] === el.dataset.m) { m.matched.push(m.sel); delete m.flash; }
    else { m.wrong++; m.flash = { w: m.sel, m: el.dataset.m, at: Date.now() }; setTimeout(() => { if (m.flash && Date.now() - m.flash.at >= 550) delete m.flash; }, 600); }   // flash the wrong pair red
    m.sel = null;
    if (m.matched.length === e.q.pairs.length) finishCustom(e, m.wrong === 0, `配對時錯了 ${m.wrong} 次`); else renderPractice();
  },
  speak: (el) => speak(el.dataset.text, el.dataset.reading ? { reading: el.dataset.reading } : undefined),
  'ai-explain': () => aiExplainCurrent(),
  'report-item': () => reportCurrentItem(),
  'dismiss-notice': (el) => { state.notices = state.notices.filter(n => n.id !== el.dataset.id); saveState(); route(); },
  'intro-dismiss': () => { state.introSeen = true; saveState(); route(); },
  'start-zero': () => chooseStart('zero'),
  'start-kana': () => chooseStart('kana'),
  'start-basics': () => chooseStart('basics'),
  'start-test': () => { chooseStart('zero'); startSession('stage', { stage: 'pre' }); },
  'kana-known': () => { state.kanaKnown = true; saveState(); DAILY_CACHE = null; toast('入門單字從今天開始'); route(); },
  'kana-practice': () => startSession('kana'),
  glossary: (el) => { const h = glossaryHtml(el.dataset.term); if (h) openModal('這是什麼？', h, { width: 480, noFocus: true }); }
};
function handleClick(ev) {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') ev.preventDefault();
  fn(el, ev);
}
const CHANGE_ACTIONS = {
  'listen-theme': (el) => ACTIONS['listen-theme-pick']({ dataset: { theme: el.value } }),
  'bulk-level': (el) => { const box = document.getElementById('bulkCount'); const st = el.closest('[data-stage]'); if (box && st) box.textContent = `會影響 ${bulkMarkTargets(st.dataset.stage, el.value).length} 個項目`; }
};
function handleChange(ev) {
  const el = ev.target.closest('[data-change]');
  if (!el) return;
  const fn = CHANGE_ACTIONS[el.dataset.change];
  if (fn) fn(el, ev);
}

// ---------- keyboard ----------
function handleKey(ev) {
  if (ev.key === 'Enter' && ev.target && ev.target.classList && ev.target.classList.contains('conj-in')) {
    if (ev.isComposing || ev.keyCode === 229) return;   // the Enter that commits an IME conversion (Japanese keyboard) is not a submit
    ev.preventDefault(); ACTIONS['conj-submit'](); return;
  }
  const tag = (ev.target && ev.target.tagName || '').toUpperCase();
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) || (ev.target && ev.target.isContentEditable)) return;
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (modalOpen()) { if (ev.key === 'Escape') closeModal(); return; }
  const r = currentRoute();
  const k = ev.key;
  if (r.name === 'practice' && SESSION) {
    const e = currentEntry();
    if (e && e.preview && !e.previewDone) {
      if (k === 'Enter' || k === ' ') { ev.preventDefault(); dismissPreview(); }
      else if (k === 'r' || k === 'R') { ev.preventDefault(); ACTIONS.replay(); }
      else if (k === 'f' || k === 'F') { ev.preventDefault(); toggleFurigana(); }
      else if (k === 'Escape') { ev.preventDefault(); exitPractice(); }
      return;
    }
    if (['1', '2', '3', '4'].includes(k)) { ev.preventDefault(); if (e && !e.done && e.q && e.q.custom === 'g-order') ACTIONS['order-tap']({ dataset: { i: String(Number(k) - 1) } }); else if (e && !e.done && !(e.q && e.q.custom)) answerCurrent(Number(k) - 1); return; }
    if (k === 'Enter' || k === ' ') { if (e && e.done) { ev.preventDefault(); nextQuestion(); } else if (!e) { ev.preventDefault(); } return; }
    if (k === 'r' || k === 'R') { ev.preventDefault(); ACTIONS.replay(); return; }
    if (k === 'f' || k === 'F') { ev.preventDefault(); toggleFurigana(); return; }
    if (k === 't' || k === 'T') { ev.preventDefault(); ACTIONS['show-zh'](); return; }
    if (k === 'Escape') { ev.preventDefault(); exitPractice(); return; }
    return;
  }
  if (r.name === 'exam' && r.parts[1] === 'run') { examKey(ev); return; }
  if (r.name === 'vocab' && (r.parts[1] || 'cards') === 'cards') { flashKey(ev); return; }
  if (r.name === 'mistakes' && r.parts[1] === 'loop') { mloopKey(ev); return; }
  if ((r.name === 'mistakes' || r.name === 'vocab') && r.parts[1] === 'listen') { listenKey(ev); return; }
  if (k === 'f' || k === 'F') { ev.preventDefault(); toggleFurigana(); }
}

// The topics the 開始練習 session touches: vocabulary themes (the active pair when new words are in, otherwise the

function sessionTopicsHtml(q, plan) {
  const allWords = q.items.filter(it => it.kind === 'v');
  const words = allWords.filter(it => it.builtin);
  const present = new Set(words.map(vocabTheme));
  const all = [...present].sort((a, b) => themeRank(a) - themeRank(b));
  const themes = all.slice(0, 3); if (all.length > 3) themes.push(`等 ${all.length} 個`);
  if (allWords.length > words.length) themes.push('自訂字卡');
  // the line is always there: custom cards have no theme, and a finished day just says so
  const vocabText = themes.length ? themes.join('・') : '今天的單字已完成';
  const gItems = q.items.filter(it => it.kind === 'g');
  const pts = [];
  gItems.filter(it => !state.srs[it.key]).concat(gItems.filter(it => state.srs[it.key])).forEach(g => { if (g.pt && !pts.includes(g.pt)) pts.push(g.pt); });
  const shown = pts.slice(0, 5); if (pts.length > 5) shown.push(`等 ${pts.length} 個考點`);

}

function heatLevel(n) { return n <= 0 ? 0 : n < 6 ? 1 : n < 15 ? 2 : n < 26 ? 3 : 4; }
// The grid runs from the week the learner started (first day with a record, or the day the profile was created) to
// this week, so a wide screen does not show months of blank cells before the first green one. At least 4 weeks so
// a brand-new profile still reads as a calendar; at most 26, as before.
function heatmapWeeks() {
  const t = todayStr();
  const monday = (ds) => { const d = parseDate(ds); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; };
  let first = state.createdAt && state.createdAt < t ? state.createdAt : t;
  for (const ds of Object.keys(state.dailyLogs)) if (dayTotal(state.dailyLogs[ds]) > 0 && ds < first) first = ds;
  const span = Math.round((monday(t) - monday(first)) / 864e5 / 7) + 1;
  return clamp(span, 4, 26);
}
function heatmapHtml() {
  const weeks = heatmapWeeks();
  const today = parseDate(todayStr());
  const dow = (today.getDay() + 6) % 7; // Monday = 0
  const start = new Date(today); start.setDate(start.getDate() - dow - (weeks - 1) * 7);
  const cells = []; const months = [];
  let lastMonth = -1; let lastLabel = -9;
  for (let w = 0; w < weeks; w++) {
    const first = new Date(start); first.setDate(first.getDate() + w * 7);
    // label a column when its month starts, but never two labels closer than three columns
    const isNew = first.getMonth() !== lastMonth;
    const nextMonthSoon = w === 0 && new Date(first.getFullYear(), first.getMonth(), first.getDate() + 14).getMonth() !== first.getMonth();
    months.push(isNew && w - lastLabel >= 3 && !nextMonthSoon ? `${first.getMonth() + 1}月` : '');
    if (months[w]) lastLabel = w;
    lastMonth = first.getMonth();
    for (let d = 0; d < 7; d++) {
      const day = new Date(start); day.setDate(day.getDate() + w * 7 + d);
      const ds = dateStr(day);
      if (day > today) { cells.push('<i class="future"></i>'); continue; }
      const n = dayTotal(state.dailyLogs[ds]);
      cells.push(`<i class="l${heatLevel(n)}${ds === todayStr() ? ' today' : ''}" data-act="heat-day" data-date="${ds}" title="${ds}：${n} 題"></i>`);
    }
  }
  return `<div class="heat-wrap"><div class="heat-months">${months.map(m => `<span>${m}</span>`).join('')}</div><div class="heat">${cells.join('')}</div></div>`;
}
function recentLogsHtml() {
  const days = Object.keys(state.dailyLogs).filter(d => dayTotal(state.dailyLogs[d]) > 0).sort().reverse().slice(0, 14);
  if (!days.length) return '<div class="empty">還沒有紀錄，完成第一組練習後就會出現。</div>';
  const tally = tallySrsByDay();
  return `<div class="list mt-2">${days.map(d => {
    const e = state.dailyLogs[d];
    return `<div class="list-item"><div class="grow">
      <div class="row-wrap"><b class="num">${d}</b><span class="small muted">${dayStatsText(d, tally)}</span></div>
    </div><span class="chip num">${dayTotal(e)} 題</span>

// ---- 階段（四個）與階段項目 ----
/* 入門 + DATA.PHASES 的三個階段。文法與變化練習照單元歸屬；單字、漢字、聽力、閱讀照等級歸到該等級的最後一個階段
   (PRE_N5 → 入門, N5 → 第一階段, N4 → 第三階段)；入門另含全部假名。階段測驗與「標記到這裡為止」都以這個劃分為準。 */
const STAGES = [{ id: 'pre', title: '入門', sub: '假名與入門單字，不算週數；都看過、正確率到 80% 就自動進第 1 週', units: [], lv: 'PRE_N5' }].concat(
  DATA.PHASES.map((ph, i) => ({ id: 'p' + (i + 1), title: ph.title, sub: ph.span, units: DATA.UNITS.filter(u => u.ph === ph.id).map(u => u.id), lv: ['N5', null, 'N4'][i] || null })));
function stageById(id) { return STAGES.find(s => s.id === id); }
function stageIndex(id) { return Math.max(0, STAGES.findIndex(s => s.id === id)); }
function stagesUpTo(id) { return STAGES.slice(0, stageIndex(id) + 1); }
function stageItems(id) {
  const s = stageById(id); if (!s) return [];
  const inUnits = (x) => s.units.includes(x.u);
  const out = REG.grammar.filter(inUnits).concat(REG.drills.filter(inUnits));
  if (s.lv) {
    REG.vocab.forEach(v => { if (v.builtin && v.lv === s.lv) out.push(v); });
    [REG.kanji, REG.listen, REG.read].forEach(list => list.forEach(x => { if (x.lv === s.lv) out.push(x); }));
  }
  if (id === 'pre') out.push(...REG.kana);
  return out;
}
function stageOfUnit(uid) { const s = STAGES.find(x => x.units.includes(uid)); return s ? s.id : 'p1'; }
function currentStageId() { return inPreStage() ? 'pre' : stageOfUnit(state.currentUnit); }
function nextUnitAfterStage(id) { const n = STAGES[stageIndex(id) + 1]; return n ? n.units[0] : 'm18'; }

// ---- 階段測驗 ----
/* 40 questions drawn from the stage's own items (unseen ones included — the test asks "do I know this stage"), options only, untimed,

const STAGE_TEST_SIZE = 40;

  learned: { name: '熟悉', hint: '約一到兩週後開始複習（分散排，每天最多約一半的負荷上限）。', due: [5, 14], lr: [90, 270] },
  known: { name: '熟練', hint: '等同「我會了」：直接算熟練，五到八週後各確認一次；答錯就回到正常排程。會清掉這些項目的錯題。', due: [35, 56], lr: [180, 365] }

function kanaItems() {
  const out = []; let order = 0;
  const rows = KANA_ROWS.map(r => [r, true]).concat(DAKUTEN_ROWS.map(r => [r, false]));
  rows.forEach(([row, seion], ri) => {

const KANA_LOOKALIKE = [['あ', 'お', 'ぬ', 'め'], ['さ', 'き', 'ち', 'ら'], ['ね', 'れ', 'わ'], ['は', 'ほ', 'ま'], ['る', 'ろ'], ['い', 'り'], ['く', 'へ'], ['な', 'た'], ['シ', 'ツ'], ['ソ', 'ン'], ['ク', 'タ', 'ケ'], ['ウ', 'ワ', 'フ'], ['コ', 'ユ'], ['ア', 'マ'], ['チ', 'テ'], ['ス', 'ヌ'], ['ロ', 'コ'], ['ナ', 'メ']];
function kanaLookalikes(item) {
  const same = (x) => x.script === item.script && x.ch !== item.ch && x.roma !== item.roma && (!item.seion || x.seion);   // a 清音 item only gets 清音 decoys; を／お, じ／ぢ read alike and would make two right answers
  const pool = REG.kana.filter(same);
  const out = [];
  const push = (ch) => { if (ch && ch !== item.ch && !out.includes(ch) && pool.some(x => x.ch === ch)) out.push(ch); };
  KANA_LOOKALIKE.filter(g => g.includes(item.ch)).forEach(g => g.forEach(push));
  if (out.length < 3) shuffle(pool.filter(x => x.row === item.row)).forEach(x => { if (out.length < 3) push(x.ch); });
  if (out.length < 3) shuffle(pool).forEach(x => { if (out.length < 3) push(x.ch); });
  return out;
}

let FLASH = null;   // { deck, queue: [key], idx, flipped, extraNew }

// ---- themes: the built-in words carry a theme (`c`); custom cards have none and stay in their own deck ----
// theme order = each level's list in DATA.THEMES (PRE_N5, N5, N4); a name shared by two levels ranks where it first appears
const THEME_ORDER = [...new Set([].concat(...['PRE_N5', 'N5', 'N4'].map(l => ((DATA.THEMES || {})[l] || []).map(t => t.c))))];
// old theme names (before 1.0.8) → the N5 name, or the N4 name for N4-only themes; normalizeState migrates state.themeLane with it
const THEME_MIGRATE = {"問候": "問候與溝通", "溝通": "問候與溝通", "指示": "疑問與指示", "代名詞": "疑問與指示", "疑問": "疑問與指示", "人物": "人物與家庭", "家庭": "人物與家庭", "身體": "身體與健康", "健康": "身體與健康", "衣物": "衣物與購物", "購物": "衣物與購物", "生活": "居家生活", "學校": "學校與工作", "工作": "學校與工作", "交通": "交通與移動", "移動": "交通與移動", "地點": "地點與位置", "位置": "地點與位置", "自然": "自然與天氣", "天氣": "自然與天氣", "興趣": "興趣與休閒", "休閒": "興趣與休閒", "形容": "形容與狀態", "狀態": "形容與狀態", "顏色": "形容與狀態", "副詞": "副詞與接續", "接續": "副詞與接續", "社會": "社會與人際", "人際": "社會與人際", "敬語": "溝通與敬語", "情感": "情感與心情", "心情": "情感與心情", "思考": "思考與抽象", "抽象": "思考與抽象", "旅行": "交通旅行與移動"};
function vocabTheme(v) { return v.builtin ? v.c : '其他'; }   // every built-in word carries a theme of its level (data test); custom cards have none
// ---- 單字頁 (1.0.9): one level at a time → its themes → the kanji met in them ----
function levelStats(lv) {
  const t = todayStr();
  const out = { lv, total: 0, seen: 0, learned: 0, mastered: 0, due: 0, kanji: { total: 0, seen: 0, learned: 0 } };
  REG.vocab.filter(v => v.builtin && v.lv === lv).forEach(v => { out.total++; const r = state.srs[v.key]; if (!r) return; out.seen++; if (r.b >= SRS_LEARNED) out.learned++; if (srsLevelLabel(r, v.key) === '已熟練') out.mastered++; if (r.due <= t) out.due++; });
  REG.kanji.filter(k => k.lv === lv).forEach(k => { out.kanji.total++; const r = state.srs[k.key]; if (!r) return; out.kanji.seen++; if (r.b >= SRS_LEARNED) out.kanji.learned++; });
  if (lv === 'PRE_N5') { out.kana = { total: REG.kana.length, seen: 0, learned: 0 }; REG.kana.forEach(k => { const r = state.srs[k.key]; if (!r) return; out.kana.seen++; if (r.b >= SRS_LEARNED) out.kana.learned++; }); }
  return out;
}
// kanji counted per (level, theme) from the built-in words that contain them
function kanjiCountsByTheme(lv) {
  const by = new Map();   // theme → Map(kanji → count)
  REG.vocab.filter(v => v.builtin && v.lv === lv).forEach(v => {
    const c = vocabTheme(v); const m = by.get(c) || by.set(c, new Map()).get(c);
    new Set([...jaPlain(v.w)].filter(ch => KANJI_RE.test(ch) && REG.byKey.has('k:' + ch))).forEach(ch => m.set(ch, (m.get(ch) || 0) + 1));
  });
  return by;
}
function themeStats(lv) {
  const t = todayStr(); const counts = kanjiCountsByTheme(lv);
  return ((DATA.THEMES || {})[lv] || []).map(th => {
    const g = { c: th.c, desc: th.desc || '', total: 0, seen: 0, learned: 0, mastered: 0, due: 0, kanji: [] };
    REG.vocab.filter(v => v.builtin && v.lv === lv && vocabTheme(v) === th.c).forEach(v => { g.total++; const r = state.srs[v.key]; if (!r) return; g.seen++; if (r.b >= SRS_LEARNED) g.learned++; if (srsLevelLabel(r, v.key) === '已熟練') g.mastered++; if (r.due <= t) g.due++; });
    g.kanji = [...(counts.get(th.c) || new Map()).entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 8).map(([k]) => k);
    return g;
  });
}
// the theme a kanji belongs to on a level page: the theme whose words (of that level) contain it most often
function kanjiThemeOf(k, lv, counts = kanjiCountsByTheme(lv)) {
  let best = null, n = 0;
  counts.forEach((m, c) => { const x = m.get(k.k) || 0; if (x > n) { n = x; best = c; } });
  return best;
}
function vocabThemes() {
  const t = todayStr();
  const by = new Map();
  REG.vocab.filter(v => v.builtin).forEach(v => {
    const c = vocabTheme(v);
    const g = by.get(c) || by.set(c, { c, total: 0, seen: 0, learned: 0, mastered: 0, due: 0, PRE_N5: 0, N5: 0, N4: 0 }).get(c);
    g.total++; g[v.lv in g ? v.lv : 'N5']++;
    const r = state.srs[v.key];
    if (r) { g.seen++; if (r.b >= SRS_LEARNED) g.learned++; if (srsLevelLabel(r, v.key) === '已熟練') g.mastered++; if (r.due <= t) g.due++; }
  });
  const rank = (c) => { const i = THEME_ORDER.indexOf(c); return i < 0 ? THEME_ORDER.length : i; };
  return [...by.values()].sort((a, b) => rank(a.c) - rank(b.c) || a.c.localeCompare(b.c, 'zh-Hant'));
}
// three stacked segments: mastered, learned (not yet mastered), seen (not yet learned)
// Three-segment bar painted as one gradient (no child layout to go wrong on any browser): segs = [[name, count]]
// left to right, brightest first. Names mastered / learned / seen map to heat-4 / heat-3 / heat-2.

function deckPool(deck) {

  const t = todayStr();

  const quota = Math.max(0, newQuota('v') - state.today.newV) + extraNew;

/* ==========================================================================
   Mistake notebook
   ========================================================================== */
// ---------- 錯題快速循環: flip cards over the active notebook, 忘了／記得 ----------
// One pass over the active mistakes (most missed, longest unpractised first). A grade writes the item's schedule once a
// day — the first grade of the day; later looks only update the notebook. Cards marked 忘了 come back once at the end
// of the round, for a look without a grade.
const MLOOP_MAX = 30;
let MLOOP = null;   // { queue: [mistakeId], idx, flipped, again: [], rated: {id: grade}, date, stats: { ok, ng, left } }
function buildMistakeLoop(max = MLOOP_MAX, first = []) {
  const ids = activeMistakes().slice().sort(mistakePriority).map(m => m.id);
  return first.filter(id => ids.includes(id)).concat(ids.filter(id => !first.includes(id))).slice(0, max);
}
function startMistakeLoop(first = []) {
  MLOOP = { queue: buildMistakeLoop(MLOOP_MAX, first), idx: 0, flipped: false, again: [], rated: {}, date: todayStr(), stats: { ok: 0, ng: 0, left: 0 } };
  go('#/mistakes/loop');
}
function mloopCurrent() { return MLOOP && state.mistakes.find(m => m.id === MLOOP.queue[MLOOP.idx]); }
function mistakeCardFaces(m) {
  const it = m.key && REG.byKey.get(m.key);
  if (it && it.kind === 'v') {
    const ex = vocabExamples(it)[0];
    return {
      front: `<div class="word jp">${furi(it.w)}</div>`,
      back: `${it.r && it.r !== jaPlain(it.w) ? `<div class="reading jp">${esc(it.r)}</div>` : ''}<div class="meaning">${esc(it.m)}</div>
        ${ex ? exampleHtml(ex.ex, ex.exZh, 'mt-3 listen-ex') : ''}
        ${vocabWhy(it) ? `<div class="small mt-2" style="text-align:left">${md(vocabWhy(it))}</div>` : ''}`
    };
  }
  if (it && it.kind === 'a') {
    return { front: `<div class="word jp">${esc(it.ch)}</div>`, back: `<div class="reading">${esc(it.roma)}</div><div class="meaning jp">${esc(it.script === 'hira' ? '片假名' : '平假名')}：${esc(it.pair)}</div>` };
  }
  const b = splitBlank(m.prompt || '');
  const front = b ? `${furi(b.pre)}${blankChip(b.hint)}${furi(b.post)}` : furi(m.prompt || '');
  const pt = it && it.kind === 'g' && it.pt ? `<div class="small muted mt-2">考點：${esc(it.pt)}</div>` : '';
  return {
    front: `<div class="front-stem jp">${front}</div>`,
    back: `<div class="meaning jp">${furi(m.answer || '')}</div>${pt}${m.why ? `<div class="small mt-2" style="text-align:left">${md(m.why)}</div>` : ''}`
  };
}
// what the loop reads aloud: the word itself for a word mistake (its prompt is often Chinese or a cloze), else the prompt
function mloopSpeakText(m) {
  const it = m && m.key && REG.byKey.get(m.key);
  if (it && it.kind === 'v') return it.r || jaPlain(it.w);
  if (it && it.kind === 'a') return it.ch;
  return jaPlain((m && m.prompt) || '');
}
function mloopRate(g) {
  const m = mloopCurrent(); if (!m || !MLOOP.flipped) return;
  const t = todayStr(); const good = g === 'good';
  const it = m.key && REG.byKey.get(m.key); const r = it && state.srs[m.key];
  const wasMastered = m.mastered;
  if (!MLOOP.rated[m.id]) {
    MLOOP.rated[m.id] = g;
    MLOOP.stats[good ? 'ok' : 'ng']++;
    if (!good) MLOOP.again.push(m.id);
    if (it && (!r || r.last !== t)) {   // the first grade of the day sets the schedule
      const res = srsAnswer(m.key, good, { grade: good ? 'good' : 'again' });
      if (it.kind === 'v') recordFormat(res.rec, 'flash', good);
      recordAction(it.kind === 'g' ? 'g' : it.kind === 'v' || it.kind === 'k' ? 'v' : 'q', it.kind === 'g' ? unitById(it.u).short : it.kind === 'v' ? `單字「${jaPlain(it.w)}」` : it.kind === 'k' ? `漢字「${it.k}」` : null, it.kind);
      recordAccuracy(good);
      if (good) onCorrectForMistake({ key: m.key });
      else addMistake({ key: m.key, cat: m.cat, mistakePrompt: m.prompt, answerText: m.answer, why: m.why }, '錯題循環：忘記');
    } else if (it) {                      // already answered today: the notebook notes the look, the schedule stands
      m.last = t;
      if (!good) { m.count = (m.count || 1) + 1; m.streak = 0; }
    } else if (good) onCorrectForMistake({ mistakeId: m.id });
    else { m.count = (m.count || 1) + 1; m.streak = 0; m.okDays = []; m.last = t; }
    if (!wasMastered && m.mastered) MLOOP.stats.left++;
    saveState();
  }
  mloopAdvance();
}
function mloopAdvance() {
  MLOOP.idx++; MLOOP.flipped = false;
  if (MLOOP.idx >= MLOOP.queue.length && MLOOP.again.length) { MLOOP.queue = MLOOP.queue.concat(MLOOP.again); MLOOP.again = []; }
  route();
}
function renderMistakeLoop(view) {
  if (!MLOOP || MLOOP.date !== todayStr()) { startMistakeLoop(); return; }
  const m = mloopCurrent();
  if (!m) {
    const s = MLOOP.stats;
    view.innerHTML = `<div class="card center"><div class="flash">
      <div class="page-title">這一輪：記得 ${s.ok}・忘了 ${s.ng}</div>
      <p class="dim mt-2">${s.left ? `今天移出錯題本 ${s.left} 題。` : ''}${activeMistakes().length ? `錯題本還有 ${activeMistakes().length} 題待複習。` : '錯題本清空了。'}</p>
      <div class="row-wrap mt-3" style="justify-content:center">
        ${activeMistakes().length ? '<button type="button" class="btn btn-primary" data-act="mloop-again">再一輪</button>' : ''}
        <button type="button" class="btn" data-act="nav" data-route="#/mistakes">回錯題本</button>
      </div></div></div>`;
    return;
  }
  const faces = mistakeCardFaces(m);
  const second = Boolean(MLOOP.rated[m.id]);
  const rec = m.key && state.srs[m.key];
  view.innerHTML = `<div class="card">
      <div class="row between small muted"><span>${MLOOP.idx + 1} / ${MLOOP.queue.length}・${esc(m.cat || '綜合')}・錯 ${m.count || 1} 次${second ? '・再看一次' : ''}</span><span>${rec ? srsDots(rec.b) : ''}</span></div>
      <div class="flash">
        ${faces.front}
        ${MLOOP.flipped ? `<div class="divider"></div>${faces.back}${m.note ? `<div class="small muted mt-2">筆記：${esc(m.note)}</div>` : ''}` : ''}
      </div>
      ${!MLOOP.flipped ? `<button type="button" class="btn btn-primary btn-block btn-lg" data-act="mloop-flip">看答案 <span class="kbd kbd-hint" style="background:transparent;border-color:currentColor;color:inherit">Space</span></button>`
        : second ? `<button type="button" class="btn btn-primary btn-block btn-lg" data-act="mloop-next">下一張 <span class="kbd kbd-hint" style="background:transparent;border-color:currentColor;color:inherit">Space</span></button>`
        : `<div class="rate two">
          <button type="button" class="btn" data-act="mloop-rate" data-g="again">忘了<small>1・這一輪最後再看</small></button>
          <button type="button" class="btn btn-primary" data-act="mloop-rate" data-g="good">記得<small>2</small></button>
        </div>`}
      <div class="row-wrap mt-3" style="justify-content:space-between">
        <button type="button" class="btn btn-sm btn-ghost" data-act="speak" data-text="${esc(mloopSpeakText(m))}">${icon('speaker')}朗讀</button>
        <button type="button" class="btn btn-sm btn-ghost" data-act="nav" data-route="#/mistakes">結束</button>
      </div>
    </div>`;
}
// ---- 聽播: the notebook read aloud in a loop. Word → meaning (Chinese, browser voice) → example; sentence → translation →
// sentence again. Pure listening: no schedule, no counts. The screen shows everything at once, no flipping. ----
let LISTEN = null;   // { all, items, idx, round, playing, order: 'count'|'random', scope: 'all'|'v'|'g', zh, run, wake }
const LISTEN_GAP = { short: 350, long: 900 };
function listenEntryVocab(it, m) {
  const w = jaPlain(it.w); const pin = it.r && !HAS_KANJI.test(it.r) && it.r !== w ? it.r : '';
  return { kind: 'v', id: m ? m.id : it.key, m: m || null, word: w, wordHtml: furi(it.w), reading: pin, meaning: it.m || '', ex: vocabExamples(it)[0] || null };
}
function listenEntry(m) {

function mloopKey(ev) {
  if (!MLOOP) return;
  const k = ev.key; const m = mloopCurrent();
  if (k === ' ' || k === 'Enter') { ev.preventDefault(); if (!MLOOP.flipped) ACTIONS['mloop-flip'](); else if (m && MLOOP.rated[m.id]) ACTIONS['mloop-next'](); return; }
  if (MLOOP.flipped && m && !MLOOP.rated[m.id] && (k === '1' || k === '2')) { ev.preventDefault(); ACTIONS['mloop-rate']({ dataset: { g: k === '1' ? 'again' : 'good' } }); return; }

}

function derivedUnits(level, m, need, usedKeys) {
  if (need <= 0) return [];
  let pool = [];

  else if (m === 'S2-M1') pool = REG.grammar.filter(g => g.lv === level && ['choice', 'conj', 'adj'].includes(g.t || 'choice'));
  else if (m === 'S2-M2') pool = REG.grammar.filter(g => g.lv === level && g.t === 'order');
  const ranked = rankBySeen(shuffle(pool), it => 'd:' + it.key + ':' + m);
  const out = [];
  for (const it of ranked) {
    if (out.length >= need) break;
    if (usedKeys.has(it.key)) continue;
    const q = derivedQuestion(it, m);
    if (!q) continue;
    usedKeys.add(it.key);

function rankBySeen(list, idOf) {
  const strat = (EXAM && EXAM.strategy) || examStrategy();
  const info = (x) => examSeen(idOf(x));
  if (strat === 'wrong') return list.filter(x => { const h = info(x); return h && h.lastResult === 'wrong'; }).concat(list.filter(x => { const h = info(x); return !(h && h.lastResult === 'wrong'); }));

function examStrategy() { return (document.getElementById('exStrategy') || {}).value || 'unseen'; }

function assemblePaper(level, size, subjects) {

  const si = SIZE_INDEX[size] ?? 1;
  const curated = curatedUnits(level);
  const usedKeys = new Set();
  const paper = [];
  const shortage = [];
  Object.keys(plan.mondai).forEach(m => {
    const sec = m.slice(0, 2);
    if (!subjects.includes(sec)) return;
    const want = plan.mondai[m][si];
    if (!want) return;
    let units = rankBySeen(shuffle(curated.filter(u => u.m === m)), u => u.ids[0]);
    // freshly generated AI items go first so the learner actually sees them
    if (EXAM && EXAM.prefer) units = units.filter(u => EXAM.prefer.has(u.ids[0])).concat(units.filter(u => !EXAM.prefer.has(u.ids[0])));
    units = units.slice(0, want);
    if (units.length < want) units = units.concat(derivedUnits(level, m, want - units.length, usedKeys));
    if (units.length < want) shortage.push(`${MONDAI[m].t.replace('　', ' ')}（${units.length}/${want}）`);
    units.forEach(u => u.qs.forEach(q => paper.push(Object.assign(q, { sec, mondaiTitle: MONDAI[m].t, mondaiDesc: MONDAI[m].d, isListening: sec === 'S3' }))));
  });
  return { paper, shortage };
}

function startExam(opt = {}) {

  const formal = opt.formal !== undefined ? opt.formal : Boolean(state.settings.examFormal);
  EXAM = { strategy: examStrategy(), prefer: opt.prefer ? new Set(opt.prefer) : null };
  const { paper, shortage } = assemblePaper(level, size, subjects);
  if (!paper.length) { toast('題庫不足，無法組卷'); EXAM = null; return; }

  const sections = ['S1', 'S2', 'S3'].filter(sec => paper.some(q => q.sec === sec)).map(sec => {
    const idx = paper.map((q, i) => (q.sec === sec ? i : -1)).filter(i => i >= 0);
    return { sec, limitMin: Math.max(3, Math.round(plan.time[sec] * factor)), from: idx[0], to: idx[idx.length - 1], start: null, end: null };
  });

  EXAM = Object.assign(EXAM, {
    level, size, subjects, paper, idx: 0, answers: new Array(paper.length).fill(-1), locked: new Array(paper.length).fill(false),
    title: `JLPT ${level} 模擬考（${sizeLabel}・${paper.length} 題${formal ? '・正式模式' : ''}）${opt.ai ? '・含 AI 新題' : ''}`, isAi: Boolean(opt.ai),

}

function examKey(ev) {
  const k = ev.key;
  if (EXAM && EXAM.formal && (k === 'ArrowRight' || k === 'Enter') && EXAM.idx >= examSection().to) { ev.preventDefault(); return; }
  if (['1', '2', '3', '4'].includes(k)) { ev.preventDefault(); const q = EXAM && EXAM.paper[EXAM.idx]; if (q && Number(k) <= q.options.length) examAnswer(Number(k) - 1); return; }
  if (k === 'ArrowRight' || k === 'Enter') { ev.preventDefault(); ACTIONS['exam-next'](); return; }
  if (k === 'ArrowLeft') { ev.preventDefault(); ACTIONS['exam-prev'](); return; }
  if (k === 'r' || k === 'R') { ev.preventDefault(); ACTIONS['exam-play'](); return; }
  if (k === 'f' || k === 'F') { ev.preventDefault(); toggleFurigana(); }
}

function scoreExam() {
  const P = EXAM.paper;
  const lr = P.filter(q => q.sec !== 'S3'); const li = P.filter(q => q.sec === 'S3');
  const correct = (arr) => arr.filter(q => EXAM.answers[P.indexOf(q)] === q.answer).length;
  const lrC = correct(lr); const liC = correct(li);
  let lr120 = lr.length ? Math.round(lrC / lr.length * 120) : null;
  let li60 = li.length ? Math.round(liC / li.length * 60) : null;
  // a single-subject paper is extrapolated so the total stays comparable
  if (lr120 === null && li60 !== null) lr120 = li60 * 2;
  if (li60 === null && lr120 !== null) li60 = Math.round(lr120 / 2);
  const total = (lr120 || 0) + (li60 || 0);
  const pass = EXAM_PLAN[EXAM.level].pass;
  const passed = total >= pass && lr120 >= 38 && li60 >= 19;
  const byM = {};
  P.forEach((q, i) => { const k = q.m; byM[k] = byM[k] || { n: 0, c: 0, t: q.mondaiTitle }; byM[k].n++; if (EXAM.answers[i] === q.answer) byM[k].c++; });
  // 参考情報 on the official report: A ≥ 67%, B ≥ 34%, C below
  const share = (pred) => { const idx = P.map((q, i) => (pred(q) ? i : -1)).filter(i => i >= 0); return idx.length ? idx.filter(i => EXAM.answers[i] === P[i].answer).length / idx.length : null; };
  const grade = (r) => (r === null ? '—' : r >= 0.67 ? 'A' : r >= 0.34 ? 'B' : 'C');
  const refVocab = grade(share(q => q.sec === 'S1'));
  const refGrammar = grade(share(q => ['S2-M1', 'S2-M2', 'S2-M3'].includes(q.m)));
  return { lrC, lrN: lr.length, liC, liN: li.length, lr120, li60, total, pass, passed, byM, correct: lrC + liC, n: P.length, lrOnly: !li.length, liOnly: !lr.length, refVocab, refGrammar };
}

// Look the word up first; fall back to the shape of the ending.
function detectWordType(w) {
  const hit = REG.vocab.find(v => jaPlain(v.w) === w || v.r === w);
  if (hit && ['v5', 'v1', 'vs', 'vk', 'i', 'na'].includes(hit.p)) {
    return { kind: hit.p, word: jaPlain(hit.w), reading: hit.r, meaning: hit.m, sure: true };
  }
  if (/する$/.test(w)) return { kind: 'vs', word: w, sure: false };
  if (w === '来る' || w === 'くる') return { kind: 'vk', word: '来る', sure: true };
  if (/る$/.test(w)) {
    if (GODAN_RU.has(w)) return { kind: 'v5', word: w, sure: false };
    if (E_I_RU.test(w)) return { kind: 'v1', word: w, sure: false };
    if (/[一-鿿]る$/.test(w) && w.length === 2) return { kind: 'v1', word: w, sure: false };
    return { kind: 'v5', word: w, sure: false };
  }
  if (/[うくぐすつぬぶむ]$/.test(w)) return { kind: 'v5', word: w, sure: false };
  if (/い$/.test(w)) return { kind: 'i', word: w, sure: false };
  return { kind: 'na', word: w, sure: false };
}

      hit = [stem, te && te.slice(0, -1), nai && nai.slice(0, -2)].some(x => x && jaPlain(x).length >= 2 && s.includes(jaPlain(x)));
    }
    if (!hit && v.p === 'i') hit = s.includes(w.slice(0, -1) + 'く') || s.includes(w.slice(0, -1) + 'か');
    if (hit && !seen.has(w)) { seen.add(w); words.push(v); }
  });
  words.sort((a, b) => s.indexOf(jaPlain(a.w).slice(0, 2)) - s.indexOf(jaPlain(b.w).slice(0, 2)));
  const pats = PATTERNS.filter(([re]) => re.test(s)).slice(0, 6);
  const parts = PARTICLE_NOTES.filter(([p]) => s.includes(p)).slice(0, 4);
  return `
    <div class="panel mt-3">
      <div class="jp" style="font-size:20px;line-height:2">${furi(s)}</div>
      ${words.length ? `<div class="small muted mt-3">單字</div><div class="list">${words.slice(0, 12).map(v => `<div class="list-item"><span class="jp">${esc(jaPlain(v.w))}</span><span class="small muted jp">${esc(v.r && v.r !== v.w ? v.r : '')}</span><span class="small grow">${esc(v.m)}</span><span class="tiny muted">${esc(posLabel(v.p))}</span></div>`).join('')}</div>` : ''}
      ${pats.length ? `<div class="small muted mt-3">句型</div><ul class="small">${pats.map(([, n, d]) => `<li><b class="jp">${esc(n)}</b>：${esc(d)}</li>`).join('')}</ul>` : ''}
      ${parts.length ? `<div class="small muted mt-3">助詞提示</div><ul class="small">${parts.map(([, d]) => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}
      <div class="hint mt-2">這是離線的簡易分析（只比對單字表與常見句型）。設定 AI 後可以得到完整的翻譯與結構說明。</div>
    </div>`;
}

// ---------- backup ----------
function downloadFile(name, text, type = 'application/json') {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function exportBackup(withKeys) {
  state.lastBackup = todayStr();
  saveState();
  const copy = deepClone(state);
  if (!withKeys) {
    if (copy.aiConfig) ['geminiKey', 'openaiKey'].forEach(k => { if (copy.aiConfig[k]) copy.aiConfig[k] = ''; });
    if (copy.ttsConfig) TTS_SECRET_KEYS.forEach(k => { if (copy.ttsConfig[k]) copy.ttsConfig[k] = ''; });
  }
  const payload = { app: 'nihongo-quest', v: 3, exportedAt: new Date().toISOString(), state: copy };
  downloadFile(`nihongo-quest-backup-${todayStr()}.json`, JSON.stringify(payload));
  toast('已下載備份');
}
function isLegacyBackup(o) { return o && !o.v && (Array.isArray(o.grammarDrills) || Array.isArray(o.vocab) || o.dailyLogs || Array.isArray(o.mistakes)); }
function applyImportedState(next, msg) {
  const keepAi = state.aiConfig; const keepTts = state.ttsConfig; const hadAi = isAiConfigured();
  state = normalizeState(next);
  LAST_BULK_MARK = null;   // the snapshot belongs to the state that was replaced
  // a backup saved without keys should not wipe the keys already entered here
  if (hadAi && !isAiConfigured()) state.aiConfig = keepAi;
  if (keepTts && !(state.ttsConfig && TTS_SECRET_KEYS.some(k => state.ttsConfig[k]))) state.ttsConfig = Object.assign({}, state.ttsConfig || {}, Object.fromEntries(TTS_SECRET_KEYS.map(k => [k, keepTts[k] || ''])));
  saveState(); buildRegistry(); applyTheme(); applyFurigana();
  SESSION = null; FLASH = null; EXAM = null;
  closeModal(); toast(msg, 4000); go('#/today');
}
async function importBackupFile(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (e) { toast('這不是有效的 JSON 檔案'); return; }
  if (obj && obj.app === 'nihongo-quest' && obj.state) {
    if (!confirm('還原這份備份？目前的進度會被取代。')) return;
    applyImportedState(obj.state, '已從備份還原');
  } else if (obj && obj.v === 3 && obj.srs) {
    if (!confirm('還原這份備份？目前的進度會被取代。')) return;
    applyImportedState(obj, '已從備份還原');
  } else if (isLegacyBackup(obj)) {
    if (!confirm('這是舊版的備份，要轉換並匯入嗎？目前的進度會被取代。')) return;
    applyImportedState(migrateLegacy(obj), '已轉換並匯入舊版備份');
  } else {
    toast('看不出這是哪一種備份檔');
  }
}

// ---------- change handlers ----------
Object.assign(CHANGE_ACTIONS, {
  setting: (el) => {
    const k = el.dataset.key;
    let v;
    if (el.dataset.type === 'bool') v = el.checked;
    else if (el.dataset.type === 'num') {
      v = Number(el.value);
      if (!Number.isFinite(v)) return;
      v = clamp(v, Number(el.dataset.min ?? -Infinity), Number(el.dataset.max ?? Infinity));
      el.value = v;
    } else if (el.dataset.type === 'date') { if (!/^\d{4}-\d{2}-\d{2}$/.test(el.value)) return; v = el.value; }
    else v = el.value;
    if (k === 'furiState') {
      state.settings.furigana = v !== 'off';
      if (v !== 'off') state.settings.furiMode = v;
      saveState(); applyFurigana();
      if (modalOpen()) settingsDirty = true; else route();
      return;
    }
    if (k === 'retention') v = Number(v) || 0.9;
    state.settings[k] = v;
    saveState();
    if (k === 'theme') applyTheme();
    if (k === 'furigana') applyFurigana();
    if (k === 'includeImported') FLASH = null;
    if (k === 'speechRate') { const hint = el.closest('.setting-row').querySelector('.hint'); if (hint) hint.textContent = `目前 ${Number(v).toFixed(2)} 倍`; }
    if (modalOpen()) settingsDirty = true; else route();
  },
  'tts-cfg': (el) => {
    ttsConfig()[el.dataset.key] = el.value.trim();
    if (el.dataset.key === 'engine' || /Key$|Url$/.test(el.dataset.key)) ttsCheckHtml = '';   // the last check no longer applies
    ttsWarned = false;
    saveState();
    if (el.dataset.key === 'engine') refreshSettings();
    settingsDirty = true;
  },
  'ai-cfg': (el) => {
    aiConfig()[el.dataset.key] = el.value.trim();
    saveState();
    if (['provider', 'geminiKey', 'openaiKey'].includes(el.dataset.key)) refreshSettings();
    settingsDirty = true;
  },
  'backup-import': (el) => { const f = el.files && el.files[0]; if (f) importBackupFile(f); el.value = ''; }
});

// the past week's practice, from the daily logs: 單字（含漢字）／文法／其他（聽力、閱讀、模擬考）
function weekPractice(days = 7) {
  const t = todayStr();
  return Array.from({ length: days }, (_, i) => {
    const date = addDays(t, i - (days - 1)); const e = state.dailyLogs[date] || {};
    const v = e.vocabCount || 0, g = e.grammarCount || 0, q = (e.quizCount || 0) + (e.bonusCount || 0);
    return { date, v, g, q, total: v + g + q };
  });
}
// overall progress of a bank in three mastery steps (counts) plus a weighted score: 已學 1・熟悉 2・熟練 3 points out of 3 per item
function progressTotals(kind) {
  const t = { kind, total: 0, seen: 0, learned: 0, mastered: 0, n5: 0 };   // n5: how many of the items are N5 (a faint mark on the gauge)
  const n5Units = new Set(DATA.UNITS.filter(u => u.lv === 'N5').map(u => u.id));   /* level-literal-ok: units */
  if (kind === 'v') {
    REG.vocab.filter(v => v.builtin).forEach(v => { t.total++; if (v.lv !== 'N4') t.n5++; const r = state.srs[v.key]; if (!r) return; const l = srsLevelLabel(r, v.key); if (l === '已熟練') t.mastered++; else if (r.b >= SRS_LEARNED) t.learned++; else t.seen++; });
  } else {
    REG.grammar.forEach(g => { t.total++; if (n5Units.has(g.u)) t.n5++; const r = state.srs[g.key]; if (!r) return; if ((r.ok || 0) >= 3) t.mastered++; else if ((r.ok || 0) >= 1) t.learned++; else t.seen++; });
  }
  t.pct = t.total ? Math.round((t.seen + t.learned * 2 + t.mastered * 3) / (t.total * 3) * 100) : 0;
  return t;
}
// half-circle gauge: three arcs (dark = mastered on the left, lighter steps to the right) over a track, needle at the weighted score
function gaugeHtml(t, title, labels) {
  const R = 80, C = 100, W = 20;
  const pt = (f) => { const a = Math.PI * (1 - f); return [C + R * Math.cos(a), C - R * Math.sin(a)]; };
  const arc = (f0, f1) => { const [x0, y0] = pt(f0); const [x1, y1] = pt(f1); return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
  const gap = 2 / (Math.PI * R);   // a 2px surface gap between segments
  const segs = [['mastered', t.mastered, labels[0]], ['learned', t.learned, labels[1]], ['seen', t.seen, labels[2]]];
  let f = 0; const paths = [];
  segs.forEach(([cls, n, label]) => {
    if (!n || !t.total) return;
    const f0 = f, f1 = f + n / t.total; f = f1;
    const a0 = f0 > 0 ? f0 + gap / 2 : f0; let a1 = f1 < 1 ? f1 - gap / 2 : f1;
    if (a1 - a0 < gap) a1 = Math.min(1, a0 + gap);   // a tiny count still shows as a sliver
    paths.push(`<path class="arc ${cls}" d="${arc(a0, a1)}" stroke-width="${W}" tabindex="0" data-tip-title="${esc(label)}：${n}" data-tip-body="占 ${Math.round(n / t.total * 100)}%"></path>`);
  });
  // faint tick where the N5 items end, with N5 / N4 labels on either side just outside the ring
  const tf = t.total && t.n5 > 0 && t.n5 < t.total ? t.n5 / t.total : null;
  const tick = tf === null ? '' : (() => { const a = Math.PI * (1 - tf); const rr = (r2) => [C + r2 * Math.cos(a), C - r2 * Math.sin(a)];
    const [x0, y0] = rr(R - W / 2 - 3), [x1, y1] = rr(R + W / 2 + 3); const off = 0.09; const al = Math.PI * (1 - tf + off), ar = Math.PI * (1 - tf - off);
    const lab = (ang, txt) => `<text class="tick-l" x="${(C + (R + W / 2 + 9) * Math.cos(ang)).toFixed(1)}" y="${(C - (R + W / 2 + 9) * Math.sin(ang) + 3).toFixed(1)}" text-anchor="middle">${txt}</text>`;
    return `<line class="tick" data-f="${tf.toFixed(4)}" x1="${x0.toFixed(2)}" y1="${y0.toFixed(2)}" x2="${x1.toFixed(2)}" y2="${y1.toFixed(2)}"></line>${lab(al, 'N5')}${lab(ar, 'N4')}`; })();
  const [nx, ny] = (() => { const a = Math.PI * (1 - t.pct / 100); return [C + (R - W / 2 - 4) * Math.cos(a), C - (R - W / 2 - 4) * Math.sin(a)]; })();   // ends just inside the ring
  const legend = `<div class="glegend small muted mt-1"><span><i class="seg-dot mastered"></i>${esc(labels[0])} ${t.mastered}</span> <span><i class="seg-dot learned"></i>${esc(labels[1])} ${t.learned}</span> <span><i class="seg-dot gseen"></i>${esc(labels[2])} ${t.seen}</span> <span>未學 ${t.total - t.seen - t.learned - t.mastered}</span> <span>共 ${t.total}</span></div>`;
  return `<div class="gauge" data-kind="${t.kind}" data-total="${t.total}" data-seen="${t.seen}" data-learned="${t.learned}" data-mastered="${t.mastered}" data-pct="${t.pct}">
    <div class="small" style="text-align:center"><strong>${esc(title)}</strong></div>
    <svg viewBox="-6 0 212 146" role="img" aria-label="${esc(title)}總進度 ${t.pct}%：${esc(labels[0])} ${t.mastered}、${esc(labels[1])} ${t.learned}、${esc(labels[2])} ${t.seen}，共 ${t.total}">
      <path class="track" d="${arc(0, 1)}" stroke-width="${W}"></path>${paths.join('')}${tick}
      <line class="needle" x1="${C}" y1="${C}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}"></line><circle class="pivot" cx="${C}" cy="${C}" r="4"></circle>
      <text class="hero" x="${C}" y="${C + 32}" text-anchor="middle">${t.pct}%</text><text class="hero-l" x="${C}" y="${C + 44}" text-anchor="middle">總進度</text>
    </svg>${legend}</div>`;
}
// Daily quotas that would finish every bank before the mock-exam weeks: unseen items ÷ study days, per kind.
// Reviews need room on top of the new items (about one and a half times), which is what the load cap covers.
function planAdvice() {
  const s = state.settings;
  const pace = examPace();
  const studyDays = Math.max(0, pace.daysLeft - 21);
  const unseen = (arr) => arr.filter(x => !state.srs[x.key]).length;
  const banks = [
    { k: 'v', name: '單字', total: REG.vocab.filter(x => x.builtin).length, left: unseen(REG.vocab.filter(x => x.builtin)), key: 'v', max: 40 },
    { k: 'g', name: '文法', total: REG.grammar.length, left: unseen(REG.grammar), key: 'g', max: 30 },
    { k: 'k', name: '漢字', total: REG.kanji.length, left: unseen(REG.kanji), key: 'k', max: 15 },
    { k: 'l', name: '聽力', total: REG.listen.length, left: unseen(REG.listen), key: 'l', max: 10 },
    { k: 'r', name: '閱讀', total: REG.read.length, left: unseen(REG.read) }
  ];
  banks.forEach(b2 => {
    b2.done = b2.total - b2.left;
    b2.need = studyDays > 0 ? b2.left / studyDays : (b2.left ? Infinity : 0);
    b2.cur = b2.key ? newQuota(b2.key) : null;
    b2.rec = b2.key ? clamp(Math.ceil(studyDays > 0 ? b2.left / studyDays : b2.left), 0, b2.max) : null;
    b2.gap = b2.key ? (b2.cur > 0 ? b2.need / b2.cur : (b2.need > 0 ? Infinity : 0)) : null;   // >1: the current setting cannot finish in time
  });
  const quota = banks.filter(b2 => b2.key);
  const newPerDay = quota.reduce((a, b2) => a + b2.rec, 0);
  // 每天負荷上限 is the one dial: the smallest cap whose derived quotas cover every recommended quota
  const loadCap = clamp(Math.ceil(Math.max(0, ...quota.map(b2 => b2.rec / NEW_SHARE[b2.key])) / 5) * 5, 10, 300);
  const sessionSize = clamp(Math.ceil(Math.min(60, loadCap) / 5) * 5, 5, 60);
  const rec = { loadCap, sessionSize };
  const applied = Number(s.loadCap) === loadCap && Number(s.sessionSize) === sessionSize;
  const lagging = quota.filter(b2 => b2.gap > 1.15).sort((a, b2) => b2.gap - a.gap);
  return { studyDays, daysLeft: pace.daysLeft, banks, rec, applied, lagging, newPerDay };
}
function grammarPace() {
  const t = todayStr();
  const intro = Object.entries(state.srs).filter(([k]) => k.startsWith('g:')).map(([, r]) => r.intro || r.last).filter(Boolean).sort();
  const left = REG.grammar.filter(g => !state.srs[g.key]).length;
  if (!intro.length) return { left, rate: 0 };
  const span = clamp(daysBetween(intro[0], t) + 1, 3, 14);
  const recent = intro.filter(d => daysBetween(d, t) < span).length;
  const rate = recent / span;
  const pace = examPace();
  const finish = rate > 0 ? addDays(t, Math.ceil(left / rate)) : null;
  const target = addDays(pace.exam, -21);
  return { left, rate, finish, target, late: finish ? daysBetween(target, finish) : null };
}
function weakPoints(limit = 8) {
  const agg = {};
  REG.grammar.forEach(g => {
    const r = state.srs[g.key];
    if (!r || !g.pt) return;
    const a = agg[g.pt] || (agg[g.pt] = { pt: g.pt, ok: 0, ng: 0, items: [], unit: g.u });
    a.ok += r.ok || 0; a.ng += r.ng || 0; a.items.push(g);
  });
  return Object.values(agg).filter(a => a.ok + a.ng >= 4).map(a => Object.assign(a, { acc: a.ok / (a.ok + a.ng) }))
    .filter(a => a.acc < 0.9).sort((a, b) => a.acc - b.acc || (b.ng - a.ng)).slice(0, limit);
}

  if (it.kind === 'l') return it.line || it.q || it.scene || '';
  if (it.kind === 'r') return it.q || '';
  return it.key;
}

function attachChartTips(root) {

  if (!tip) { tip = document.createElement('div'); tip.id = 'chartTip'; tip.className = 'chart-tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip); }
  const show = (el, x, y) => {
    tip.textContent = '';
    const b = document.createElement('b'); b.textContent = el.dataset.tipTitle || '';
    const s = document.createElement('span'); s.textContent = el.dataset.tipBody || '';
    tip.appendChild(b); tip.appendChild(s);
    tip.classList.add('show');
    const w = tip.offsetWidth; const h = tip.offsetHeight;
    tip.style.left = `${clamp(x - w / 2, 8, window.innerWidth - w - 8)}px`;
    tip.style.top = `${Math.max(8, y - h - 12)}px`;
  };
  const hide = () => tip.classList.remove('show');
  root.querySelectorAll('[data-tip-title]').forEach(el => {
    el.addEventListener('pointermove', (ev) => show(el, ev.clientX, ev.clientY));
    el.addEventListener('pointerleave', hide);
    el.addEventListener('focus', () => { const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.top); });

}

/* ---- 雲端音檔: every built-in sentence synthesized once (Google Neural2) and kept in a public Supabase bucket ----
   The file name is a hash of exactly what Google is sent (SSML with the readings pinned, voice gender), so the generator
   (設定 › 語音 › 管理者) and the player agree by construction. A missing file (custom cards, AI items) falls back to the
   browser voice and is noted locally so the next generator run covers it. */
const CLOUD_AUDIO = { bucket: 'JPY_audio', set: 'v1' };
const cloudMisses = new Set();   // paths that were not on the server this session: straight to the browser voice next time
function cloudAudioBase() { return `${((window.NQ_CONFIG || {}).supabaseUrl || '').replace(/\/$/, '')}/storage/v1/object/public/${CLOUD_AUDIO.bucket}/${CLOUD_AUDIO.set}`; }
function cloudAudioSsml(text, opt = {}) { return opt.reading ? `<speak><sub alias="${esc(opt.reading)}">${esc(text)}</sub></speak>` : ssmlReadings(text); }
const CLOUD_ZH_VOICE = { languageCode: 'cmn-TW', name: 'cmn-TW-Wavenet-A' };   // meanings and translations (opt.lang === 'zh'): one Taiwanese Mandarin voice
async function cloudAudioPath(text, gender, opt = {}) {
  const g = opt.lang === 'zh' ? 'zh' : gender === 'm' ? 'm' : 'f';
  const input = g === 'zh' ? String(text) : cloudAudioSsml(text, opt);
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`${CLOUD_AUDIO.set}|${g}|${input}`));
  return `${g}/${[...new Uint8Array(buf)].slice(0, 16).map(b => b.toString(16).padStart(2, '0')).join('')}.mp3`;
}
function cloudMissList() { try { return JSON.parse(localStorage.getItem('nq_audio_miss') || '[]'); } catch (e) { return []; } }
function noteCloudMiss(text, gender, opt = {}) {
  try {
    const list = cloudMissList(); const reading = opt.reading || '';
    if (list.some(m => m.text === text && m.gender === (gender || '') && (m.reading || '') === reading)) return;
    list.push({ text, gender: gender || '', reading }); localStorage.setItem('nq_audio_miss', JSON.stringify(list.slice(-2000)));
  } catch (e) { /* ignore */ }
}
// a listening script: one line per speaker, 「男：」 lines in the male voice (shared by the player and the generator)
function scriptParts(script) {
  return String(script || '').split(/\n+/).map(l => l.trim()).filter(Boolean).map(line => {
    const m = /^([^：:]{1,6})[：:]\s*(.+)$/.exec(line);
    const who = m ? m[1] : '';
    return { gender: /男/.test(who) ? 'm' : (/女/.test(who) ? 'f' : ''), text: ttsText(m ? m[2] : line) };
  }).filter(p => p.text);
}

// Text that should be read aloud: readings resolved (来[こ]ない → こない), markup and blanks removed
// Readings we are sure of (the furigana dictionary, bracket readings, counters) applied to a sentence for speech.
// readingSegments → ['机' → つくえ, 'の', '上' → うえ …]; kanaReadings swaps them for kana (engines without SSML);
// ssmlReadings keeps the kanji for the model's prosody and pins the pronunciation with <sub alias>.
const UNESC = { '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"', '&#39;': "'" };
function unesc(s) { return String(s || '').replace(/&(amp|lt|gt|quot|#39);/g, (m) => UNESC[m]); }
function readingSegments(text) {
  const html = furi(text);
  const out = []; const re = /<ruby[^>]*>([^<]+)<rt>([^<]+)<\/rt><\/ruby>|<[^>]+>|([^<]+)/g; let m;
  while ((m = re.exec(html))) { if (m[1] !== undefined) out.push({ k: unesc(m[1]), r: unesc(m[2]) }); else if (m[3]) out.push(unesc(m[3])); }
  return out;
}
function kanaReadings(text) { return readingSegments(text).map(x => typeof x === 'string' ? x : x.r).join(''); }
function ssmlReadings(text) { return '<speak>' + readingSegments(text).map(x => typeof x === 'string' ? esc(x) : `<sub alias="${esc(x.r)}">${esc(x.k)}</sub>`).join('') + '</speak>'; }
function ttsText(s) {
  return jaKana(String(s || ''))
    .replace(/<[^>]+>/g, '')
    .replace(/（[^）]*）|\([^)]*\)/g, '')
    .replace(/[＿★]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

const MALE_VOICE = /keita|ichiro|otoya|hattori|takumi|daichi|naoki|shota|male|男/i;
function jaVoices() {
  if (!('speechSynthesis' in window)) return [];
  const score = (v) => {
    const n = (v.name || '').toLowerCase();
    let s = 0;
    if (n.includes('natural') || n.includes('online')) s += 100;
    if (n.includes('nanami') || n.includes('keita')) s += 80;
    if (n.includes('google')) s += 70;
    if (n.includes('premium') || n.includes('enhanced') || n.includes('siri')) s += 60;
    if (n.includes('kyoko') || n.includes('otoya') || n.includes('o-ren') || n.includes('hattori')) s += 40;
    if (!v.localService) s += 20;
    return s;
  };
  return (window.speechSynthesis.getVoices() || []).filter(v => /^ja/i.test(v.lang || '')).sort((a, b) => score(b) - score(a));
}
function pickVoice(gender) {
  const all = jaVoices();
  if (!all.length) return null;
  const cfg = ttsConfig();
  const chosen = cfg.browserVoiceURI ? all.find(v => v.voiceURI === cfg.browserVoiceURI) : null;
  if (gender === 'm') return all.find(v => MALE_VOICE.test(v.name)) || chosen || all[0];
  if (gender === 'f') return (chosen && !MALE_VOICE.test(chosen.name) ? chosen : all.find(v => !MALE_VOICE.test(v.name))) || all[0];
  return chosen || all[0];
}
