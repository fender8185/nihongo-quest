<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0f13" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Nihongo" />
<script src="./vendor/supabase.js"></script>
<script src="./sync-core.js"></script>

<title>Nihongo Quest N4</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root, [data-theme="dark"] {
  --bg: #0e0f13; --bg-elev: #15161b; --bg-elev-2: #1c1d24; --bg-sunken: #0a0b0e; --bg-hover: #20222a;
  --line: #262830; --line-2: #343743;
  --fg: #ecedf1; --fg-2: #b3b6c3; --fg-3: #80838f;
  --accent: #8b9cff; --accent-fg: #0d0f1a; --accent-soft: rgba(139,156,255,.14); --accent-line: rgba(139,156,255,.45);
  --ok: #34d399; --ok-soft: rgba(52,211,153,.12); --ok-line: rgba(52,211,153,.5);
  --bad: #fb7185; --bad-soft: rgba(251,113,133,.12); --bad-line: rgba(251,113,133,.5);
  --warn: #fbbf24; --warn-soft: rgba(251,191,36,.12);
  --heat-0: #1c1d24; --heat-1: #14432f; --heat-2: #17694a; --heat-3: #1f9a68; --heat-4: #43d39a; --gauge-seen: #17694a;
  --shadow: 0 1px 2px rgba(0,0,0,.45), 0 8px 24px -12px rgba(0,0,0,.5);
  --ruby: #9ea1ad;
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: #f5f6f8; --bg-elev: #ffffff; --bg-elev-2: #f0f1f4; --bg-sunken: #e9ebef; --bg-hover: #eceef2;
  --line: #e1e3e9; --line-2: #cfd2da;
  --fg: #16171c; --fg-2: #474a55; --fg-3: #767986;
  --accent: #4b57d1; --accent-fg: #ffffff; --accent-soft: rgba(75,87,209,.09); --accent-line: rgba(75,87,209,.45);
  --ok: #04885b; --ok-soft: rgba(4,136,91,.09); --ok-line: rgba(4,136,91,.45);
  --bad: #d7264f; --bad-soft: rgba(215,38,79,.08); --bad-line: rgba(215,38,79,.45);
  --warn: #a35d00; --warn-soft: rgba(217,119,6,.1);
  --heat-0: #e6e8ed; --heat-1: #b9e8cf; --heat-2: #74cfa1; --heat-3: #2fa96f; --heat-4: #0b7a4a; --gauge-seen: #4dbd8a;
  --shadow: 0 1px 2px rgba(20,22,30,.06), 0 8px 24px -14px rgba(20,22,30,.18);
  --ruby: #6b6e79;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans JP", sans-serif;
  font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
.jp { font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans TC", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; border-right: 1px solid var(--line); background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-family: "Noto Sans JP", sans-serif; }
.brand-name { font-weight: 700; letter-spacing: .01em; }
.brand-sub { font-size: 12px; color: var(--fg-3); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--fg-2); cursor: pointer; text-align: left; font-size: 14px; }
.nav-item:hover { background: var(--bg-hover); color: var(--fg); }
.nav-item[aria-current="page"] { background: var(--bg-elev-2); color: var(--fg); font-weight: 500; }
.nav-item svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav-item .count { margin-left: auto; font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.nav-sep { height: 1px; background: var(--line); margin: 10px 6px; }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: none; position: sticky; top: 0; z-index: 20; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar-title { font-weight: 600; font-size: 15px; }
.content { width: 100%; max-width: 1000px; margin: 0 auto; padding: 28px 32px 72px; }
.content:focus { outline: none; }
.bottomnav { display: none; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .topbar { display: flex; }
  .content { padding: 16px 16px calc(92px + env(safe-area-inset-bottom)); }
  .bottomnav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg-elev) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
  .bottomnav button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; border: 0; background: transparent; color: var(--fg-3); font-size: 11px; cursor: pointer; border-radius: 8px; }
  .bottomnav button svg { width: 22px; height: 22px; }
  .bottomnav button[aria-current="page"] { color: var(--accent); }
}
body.practicing .sidebar, body.practicing .bottomnav, body.practicing .topbar { display: none; }
body.practicing .app { grid-template-columns: 1fr; }
body.practicing .content { max-width: 760px; padding-top: 18px; }

/* ---------- typography ---------- */
h1, h2, h3, h4 { margin: 0; line-height: 1.35; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.page-title { font-size: 22px; font-weight: 700; letter-spacing: .01em; }
.page-sub { color: var(--fg-3); font-size: 14px; margin-top: 2px; }
.muted { color: var(--fg-3); }
.dim { color: var(--fg-2); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.center { text-align: center; }
.mt-0 { margin-top: 0; } .mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; } .mt-6 { margin-top: 24px; }
.mb-0 { margin-bottom: 0; } .mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; }
.hidden { display: none !important; }

/* ---------- surfaces ---------- */
.card { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
.card + .card, .stack > * + * { margin-top: 14px; }
.grid > .card + .card { margin-top: 0; }
.card + .grid, .grid + .card, .grid + .grid, .banner + .grid { margin-top: 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-title { font-size: 15px; font-weight: 600; }
.card-sub { font-size: 13px; color: var(--fg-3); }
.panel { background: var(--bg-sunken); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 760px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.row { display: flex; align-items: center; gap: 10px; }
.row-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.divider { height: 1px; background: var(--line); margin: 14px 0; }

/* ---------- buttons & inputs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 14px; min-height: 38px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg-elev-2); color: var(--fg); cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s, transform .06s; text-decoration: none; }
.btn:hover { background: var(--bg-hover); border-color: var(--line-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, white); border-color: var(--accent); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--fg); }
.btn-danger { color: var(--bad); }
.btn-sm { min-height: 30px; padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.btn-lg { min-height: 48px; padding: 10px 20px; font-size: 16px; border-radius: 12px; }
.btn-block { width: 100%; }
.btn-icon { width: 36px; min-height: 36px; padding: 0; }
.btn svg { width: 16px; height: 16px; flex: none; }
.ico-furi { display: inline-flex; align-items: flex-end; justify-content: center; width: 18px; height: 18px; font-size: 14px; line-height: 1; flex: none; }
.ico-furi rt { font-size: 8px; color: currentColor; opacity: .75; }
.input, .select, textarea.input { width: 100%; min-height: 38px; padding: 8px 11px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg-sunken); color: var(--fg); font-size: 14px; }
.select { padding-right: 30px; }
.input:focus, .select:focus { outline: none; border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .label { font-size: 13px; color: var(--fg-2); font-weight: 500; }
.hint { font-size: 12px; color: var(--fg-3); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--bg-sunken); border: 1px solid var(--line); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--fg-2); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--bg-elev); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.2); font-weight: 500; }
.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 38px; height: 22px; border-radius: 99px; background: var(--line-2); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting-row:last-child { border-bottom: 0; }
.setting-row .label { color: var(--fg); font-size: 14px; }

/* ---------- chips, badges, progress ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; font-size: 12px; background: var(--bg-elev-2); color: var(--fg-2); border: 1px solid var(--line); white-space: nowrap; }
.chip-accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip-ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip-bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--bg-sunken); color: var(--fg-3); font-size: 12px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; flex: none; }
.bar { height: 8px; border-radius: 99px; background: var(--bg-sunken); overflow: hidden; border: 1px solid var(--line); }
.bar > span { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .3s; }
.bar.ok > span { background: var(--ok); }
.bar.thin { height: 5px; }
.bar.stack { height: 10px; background-repeat: no-repeat; background-size: 100% 100%; }
.bar.stack.thin { height: 6px; }
.bar.stack.grow { margin-top: 0; }
.seg-dot.mastered { background: var(--heat-4); }
.seg-dot.learned { background: var(--heat-3); }
.seg-dot.seen { background: var(--heat-2); }
.seg-dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.plan-topics { display: flex; flex-direction: column; gap: 4px; margin: -6px 0 14px; color: var(--fg-2); font-size: 14px; line-height: 1.6; }
.plan-topics b { color: var(--fg-3); font-weight: 500; font-size: 12px; margin-right: 8px; }
.plan-note { background: var(--warn-soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; margin: 0 0 14px; }
.dots { display: inline-flex; gap: 3px; vertical-align: middle; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); display: inline-block; }
.dots i.on { background: var(--ok); }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat-v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat-l { font-size: 12px; color: var(--fg-3); }
.ring { position: relative; width: 96px; height: 96px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .ring-txt { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.15; }
.ring .ring-txt b { font-size: 22px; font-variant-numeric: tabular-nums; }

/* ---------- lists & tables ---------- */
.list { display: flex; flex-direction: column; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }
.list-item.clickable { cursor: pointer; border-radius: 10px; padding: 12px 10px; }
.list-item > svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.list-item.clickable:hover { background: var(--bg-hover); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-weight: 500; color: var(--fg-3); font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--bg-elev); position: sticky; top: 0; }
.table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.empty { text-align: center; color: var(--fg-3); padding: 28px 12px; font-size: 14px; }

/* ---------- today ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.hero h2 { font-size: 20px; }
.plan-line { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0 14px; color: var(--fg-2); font-size: 14px; }
.plan-line b { color: var(--fg); font-variant-numeric: tabular-nums; }
@media (max-width: 600px) { .hero { grid-template-columns: 1fr; } .hero .ring { display: none; } }
.unit-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 99px; }

/* ---------- heatmap ---------- */
.heat-row { display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: flex-start; }
.heat-row > .grow { min-width: 0; }
.heat-stats { flex: 1 1 240px; align-content: start; }
.heat-wrap { overflow-x: auto; padding-bottom: 4px; max-width: 100%; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 3px; width: max-content; }
.heat i { width: 12px; height: 12px; border-radius: 3px; background: var(--heat-0); display: block; }
.heat i.l1 { background: var(--heat-1); } .heat i.l2 { background: var(--heat-2); } .heat i.l3 { background: var(--heat-3); } .heat i.l4 { background: var(--heat-4); }
.heat i.future { background: transparent; }
.heat i.today { outline: 1px solid var(--fg-3); outline-offset: 1px; }
.heat-months { display: grid; grid-auto-flow: column; gap: 3px; width: max-content; font-size: 11px; color: var(--fg-3); margin-bottom: 4px; }
.heat-months span { width: 12px; white-space: nowrap; overflow: visible; }
.legend { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--fg-3); }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* ---------- course ---------- */
.unit-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 120px; gap: 14px; align-items: center; padding: 12px 12px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; }
.unit-row:hover { background: var(--bg-hover); }
.unit-row.current { border-color: var(--accent-line); background: var(--accent-soft); }
.unit-weeks { font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.unit-title { font-weight: 500; }
.unit-desc { font-size: 13px; color: var(--fg-3); }
@media (max-width: 640px) { .unit-row { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.lesson h3 { font-size: 16px; margin: 18px 0 6px; }
.lesson .rule { display: inline-block; font-size: 13px; color: var(--fg-2); background: var(--bg-sunken); border: 1px solid var(--line); padding: 4px 10px; border-radius: 8px; margin: 2px 0 8px; }
.lesson ul { margin: 6px 0 10px; padding-left: 20px; }
.lesson li { margin: 4px 0; color: var(--fg-2); }
.example { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--bg-sunken); border: 1px solid var(--line); margin: 8px 0; }
.example .jp { font-size: 17px; line-height: 1.9; }
.example .zh { font-size: 13px; color: var(--fg-3); }
.kana-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 10px 0 14px; max-width: 420px; }
.kana-cell { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-sunken); color: var(--fg); font: inherit; cursor: pointer; }
.kana-cell.empty { border-color: transparent; background: transparent; cursor: default; }
.kana-cell .hira { font-size: 22px; line-height: 1.2; }
.kana-cell .kata { font-size: 13px; color: var(--fg-2); }
.kana-cell .roma { font-size: 11px; color: var(--fg-3); }
.chip-link { cursor: pointer; border-style: dashed; font: inherit; font-size: inherit; }
.tipbox { padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); border: 1px solid transparent; color: var(--fg); font-size: 14px; }

/* ---------- practice ---------- */
.pr-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.pr-top .bar { flex: 1; }
.pr-count { font-size: 13px; color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.q-card { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 16px; padding: 22px 22px 18px; box-shadow: var(--shadow); }
.q-label { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--fg-3); margin-bottom: 10px; }
.q-instr { font-size: 14px; color: var(--fg-2); margin-bottom: 10px; }
.q-stem { font-size: 26px; line-height: 2.05; font-weight: 500; word-break: break-word; }
.q-stem.word { font-size: 40px; line-height: 1.7; text-align: center; padding: 6px 0; }
.q-stem.zhstem { font-family: inherit; font-size: 24px; text-align: center; }
.q-sub { margin-top: 6px; font-size: 14px; color: var(--fg-3); }
.q-stem.word + .q-sub { text-align: center; }
.q-sub .toggle-zh { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; }

<script>
'use strict';
// ---- conj.js ----
// Japanese conjugation engine shared by the app and the content validator.
// Readings for 来る are written inline as 来[こ]ない so the UI can render ruby.
(function (root) {
  const ROWS = {
    'う': ['わ', 'い', 'う', 'え', 'お'], 'く': ['か', 'き', 'く', 'け', 'こ'], 'ぐ': ['が', 'ぎ', 'ぐ', 'げ', 'ご'],
    'す': ['さ', 'し', 'す', 'せ', 'そ'], 'つ': ['た', 'ち', 'つ', 'て', 'と'], 'ぬ': ['な', 'に', 'ぬ', 'ね', 'の'],
    'ぶ': ['ば', 'び', 'ぶ', 'べ', 'ぼ'], 'む': ['ま', 'み', 'む', 'め', 'も'], 'る': ['ら', 'り', 'る', 'れ', 'ろ']
  };
  const TE = { 'う': 'って', 'つ': 'って', 'る': 'って', 'む': 'んで', 'ぶ': 'んで', 'ぬ': 'んで', 'く': 'いて', 'ぐ': 'いで', 'す': 'して' };
  const HONORIFIC_I = new Set(['いらっしゃる', 'おっしゃる', 'くださる', 'なさる', 'ござる']);

  function stripReading(s) {
    return String(s || '').replace(/\[[^\]]*\]/g, '').replace(/（[ぁ-ゖー]+）/g, '').trim();
  }
  // Comparison key: a bracketed reading replaces the kanji run before it (来[こ]ない → こない).
  function normJa(s) {
    return String(s || '').replace(/[\u4e00-\u9fff々〆ヶ]+\[([ぁ-ゖー]+)\]/g, '$1').replace(/（[ぁ-ゖー]+）/g, '').replace(/\s+/g, '').trim();
  }

  // Basic stems for a verb. Returns null for unknown shapes.
  function verbStems(dict, g) {
    const d = String(dict || '').trim();
    if (!d) return null;
    if (g === 's' || (g !== 'k' && /する$/.test(d))) {
      const p = d.slice(0, -2);
      return { kind: 's', p, a: p + 'し', i: p + 'し', e: p + 'すれ', o: p + 'しよう', te: p + 'して', ta: p + 'した',
        pot: p + 'でき', pass: p + 'さ', caus: p + 'さ' };
    }
    if (g === 'k' || d === '来る' || d === 'くる') {
      const k = d.startsWith('来') ? '来' : '';
      const r = (kana) => k ? `来[${kana}]` : kana;
      return { kind: 'k', a: r('こ'), i: r('き'), e: r('く') + 'れ', o: r('こ') + 'よう', te: r('き') + 'て', ta: r('き') + 'た',
        pot: r('こ') + 'られ', pass: r('こ') + 'られ', caus: r('こ') + 'させ', dict: r('く') + 'る' };
    }
    if (g === '1') {
      if (!d.endsWith('る')) return null;
      const s = d.slice(0, -1);
      return { kind: '1', a: s, i: s, e: s + 'れ', o: s + 'よう', te: s + 'て', ta: s + 'た', pot: s + 'られ', pass: s + 'られ', caus: s + 'させ' };
    }
    const last = d.slice(-1);
    const row = ROWS[last];
    if (!row) return null;
    const s = d.slice(0, -1);
    let te = s + TE[last];
    let ta = te.replace(/て$/, 'た').replace(/で$/, 'だ');
    if (d === '行く' || d === 'いく') { te = s + 'って'; ta = s + 'った'; }
    let i = s + row[1];
    if (HONORIFIC_I.has(d)) i = s + 'い';
    return { kind: '5', a: s + row[0], i, e: s + row[3], o: s + row[4] + 'う', te, ta,
      pot: s + row[3], pass: s + row[0] + 'れ', caus: s + row[0] + 'せ', last };
  }

  // form keys documented in SPEC.md
  function conjVerb(dict, g, form) {
    const st = verbStems(dict, g);
    if (!st) return null;
    const isAru = (dict === 'ある');
    const dictForm = st.dict || dict;

function saveState() {

async function flushState() {

  let ok = await Store.set('state', snapshot);
  if (!ok) {

  }
  if (ok) storageOk = true;

    if (storageOk) toast('瀏覽器儲存空間已滿，進度可能沒有存到。請到「設定 → 資料」下載備份，或清掉不用的匯入字卡。', 6000);

  ['vocab', 'customGrammar', 'customExam', 'hidden', 'mistakes', 'examHistory', 'completedUnits', 'recent', 'notices', 'lessonSeen'].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  if (!DATA.UNITS.some(u => u.id === out.currentUnit)) out.currentUnit = 'm1';
  if (!out.today || out.today.date !== todayStr()) out.today = { date: todayStr(), newV: 0, newG: 0, newK: 0, newL: 0, newR: 0 };
  Object.values(out.srs).forEach(ensureFsrs);

    try { state = normalizeState(JSON.parse(raw)); await Store.set('state', state); return 'migrated'; } catch (e) { console.warn('state parse failed', e); }
  }

  let cur = '';

const KANJI_RE = /[一-鿿々〆ヶ]/;

// Each key keeps the reading from the highest-priority source; two different readings at the
// same priority (一日 = ついたち / いちにち) make the key ambiguous, and it is left without furigana.
const FURI_PRIO = new Map();
const FURI_BLOCK = new Set();
const FURI_SRC = new Map();   // furigana key → vocab item it came from (for "no readings on mastered words")
let furiPrio = 1;
let furiSrc = '';
function furiAdd(key, reading) {
  if (!key || !reading || key === reading || !KANJI_RE.test(key)) return;
  if (FURI_BLOCK.has(key)) return;
  const have = FURI.get(key);
  if (have !== undefined) {
    if (have === reading) return;
    const p = FURI_PRIO.get(key) || 0;
    if (furiPrio < p) return;
    if (furiPrio === p) { FURI.delete(key); FURI_SRC.delete(key); FURI_BLOCK.add(key); return; }
  }
  if (!/^[぀-ゟー]+$/.test(reading)) return;
  FURI_PRIO.set(key, furiPrio);
  FURI.set(key, reading);

  if (key.length > FURI_MAX) FURI_MAX = key.length;
}
// add the "kanji + first okurigana" stem of an inflected form, e.g. 書い→かい, 食べ→たべ
function furiAddStem(surface, reading) {
  if (!surface || !reading) return;
  const s = jaPlain(surface); const r = reading;
  let k = -1;
  for (let i = s.length - 1; i >= 0; i--) { if (KANJI_RE.test(s[i])) { k = i; break; } }
  if (k < 0) return;
  const oku = s.slice(k + 1);
  if (!oku) { if (s.length > 1) furiAdd(s, r); return; }
  if (!r.endsWith(oku)) return;
  const kr = r.slice(0, r.length - oku.length);

function buildFuriganaIndex() {
  FURI.clear(); FURI_MAX = 1;
  const add = (v) => {
    furiSrc = v.key || '';
    const w = jaPlain(v.w || ''); const r = v.r || '';
    if (!w || !r || !KANJI_RE.test(w) || !/^[぀-ゟー]+$/.test(r)) return;
    const g = GROUP_OF_POS[v.p];
    if (g) {
      // everyday forms first; rarer derived forms (入れる as the potential of 入る) lose any clash
      ['dict', 'masu', 'te', 'ta', 'nai', 'stem'].forEach(f => {
        const sf = JConj.conjVerb(w, g, f); const rf = JConj.conjVerb(r, g, f);
        if (sf && rf) furiAddStem(sf, jaKana(rf));
      });
      const tier = furiPrio; furiPrio = tier - 0.5;
      ['ba', 'pot', 'vol', 'pass', 'caus', 'imp'].forEach(f => {
        const sf = JConj.conjVerb(w, g, f); const rf = JConj.conjVerb(r, g, f);
        if (sf && rf) furiAddStem(sf, jaKana(rf));
      });

      furiAdd(w, r);
      if (g === 's' && w.endsWith('する')) furiAdd(w.slice(0, -2), r.slice(0, -2));
    } else if (v.p === 'i') {
      ['dict', 'kunai', 'katta', 'kute', 'ku', 'kereba', 'sou', 'sugiru'].forEach(f => {
        const sf = JConj.conjAdj(w, 'i', f); const rf = JConj.conjAdj(r, 'i', f);
        if (sf && rf) furiAddStem(sf, rf);
      });
      furiAdd(w, r);
    } else {
      furiAdd(w, r);
    }
  };
  FURI_PRIO.clear(); FURI_BLOCK.clear(); FURI_SRC.clear();
  // built-in N5 words win over N4 words when keys collide (行って = いって, not おこなって)
  furiPrio = 4; REG.vocab.filter(v => v.builtin && v.lv === 'N5').forEach(add);
  furiPrio = 3; (DATA.FURI || []).forEach(([k, r]) => furiAdd(k, r));
  furiPrio = 2; REG.vocab.filter(v => v.builtin && v.lv !== 'N5').forEach(add);
  // readings for words that appear in sentences but are not quizzed (names, 思う, 名前 …)
  furiPrio = 1.5; (DATA.FURI_EXTRA || []).forEach(([w, r, p]) => add({ w, r, p }));
  furiPrio = 1; REG.vocab.filter(v => !v.builtin && isWordLike(v)).forEach(add);

}
// a word the learner has mastered gets class "known"; its reading is hidden in the "smart" furigana mode
function knownCls(key) {
  const src = FURI_SRC.get(key);
  const r = src && state.srs[src];
  return r && srsLevelLabel(r, src) === '已熟練' ? 'known' : '';
}

// Align a reading onto a word that mixes kanji and kana: 間に合う/まにあう → [[間,ま],[に],[合,あ],[う]]
function alignReading(word, reading) {
  const segs = word.match(/[一-鿿々〆ヶ]+|[^一-鿿々〆ヶ]+/g) || [word];
  if (segs.length === 1) return KANJI_RE.test(word) ? [[word, reading]] : [[word]];
  const pattern = '^' + segs.map(sg => KANJI_RE.test(sg) ? '(.+?)' : sg.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('') + '$';

function rubyHtml(word, reading, cls) {
  const open = cls ? `<ruby class="${cls}">` : '<ruby>';
  return alignReading(word, reading).map(([w, r]) => r ? `${open}${esc(w)}<rt>${esc(r)}</rt></ruby>` : esc(w)).join('');
}

// Readings for counters written after a number (7時, 30分, 3本 …). Some change with the last digit;
// irregular ones (1人, 2人, dates) are left bare.
const COUNTER_READ = {
  '時半': 'じはん', '時間': 'じかん', '時': 'じ', '円': 'えん', '年間': 'ねんかん', '年': 'ねん', '回目': 'かいめ', '回': 'かい', '枚': 'まい', '歳': 'さい', '月': 'がつ',
  '週間': 'しゅうかん', '個': 'こ', '冊': 'さつ', '台': 'だい', '度': 'ど', '番線': 'ばんせん', '番目': 'ばんめ', '番': 'ばん', '号': 'ごう', '倍': 'ばい', '万': 'まん', '点': 'てん',
  '分間': (d) => (/[134680]$/.test(d) ? 'ぷんかん' : 'ふんかん'),
  '分': (d) => (/[134680]$/.test(d) ? 'ぷん' : 'ふん'),
  '本': (d) => (/[1680]$/.test(d) ? 'ぽん' : /3$/.test(d) ? 'ぼん' : 'ほん'),
  '杯': (d) => (/[1680]$/.test(d) ? 'ぱい' : /3$/.test(d) ? 'ばい' : 'はい'),
  '匹': (d) => (/[1680]$/.test(d) ? 'ぴき' : /3$/.test(d) ? 'びき' : 'ひき'),
  '階': (d) => (/(^|[^0-9])3$/.test(d) ? 'がい' : 'かい'),
  '人': (d) => (/^[12]$/.test(d) ? null : 'にん'),
  '千': (d) => (/^3$/.test(d) ? 'ぜん' : 'せん'),
  '百': (d) => (/^3$/.test(d) ? 'びゃく' : /^[68]$/.test(d) ? 'ぴゃく' : 'ひゃく')

const COUNTER_KEYS = Object.keys(COUNTER_READ).sort((a, b) => b.length - a.length);
function counterRuby(s, i, j) {
  // digits right before position i (ASCII or full-width, commas allowed)
  let k = i; while (k > 0 && /[0-9０-９,，]/.test(s[k - 1])) k--;
  const digits = s.slice(k, i).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[,，]/g, '');
  const run = s.slice(i, j);

  const rule = COUNTER_READ[key];
  const r = typeof rule === 'function' ? rule(digits) : rule;
  return { len: key.length, html: r ? rubyHtml(key, r) : esc(key) };
}

// Japanese text → HTML with furigana. Only whole kanji runs found in the dictionary get readings,
// so an unknown compound stays bare instead of getting a wrong reading.
function furi(text, opt = {}) {
  const s = String(text == null ? '' : text);
  let out = '';
  let i = 0;
  const bracket = /^([一-鿿々〆ヶ]+)\[([ぁ-ゖー]+)\]/;
  const isK = (c) => c !== undefined && KANJI_RE.test(c);
  while (i < s.length) {
    const ch = s[i];
    if (isK(ch)) {
      const bm = bracket.exec(s.slice(i));
      if (bm) { out += opt.plain ? esc(bm[1]) : rubyHtml(bm[1], bm[2]); i += bm[0].length; continue; }
      let j = i; while (j < s.length && isK(s[j])) j++;
      const run = s.slice(i, j);
      if (opt.plain) { out += esc(run); i = j; continue; }
      if (i > 0 && /[0-9０-９]/.test(s[i - 1])) {
        const cr = counterRuby(s, i, j);
        if (cr) { out += cr.html; i += cr.len; continue; }
      }
      let done = false;
      for (let L = Math.min(FURI_MAX, s.length - i); L >= j - i; L--) {
        const k = s.substr(i, L);
        const r = FURI.get(k);
        if (!r) continue;
        // a key ending in kanji must end exactly where the kanji run ends
        if (isK(k[k.length - 1]) && isK(s[i + L])) continue;
        out += rubyHtml(k, r, knownCls(k)); i += L; done = true; break;
      }
      if (!done) {
        const seg = segmentRun(run, s.slice(j, j + FURI_MAX));
        if (seg) { out += seg.segs.map(([k, r]) => rubyHtml(k, r, knownCls(k))).join(''); i = j + seg.extra; }
        else { out += esc(run); i = j; }
      }
      continue;
    }

      const close = s.indexOf(']', i);
      if (close > i && /^[ぁ-ゖー]+$/.test(s.slice(i + 1, close))) { i = close + 1; continue; }
    }
    // kana-initial keys such as お茶 / ご飯
    if (!opt.plain && isK(s[i + 1])) {
      let done = false;
      for (let L = Math.min(FURI_MAX, s.length - i); L >= 2; L--) {
        const k = s.substr(i, L);
        const r = FURI.get(k);
        if (!r) continue;
        if (isK(k[k.length - 1]) && isK(s[i + L])) continue;
        let j = i + 1; while (j < s.length && isK(s[j])) j++;
        if (i + L < j) continue;

}

// Split a kanji run into known words (日本語学校 → 日本語 + 学校). Inner pieces need two or more kanji;
// only the last piece may be a single kanji, and then only together with its okurigana
// (一番好き → 一番 + 好き), so a compound like 夜中 is never read as 夜 + 中.
function segmentRun(run, after) {
  const n = run.length;
  if (n < 3) return null;
  const best = new Array(n + 1).fill(null);
  best[0] = [];
  for (let a = 0; a < n; a++) {
    if (!best[a]) continue;
    for (let b = a + 2; b <= n; b++) {
      const k = run.slice(a, b);
      const r = FURI.get(k);
      if (!r) continue;
      const cand = best[a].concat([[k, r]]);
      if (!best[b] || cand.length < best[b].length) best[b] = cand;
    }
  }
  if (best[n]) return { segs: best[n], extra: 0 };
  const tail = String(after || '').match(/^[ぁ-ゖ]*/)[0];
  for (let a = n - 1; a >= 2; a--) {
    if (!best[a]) continue;
    for (let L = Math.min(FURI_MAX, n - a + tail.length); L > n - a; L--) {
      const k = run.slice(a) + tail.slice(0, L - (n - a));
      const r = FURI.get(k);
      if (r) return { segs: best[a].concat([[k, r]]), extra: L - (n - a) };
    }
  }
  return null;
}

function bracketRuby(s) {

// Prompts keep the blank as typed (legacy ones pad it: （早い → 　　　）); show a short, even blank instead

  const m = /^(.*?)（([ぁ-ゖー]+)）$/.exec(String(s || ''));
  if (!m || !KANJI_RE.test(m[1])) return s;
  const parts = alignReading(m[1], m[2]);
  if (parts.length === 1 && parts[0].length === 2 && m[1] === parts[0][0]) return `${m[1]}[${m[2]}]`;
  return parts.map(([w, r]) => (r ? `${w}[${r}]` : w)).join('');
}

// ---------- markdown (explanations, AI answers) ----------
function mdInline(line) {
  let s = esc(line);
  s = s.replace(/([一-鿿々〆ヶ]+)\[([ぁ-ゖー]+)\]/g, (m, k, r) => rubyHtml(k, r));   // 来[こ]られる
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__(.+?)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<strong>$2</strong>');
  return s;
}
function md(raw) {
  if (!raw) return '';
  const lines = String(raw).replace(/\r\n/g, '\n').trim().split('\n');
  let html = ''; let ul = false; let ol = false; let code = null; let table = [];
  const closeLists = () => { if (ul) { html += '</ul>'; ul = false; } if (ol) { html += '</ol>'; ol = false; } };
  const flushTable = () => {
    if (!table.length) return;
    html += '<table>' + table.map((r, i) => '<tr>' + r.map(c => `<${i ? 'td' : 'th'}>${mdInline(c.trim())}</${i ? 'td' : 'th'}>`).join('') + '</tr>').join('') + '</table>';
    table = [];
  };
  for (const raw of lines) {
    const t = raw.trim();
    if (t.startsWith('```')) { closeLists(); flushTable(); if (code === null) code = []; else { html += `<pre><code>${esc(code.join('\n'))}</code></pre>`; code = null; } continue; }
    if (code !== null) { code.push(raw); continue; }
    if (t.startsWith('|') && t.endsWith('|') && t.length > 2) { closeLists(); if (!/^\|[\s\-:|]+\|$/.test(t)) table.push(t.slice(1, -1).split('|')); continue; }
    flushTable();
    if (!t) { closeLists(); continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { closeLists(); html += '<hr/>'; continue; }
    const h = /^(#{1,4})\s+(.+)$/.exec(t);
    if (h) { closeLists(); html += `<h4>${mdInline(h[2])}</h4>`; continue; }
    if (t.startsWith('>')) { closeLists(); html += `<blockquote>${mdInline(t.replace(/^>+\s*/, ''))}</blockquote>`; continue; }
    const li = /^[-*•]\s+(.+)$/.exec(t);
    if (li) { if (ol) { html += '</ol>'; ol = false; } if (!ul) { html += '<ul>'; ul = true; } html += `<li>${mdInline(li[1])}</li>`; continue; }
    const oli = /^\d+[.)]\s+(.+)$/.exec(t);
    if (oli) { if (ul) { html += '</ul>'; ul = false; } if (!ol) { html += '<ol>'; ol = true; } html += `<li>${mdInline(oli[1])}</li>`; continue; }
    closeLists();
    html += `<p>${mdInline(t)}</p>`;
  }
  if (code !== null) html += `<pre><code>${esc(code.join('\n'))}</code></pre>`;
  closeLists(); flushTable();
  return `<div class="md">${html}</div>`;
}

    q.mistakePrompt = `${pre}（${base}→　）${post}`;
    if (!q.why) q.why = `「${base}」→「${jaPlain(ans)}」`;
    finalizeOptions(q, ans, chosen, true);
    q.wide = q.options.some(o => jaPlain(o.text).length > 9);
    return q;
  }
  return null;
}

function makeQuestion(item, ctx) {
  try {
    if (item.kind === 'l') return makeListenQuestion(item, ctx);
    if (item.kind === 'r') return makeReadQuestion(item, ctx);
    if (item.kind === 'k') return makeKanjiQuestion(item, ctx);
    return item.kind === 'v' ? makeVocabQuestion(item, ctx) : makeGrammarQuestion(item, ctx);
  } catch (e) {
    console.warn('question build failed', item && item.key, e);
    return null;
  }

// A mistake that is not linked to any current item (e.g. from the old version)
function makeMistakeCard(m) {
  const q = { id: uid('q'), key: m.key || '', mistakeId: m.id, kind: 'm', fmt: 'm-card', cat: m.cat, label: `錯題本 · ${m.cat || '綜合'}`, instr: '選出正確答案', options: [], answer: 0, why: m.why || '', point: '', stemHtml: '', zhText: '' };
  const b = splitBlank(m.prompt);
  q.stemHtml = b ? `${furi(b.pre)}${blankChip(b.hint)}${furi(b.post)}` : furi(m.prompt);
  if (b) { q.fillHtml = furi(m.answer); q.fullJp = b.pre + m.answer + b.post; }
  q.mistakePrompt = m.prompt;
  const others = new Set();
  if (m.wrong && m.wrong !== m.answer && !/^(未作答|手動|SRS|自訂)/.test(m.wrong)) others.add(m.wrong);
  shuffle(state.mistakes.filter(x => x.id !== m.id && x.cat === m.cat && x.answer && x.answer !== m.answer)).forEach(x => { if (others.size < 3) others.add(x.answer); });
  const filler = /^[ぁ-ん]{1,2}$/.test(m.answer) ? ['に', 'で', 'を', 'が', 'へ', 'と', 'は', 'から'] : shuffle(state.mistakes.map(x => x.answer).filter(a => a && a !== m.answer));
  filler.forEach(f => { if (others.size < 3 && f !== m.answer) others.add(f); });
  if (others.size < 3) return null;
  finalizeOptions(q, m.answer, [...others].slice(0, 3), /[ぁ-んァ-ン一-龯]/.test(m.answer));
  q.wide = q.options.some(o => o.text.length > 10);
  return q;
}

// Playback progress of a listening script: line n of N, the bar advancing by the clip's real time (external engines) or

const SPEECH_PROG = { token: -1, total: 0, idx: 0, start: 0, est: 0, real: null, done: false, timer: null };

// To a reader of Chinese most kanji mean what they look like (四, 木 = 樹、木頭), so practice leans on
// readings; the meaning question is kept for kanji whose meaning does not contain the kanji itself.
const kunText = (k) => (k.kun || []).map(r => r.replace(/\((.+)\)/, '（$1）')).join('・');
const kataToHira = (s) => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));

function kanjiReadingsHtml(k) {
  const parts = [];
  if ((k.on || []).length) parts.push(`<span class="chip">音 <span class="jp">${esc(k.on.join('・'))}</span></span>`);
  if ((k.kun || []).length) parts.push(`<span class="chip">訓 <span class="jp">${esc(kunText(k))}</span></span>`);
  return parts.join(' ');
}
// the readings as the question itself, larger than the chips
function kanjiReadingsLine(k) {
  // on a phone a long list breaks only between readings
  const part = (label, rs) => `<span style="display:inline-block;max-width:100%"><span class="small muted">${label}</span> <span class="jp">${rs.map(r => `<span class="nowrap">${esc(r)}</span>`).join('・<wbr>')}</span></span>`;
  const kun = (k.kun || []).map(r => r.replace(/\((.+)\)/, '（$1）'));
  return `<div style="line-height:1.7">${[(k.on || []).length ? part('音', k.on) : '', kun.length ? part('訓', kun) : ''].filter(Boolean).join('　　')}</div>`;
}
function kanjiWhy(k, withReadings = true) {
  const lines = k.m === k.k ? [] : [`**${k.k}**：${k.m}`];
  if (withReadings && (k.on || []).length) lines.push(`- 音讀：${k.on.join('・')}`);
  if (withReadings && (k.kun || []).length) lines.push(`- 訓讀：${kunText(k)}`);
  const ex = (k.ex || []).map(([w, r, m]) => `${w}（${r}）${m}`).join('；');
  if (ex) lines.push(`- 例：${ex}`);
  return lines.join('\n');
}
function kanjiPeers(k) { return REG.kanji.filter(x => x.key !== k.key); }

function makeKanjiQuestion(k, ctx = {}) {
  const rec = srsGet(k.key);
  const b = rec ? rec.b : -1;
  const meaningOk = !meaningShowsKanji(k);
  const pairs = b < 0 ? [[meaningOk ? 'k-meaning' : 'k-read', 1]]
    : [['k-read', 3], ['k-shape', 2]].concat(meaningOk ? [['k-meaning', b <= 2 ? 2 : 1]] : []);
  // a first look that cannot be a reading question falls back to the meaning card, which shows the readings
  const order = meaningOk || b < 0 ? ['k-meaning', 'k-read', 'k-shape'] : ['k-read', 'k-shape', 'k-meaning'];
  const q = baseQ(k);
  q.cat = '漢字'; q.lv = k.lv; q.point = '漢字';
  q.mistakePrompt = `漢字「${k.k}」`;
  q.mistakeWhy = kanjiWhy(k);
  const first = (k.ex || [])[0];
  q.speakWord = first ? first[1] : '';
  const build = (f) => {
    if (f === 'k-meaning') {
      const pool = shuffle(kanjiPeers(k)).sort((a, c) => (c.lv === k.lv) - (a.lv === k.lv));
      const opts = [];
      for (const x of pool) {
        if (!x.m || x.m === k.m || zhOverlap(x.m, k.m) || opts.some(o => o === x.m || zhOverlap(o, x.m))) continue;
        opts.push(x.m);
        if (opts.length === 3) break;
      }
      if (opts.length < 3) return false;
      q.fmt = f; q.label = `漢字 · ${k.lv} · 意思`;
      q.instr = '這個漢字的意思是？';
      q.stemHtml = `<span class="kanji-big">${esc(k.k)}</span>`; q.stemClass = 'word';
      q.subHtml = kanjiReadingsHtml(k);
      finalizeOptions(q, k.m, opts, false);
      q.answerText = k.m;
      return true;
    }
    if (f === 'k-shape') {
      // which kanji is read like this: the decoys share none of its readings, look-alikes first
      const mine = kanjiReadSet(k);
      const cands = [];
      const push = (x) => { if (x && x.key !== k.key && !cands.includes(x.k) && ![...kanjiReadSet(x)].some(r => mine.has(r))) cands.push(x.k); };
      shuffle([...new Set((k.look || []).concat(LOOKALIKE_OF[k.k] || []))]).forEach(c => { if (cands.length < 2) push(REG.byKey.get('k:' + c)); });
      const peers = shuffle(kanjiPeers(k).filter(x => x.lv === k.lv));
      peers.filter(x => state.srs[x.key]).concat(peers).forEach(x => { if (cands.length < 3) push(x); });
      if (cands.length < 3) return false;
      q.fmt = f; q.label = `漢字 · ${k.lv} · 選字`;
      q.instr = '哪一個漢字是這樣讀的？';
      q.stemHtml = kanjiReadingsLine(k);
      q.stemClass = 'zhstem center';
      finalizeOptions(q, k.k, cands, true);
      q.noFuriOptions = true;
      q.answerText = k.k;
      return true;
    }
    // k-read: how an example word is read; new or just-forgotten kanji show their readings as a hint
    const exs = shuffle((k.ex || []).filter(([w, r]) => w && r && r.length >= 2 && w !== r));
    for (const [w, r, m] of exs) {
      const vars = readingOptions(r);
      if (!vars) continue;
      q.fmt = 'k-read'; q.label = `漢字 · ${k.lv} · 讀音`;
      q.instr = `「${k.k}」的例詞怎麼讀？`;
      q.stemHtml = `<span class="uline">${esc(w)}</span>`; q.stemClass = 'word';
      q.noFuri = true;
      q.subHtml = `<span class="small muted">${esc(m || '')}</span>${b <= 0 ? `<div class="row-wrap mt-2" style="justify-content:center">${kanjiReadingsHtml(k)}</div>` : ''}`;
      q.speakWord = r;
      finalizeOptions(q, r, vars, true);
      q.answerText = r;
      return true;
    }
    return false;
  };
  const fmt = weightedPick(pairs, ctx.avoidFmt);
  if (!build(fmt) && !order.some(f => f !== fmt && build(f))) return null;
  // readings already on screen are left out of the explanation
  q.why = kanjiWhy(k, q.fmt === 'k-read' && b > 0);
  return q;
}

// ---- 60_session.js ----
/* ==========================================================================
   Practice sessions: queue building (daily / unit / vocab / mistakes) and the runner
   ========================================================================== */
let SESSION = null;

function byDue(a, b) {
  const ra = state.srs[a.key]; const rb = state.srs[b.key];
  return (ra.due < rb.due ? -1 : ra.due > rb.due ? 1 : 0) || (ra.b - rb.b);
}
// What the daily mix may contain: grammar from the current unit and the units before it, and N4 words
// only after every N5 word has been introduced once. Items further ahead keep their records and come
// back when the learner gets there.
// N4 words join the new-word pool once every N5 word has been seen, or earlier when the learner opens them (設定／我已有基礎)
function n4WordsOpen() { return state.settings.n4Words === 'open' || n5WordsLeft() === 0; }
function n5WordsLeft() {
  let n = 0;
  for (const v of REG.vocab) if (v.builtin && v.lv === 'N5' && !state.srs[v.key]) n++;
  return n;
}
function grammarInReach(g, curIdx = unitOrder(state.currentUnit)) { return unitOrder(g.u) <= curIdx; }
function inDailyReach(it, n4Open = n4WordsOpen()) {
  if (it.kind === 'g') return grammarInReach(it);
  return !it.builtin || it.lv !== 'N4' || n4Open;
}
function vocabEligibleForDaily(v, n4Open) {
  if (v.builtin) return v.lv !== 'N4' || n4Open;
  const mode = state.settings.includeImported;
  if (mode === 'off') return false;
  if (mode === 'words') return isWordLike(v);
  return true;
}
// New words are introduced theme by theme, two themes at a time (interleaved, so a day's new words come in two
// related groups rather than one long list of look-alikes). The pair is the first two themes, in THEME_ORDER,
// that still have unintroduced words of the lowest open level (N5 first; N4 only once allowed).
function themeRank(c) { const i = THEME_ORDER.indexOf(c); return i < 0 ? THEME_ORDER.length : i; }
function activeThemes(pool, allowN4) {
  const fresh = pool.filter(v => v.builtin && !state.srs[v.key] && (v.lv === 'N5' || allowN4));
  const lv = fresh.some(v => v.lv === 'N5') ? 'N5' : 'N4';
  const themes = [...new Set(fresh.filter(v => v.lv === lv).map(vocabTheme))].sort((a, b) => themeRank(a) - themeRank(b) || a.localeCompare(b, 'zh-Hant'));
  return themes.slice(0, 2);
}
function newVocabCandidates(pool, allowN4) {
  const th = activeThemes(pool, allowN4);
  const fresh = pool.filter(v => v.builtin && !state.srs[v.key] && (v.lv === 'N5' || allowN4));
  const lv = fresh.some(v => v.lv === 'N5') ? 'N5' : 'N4';
  const inLane = (v) => v.lv === lv && th.includes(vocabTheme(v));
  const byId = (a, b) => a.id.localeCompare(b.id);
  const lanes = th.map(c => fresh.filter(v => inLane(v) && vocabTheme(v) === c).sort(byId));
  const rest = fresh.filter(v => !inLane(v))
    .sort((a, b) => (a.lv === 'N4') - (b.lv === 'N4') || themeRank(vocabTheme(a)) - themeRank(vocabTheme(b)) || byId(a, b));
  const built = [];
  for (let i = 0; lanes.some(l => i < l.length); i++) lanes.forEach(l => { if (i < l.length) built.push(l[i]); });
  built.push(...rest);
  const custom = pool.filter(v => !v.builtin && !state.srs[v.key]);
  const out = [];
  let i = 0; let j = 0;
  while (i < built.length || j < custom.length) {
    if (j < custom.length && (out.length % 2 === 1 || i >= built.length)) out.push(custom[j++]);
    else if (i < built.length) out.push(built[i++]);
  }
  return out;
}
function roundRobinByType(items) { return roundRobinBy(items, it => it.t || 'choice'); }
// one item from each group in turn, so consecutive items differ in `keyOf` (grammar point, question type …)
function roundRobinBy(items, keyOf) {
  const groups = {};
  items.forEach(it => { const k = keyOf(it); (groups[k] = groups[k] || []).push(it); });
  const keys = Object.keys(groups);
  const out = [];
  let added = true;
  while (added) {
    added = false;
    keys.forEach(k => { if (groups[k].length) { out.push(groups[k].shift()); added = true; } });
  }
  return out;
}
function newGrammarCandidates(unitIdOnly) {
  const cur = unitIdOnly || state.currentUnit;
  const inUnit = REG.grammar.filter(g => g.u === cur && !state.srs[g.key]);
  const sorted = [];
  [1, 2, 3].forEach(d => { sorted.push(...roundRobinBy(roundRobinByType(shuffle(inUnit.filter(g => (g.d || 2) === d))), g => g.pt || '')); });
  if (unitIdOnly) return sorted;
  // fill gaps from earlier, unfinished units
  const curIdx = unitOrder(cur);
  const earlier = REG.grammar.filter(g => unitOrder(g.u) < curIdx && !state.completedUnits.includes(g.u) && !state.srs[g.key])
    .sort((a, b) => unitOrder(a.u) - unitOrder(b.u) || (a.d || 2) - (b.d || 2));
  return sorted.concat(earlier);
}
// Weak items that are not due yet, used to fill spare slots: low level, not answered in the last two days, and not on a
// correct streak of two. A first correct answer leaves an item at level 2 for about four days; without the quiet gap
// and the streak rule it came back as filler every day until its real review (the second look is the scheduled one).
function quietDays(r, t) { return r.last ? daysBetween(r.last, t) : 999; }
function reinforcementItems(pool, exclude) {
  const t = todayStr();
  return pool.filter(it => { const r = state.srs[it.key]; return r && r.due > t && r.b <= 2 && !exclude.has(it.key) && quietDays(r, t) >= 2 && (r.st || 0) < 2; })
    .sort((a, b) => ((state.srs[a.key].ok || 0) - (state.srs[b.key].ok || 0)) || state.srs[a.key].due.localeCompare(state.srs[b.key].due) || state.srs[a.key].b - state.srs[b.key].b);
}
// Reviews due within the next `days` days, pulled forward when today's work is done (not answered today)
function aheadItems(pool, exclude, days = 2) {
  const t = todayStr(); const until = addDays(t, days);
  return pool.filter(it => { const r = state.srs[it.key]; return r && r.due > t && r.due <= until && !exclude.has(it.key) && r.last !== t; }).sort(byDue);
}
function adaptiveFactor() {
  const acc = recentAccuracy();
  if (acc === null) return { factor: 1, note: '' };
  if (acc < 0.6) return { factor: 0.5, note: `最近的正確率是 ${Math.round(acc * 100)}%，今天先少加一些新內容，把學過的穩住。`, acc };
  if (acc < 0.75) return { factor: 0.75, note: '', acc };
  if (acc > 0.92) return { factor: 1.25, note: '', acc };
  return { factor: 1, note: '', acc };
}

// Listening, reading and kanji share the session with words and grammar. Listening and reading follow the
// unit rule; N4 kanji wait until every N5 kanji has been introduced, like the words.
function n5KanjiLeft() { let n = 0; for (const k of REG.kanji) if (k.lv === 'N5' && !state.srs[k.key]) n++; return n; }
function newKanjiCandidates(allowN4) {

// Listening is not tied to a unit's grammar: the pool is the whole level (N5 learners: N5; N4 learners: everything),

  return REG.listen.filter(x => n4 || x.lv === 'N5').sort((a, b) => key(a) - key(b));

function extrasPlan(curIdx) {
  const t = todayStr();
  const s = state.settings;
  const reach = (x) => unitOrder(x.u) <= curIdx;
  const isDue = (x) => { const r = state.srs[x.key]; return r && r.due <= t; };
  const byUnit = (a, b) => unitOrder(a.u) - unitOrder(b.u) || (hashStr(a.id) % 997) - (hashStr(b.id) % 997);
  const listenOn = s.listening && s.listenPerDay > 0 && speechAvailable();
  const lPool = listenOn ? listenReachable(curIdx) : [];
  const dueL = lPool.filter(isDue).sort(byDue);
  const newL = lPool.filter(x => !state.srs[x.key]).slice(0, Math.max(0, s.listenPerDay - (state.today.newL || 0)));
  const dueR = REG.read.filter(x => reach(x) && isDue(x)).sort(byDue);
  const newR = (state.today.newR || 0) < 1 ? REG.read.filter(x => reach(x) && !state.srs[x.key]).sort(byUnit).slice(0, 1) : [];

// Summary of what today's session would contain (used by the Today page).
// New material is sized to fit around the reviews that are due, so the daily load stays near the
// daily goal; a small minimum keeps the course moving even when many reviews are waiting.
const MIN_NEW_PER_DAY = 6;
function dailyPlan(size = state.settings.sessionSize) {
  const t = todayStr();
  const s = state.settings;
  const ad = adaptiveFactor();
  const n4Open = n4WordsOpen();
  const curIdx = unitOrder(state.currentUnit);
  const vPool = REG.vocab.filter(v => vocabEligibleForDaily(v, n4Open));
  const dueV = vPool.filter(v => { const r = state.srs[v.key]; return r && r.due <= t; }).sort(byDue);
  const dueG = REG.grammar.filter(g => { const r = state.srs[g.key]; return r && r.due <= t && grammarInReach(g, curIdx); }).sort(byDue);
  const maxV = Math.round(s.newVocabPerDay * ad.factor);
  const maxG = Math.round(s.newGrammarPerDay * ad.factor);
  const ex = extrasPlan(curIdx);
  const room = s.dailyGoal - dayTotal(state.dailyLogs[t]) - dueV.length - dueG.length - ex.dueK.length - Math.min(ex.dueL.length, s.listenPerDay || 0);
  // Grammar drives the course: its new items come every day regardless of the review load (the accuracy-based
  // factor still applies). Only new words give way to a review backlog, and never below about half their quota.
  const wantG = Math.max(0, maxG - state.today.newG);
  const roomV = room - wantG + state.today.newV;
  const wantV = Math.max(0, clamp(roomV, Math.min(Math.ceil(maxV / 2), maxV), maxV) - state.today.newV);
  let note = ad.note;
  if (!note && wantV < Math.max(0, maxV - state.today.newV) && dueV.length + dueG.length > 0) {
    note = `今天待複習的題目比較多，新單字先減為 ${wantV} 個，新文法照常；複習完成後，之後幾天就會再增加。`;
  }
  const newG = newGrammarCandidates().slice(0, wantG);
  const newV = newVocabCandidates(vPool, n4Open).slice(0, wantV + Math.max(0, wantG - newG.length));
  return Object.assign({ dueV, dueG, newV, newG, note, factor: ad.factor, size, n4Open }, ex);
}

function interleave(vList, gList, mode) {
  if (mode === 'split') return vList.concat(gList);
  const out = [];
  let i = 0; let j = 0;
  const ratio = vList.length / Math.max(1, vList.length + gList.length);
  while (i < vList.length || j < gList.length) {
    const wantV = j >= gList.length || (i < vList.length && (i / Math.max(1, i + j)) <= ratio);
    out.push(wantV ? vList[i++] : gList[j++]);
  }
  return out;
}

// The words of one session stay within one to three themes: the themes today's new words come from, then the
// theme(s) holding the most due reviews. Reviews from other themes are used only when those run out.
function focusThemes(plan) {
  const out = plan.newV.length ? activeThemes(REG.vocab, plan.n4Open) : [];
  const count = {};
  plan.dueV.forEach(v => { if (v.builtin) { const c = vocabTheme(v); if (!out.includes(c)) count[c] = (count[c] || 0) + 1; } });
  Object.entries(count).sort((a, b) => b[1] - a[1] || themeRank(a[0]) - themeRank(b[0])).forEach(([c]) => { if (out.length < 3) out.push(c); });

}
function buildDailyQueue(fullSize = state.settings.sessionSize) {
  const plan = dailyPlan(fullSize);

  const inFocus = (v) => !v.builtin || focus.includes(vocabTheme(v));
  const dueV = plan.dueV.slice().sort((a, b) => inFocus(b) - inFocus(a) || byDue(a, b));
  const lCap = Math.min(state.settings.listenPerDay || 0, Math.round(fullSize * 0.2));
  const L = plan.dueL.slice(0, lCap);
  L.push(...plan.newL.slice(0, Math.max(0, lCap - L.length)));
  const R = plan.dueR.length ? plan.dueR.slice(0, 1) : plan.newR.slice(0, 1);
  const kCap = Math.max(2, Math.round(fullSize * 0.15));
  const kNew = Math.min(plan.newK.length, Math.max(1, Math.round(kCap / 3)));
  const K = plan.dueK.slice(0, kCap - kNew).concat(plan.newK.slice(0, kNew));
  const size = Math.max(6, fullSize - L.length - R.length - K.length);
  const vSlots = Math.round(size * state.settings.vocabShare / 100);
  const gSlots = size - vSlots;
  // grammar: new items first, then the reviews answered correctly the fewest times (so the items of a unit level
  // out instead of the same well-known ones coming back while unseen ones wait)
  const byPractice = (a, b) => ((state.srs[a.key].ok || 0) - (state.srs[b.key].ok || 0)) || byDue(a, b);
  const dueG = plan.dueG.slice().sort(byPractice);
  // keep about a quarter of each track for new material so a review backlog cannot crowd it out
  const take = (due, fresh, slots) => {
    const keepNew = Math.min(fresh.length, Math.round(slots * 0.25));
    const reviews = due.slice(0, slots - keepNew);
    const news = fresh.slice(0, Math.max(0, slots - reviews.length));
    return { reviews, news };
  };
  let v = take(dueV, plan.newV, vSlots);
  const gNews = plan.newG.slice(0, gSlots);
  let g = { news: gNews, reviews: dueG.slice(0, gSlots - gNews.length) };
  // hand unused slots to the other track
  let spare = size - (v.reviews.length + v.news.length + g.reviews.length + g.news.length);
  if (spare > 0) {
    const moreG = dueG.slice(g.reviews.length, g.reviews.length + spare); g.reviews = g.reviews.concat(moreG); spare -= moreG.length;
    const moreV = dueV.slice(v.reviews.length, v.reviews.length + spare); v.reviews = v.reviews.concat(moreV); spare -= moreV.length;
    const moreGN = plan.newG.slice(g.news.length, g.news.length + spare); g.news = g.news.concat(moreGN); spare -= moreGN.length;
    const moreVN = plan.newV.slice(v.news.length, v.news.length + spare); v.news = v.news.concat(moreVN); spare -= moreVN.length;
  }
  const used = new Set([...v.reviews, ...v.news, ...g.reviews, ...g.news].map(x => x.key));
  // a few notebook items ride along on top of the plan (setting 每天夾帶的錯題)
  const mist = dailyMistakeItems(used, clamp(Number(state.settings.mistakesPerDay) || 0, 0, 10));
  mist.forEach(x => { used.add(x.key); (x.kind === 'g' ? g.reviews : v.reviews).push(x); });
  const extra = { newN: 0, aheadN: 0 };
  if (spare > 0) {
    const curIdx = unitOrder(state.currentUnit);
    const vPool = REG.vocab.filter(x => vocabEligibleForDaily(x, plan.n4Open)); const gPool = REG.grammar.filter(x => grammarInReach(x, curIdx));
    const add = (list, bucket) => { list.forEach(x => { used.add(x.key); (x.kind === 'v' ? v : g)[bucket].push(x); }); spare -= list.length; return list.length; };
    // 1. weak items from earlier days
    add(reinforcementItems(vPool.concat(gPool), used).slice(0, spare), 'reviews');
    // Only once today's new-item quotas are used up (an extra session): 2. new material beyond the quota (at most half the
    // session; a track whose quota is 0 stays closed), 3. reviews due in the next two days, 4. more new material
    const quotaDone = plan.newV.length === 0 && plan.newG.length === 0;
    const moreNew = (cap) => { const gs = state.settings.newGrammarPerDay > 0 ? newGrammarCandidates().filter(x => !used.has(x.key)).slice(0, Math.ceil(cap / 2)) : []; const vs = state.settings.newVocabPerDay > 0 ? newVocabCandidates(vPool, plan.n4Open).filter(x => !used.has(x.key)).slice(0, cap - gs.length) : []; return gs.concat(vs).slice(0, cap); };
    if (quotaDone && spare > 0) extra.newN += add(moreNew(Math.min(spare, Math.ceil(size / 2))), 'news');
    if (quotaDone && spare > 0) extra.aheadN += add(aheadItems(vPool.concat(gPool), used).slice(0, spare), 'reviews');

  L.forEach((x, i) => items.splice(Math.min(items.length, Math.round((i + 1) * items.length / (L.length + 1)) + i), 0, x));
  items.push(...R);
  const isNew = (x) => !state.srs[x.key];
  return { items, plan, focus, extra, mistakeKeys: mist.map(x => x.key), newCount: items.filter(isNew).length, reviewCount: items.filter(x => !isNew(x)).length };
}

// what an extra session holds once the day's plan is done (shown on the Today page and at the start of practice)
function extraNote(q) {
  const x = q && q.extra; if (!x || !(x.newN || x.aheadN)) return '';
  const parts = []; if (x.newN) parts.push(`${x.newN} 題額外的新內容`); if (x.aheadN) parts.push(`${x.aheadN} 題提前複習（明後天到期）`);
  return `今天的進度已完成，這組是 ${parts.join('與')}；今天答對過的題目不再重複出現。`;

// The Today page and 「開始練習」 share one built queue, so the button says exactly how many questions the session
// holds (the plan numbers above it describe the whole day's workload, which can be more than one session).
let DAILY_CACHE = null;
function dailyQueue(size = state.settings.sessionSize) {
  const key = `${todayStr()}|${state.updatedAt}|${size}|${state.currentUnit}|${speechAvailable() ? 1 : 0}`;
  if (DAILY_CACHE && DAILY_CACHE.key === key) return DAILY_CACHE.r;
  const r = buildDailyQueue(size);
  r.items = r.items.filter(it => makeQuestion(it, {}));   // an item that cannot become a question would be dropped silently later
  const isNew = (x) => !state.srs[x.key];
  r.newCount = r.items.filter(isNew).length; r.reviewCount = r.items.length - r.newCount;
  r.mistakeN = (r.mistakeKeys || []).filter(k => r.items.some(x => x.key === k)).length;
  DAILY_CACHE = { key, r };
  return r;
}

function buildUnitQueue(unitId, size = 15) {
  const t = todayStr();
  const items = unitItems(unitId);
  const due = items.filter(g => { const r = state.srs[g.key]; return r && r.due <= t; }).sort(byDue);
  const fresh = newGrammarCandidates(unitId);
  const rest = items.filter(g => state.srs[g.key] && state.srs[g.key].due > t && quietDays(state.srs[g.key], t) >= 2).sort((a, b) => (state.srs[a.key].st || 0) - (state.srs[b.key].st || 0) || state.srs[a.key].b - state.srs[b.key].b || Math.random() - 0.5);   // nothing answered in the last two days; shakiest first
  const list = due.slice(0, size);
  list.push(...fresh.slice(0, Math.max(0, Math.min(size - list.length, 10))));
  list.push(...rest.slice(0, Math.max(0, size - list.length)));
  return shuffle(list.slice(0, due.length)).concat(list.slice(due.length));
}
function buildVocabQueue(filter = 'all', size = 20) {
  const t = todayStr();
  // choosing the N4 list or a theme on purpose opens N4 words right away
  const theme = filter.startsWith('c:') ? filter.slice(2) : null;
  const n4Open = Boolean(theme) || filter === 'N4' || n4WordsOpen();
  const pool = REG.vocab.filter(v => theme ? (v.builtin && vocabTheme(v) === theme) : filter === 'all' ? vocabEligibleForDaily(v, n4Open) : filter === 'custom' ? !v.builtin : (v.builtin && v.lv === filter));
  const due = pool.filter(v => { const r = state.srs[v.key]; return r && r.due <= t; }).sort(byDue);
  const left = Math.max(0, state.settings.newVocabPerDay - state.today.newV);
  const fresh = newVocabCandidates(pool, n4Open).slice(0, Math.max(left, Math.min(5, size - due.length)));
  const weak = reinforcementItems(pool, new Set(due.map(x => x.key)));
  const list = due.slice(0, size);
  list.push(...fresh.slice(0, Math.max(0, size - list.length)));
  list.push(...weak.slice(0, Math.max(0, size - list.length)));
  list.push(...aheadItems(pool, new Set(list.map(x => x.key))).slice(0, Math.max(0, size - list.length)));   // then reviews due in the next two days

function buildMistakeQueue(size = 20) {
  const list = [];
  activeMistakes().slice(0, size * 2).forEach(m => {
    const it = m.key && REG.byKey.get(m.key);
    if (it) { if (!list.some(x => x.item && x.item.key === it.key)) list.push({ item: it }); }
    else list.push({ mistake: m });

// ---------- session lifecycle ----------
const MODE_TITLE = { daily: '今日練習', unit: '單元練習', vocab: '單字練習', mistakes: '錯題練習', ai: 'AI 題目', kanji: '漢字練習', items: '練習' };
function startSession(mode, opt = {}) {
  let entries = [];
  let meta = {};
  if (mode === 'daily') {
    const r = dailyQueue(opt.size || state.settings.sessionSize);
    entries = r.items.map(item => (r.mistakeKeys || []).includes(item.key) ? { item, fromMistake: true } : { item });
    meta = { newCount: r.newCount, reviewCount: r.reviewCount, note: [extraNote(r), r.plan.note].filter(Boolean).join(' ') };
  } else if (mode === 'unit') {
    entries = buildUnitQueue(opt.unit, opt.size || 15).map(item => ({ item }));
    meta = { unit: opt.unit };
  } else if (mode === 'vocab') {
    if ((opt.filter || '').startsWith('c:')) opt.title = opt.title || `主題練習・${opt.filter.slice(2)}`;
    entries = buildVocabQueue(opt.filter || 'all', opt.size || 20).map(item => ({ item }));
  } else if (mode === 'mistakes') {
    entries = buildMistakeQueue(opt.size || 20);
  } else if (mode === 'kanji') {
    entries = buildKanjiQueue(opt.size || 15).map(item => ({ item }));
  } else if (mode === 'items') {
    entries = (opt.items || []).map(item => ({ item }));
  }
  if (!entries.length) {
    toast(mode === 'mistakes' ? '錯題本目前是空的。' : '現在沒有需要練習的題目，明天再來，或到課程頁預習下一單元。');
    return false;
  }
  // a word seen for the first time is shown on a preview card before its question
  if (mode !== 'mistakes') entries.forEach(e => { if (e.item && e.item.kind === 'v' && !state.srs[e.item.key]) e.preview = true; });
  // the first new question from a lesson section the learner has not been shown yet gets that section's card first (daily and unit practice); each section once
  if (mode === 'daily' || mode === 'unit') {
    const shown = new Set(state.lessonSeen || []);
    entries.forEach(e => { const g = e.item; if (!g || g.kind !== 'g' || state.srs[g.key]) return; const k = lessonSecKey(g); if (!k || shown.has(k)) return; shown.add(k); e.preview = true; });
  }
  SESSION = {
    mode, title: opt.title || MODE_TITLE[mode] || '練習', entries, idx: 0, meta,
    stats: { correct: 0, wrong: 0, newCount: 0 }, results: [], startedAt: Date.now(), lastFmt: '', opt
  };
  prepareEntry(0);
  go('#/practice');
  return true;
}
function prepareEntry(i) {
  const e = SESSION.entries[i];
  if (!e || e.q) return;
  if (e.mistake) e.q = makeMistakeCard(e.mistake);
  else if (e.encore) e.q = makeQuestion(e.item, { encore: true, avoidFmts: usedFormats(e.item.key) });
  else e.q = makeQuestion(e.item, { avoidFmt: SESSION.lastFmt });
  if (!e.q) { SESSION.entries.splice(i, 1); if (i < SESSION.entries.length) prepareEntry(i); }
}

// formats this word has already been asked in during the session (answered or queued ahead)
function usedFormats(key) {
  return SESSION.entries.filter(x => x.q && x.item && x.item.key === key).map(x => x.q.fmt);
}
// A word met for the first time comes back twice more in this session, each time in another format: once a few
// questions later, once further on. Encores do not touch the SRS schedule; the first answer did that.
// After a miss the 再練一次 copy takes the 3–5 window, so the encores move back to keep the word from appearing twice in a row.
// One encore in another format, 8–11 items later (a few minutes of spacing); the second look is tomorrow's review.
function scheduleEncores(e, ok) {
  const shift = ok ? 0 : 3;
  const at = (lo, hi) => Math.min(SESSION.entries.length, SESSION.idx + lo + Math.floor(Math.random() * (hi - lo + 1)));
  SESSION.entries.splice(at(8 + shift, 11 + shift), 0, { item: e.item, encore: true });
}
// How many encore questions a queue will add once its new words are answered (one per new built-in word).
function encoreEstimate(items) { return items.filter(it => it.kind === 'v' && it.builtin && !state.srs[it.key]).length; }

// Consistent furigana for options: readings come from the correct answer so that a wrong
// conjugation is not given away by missing furigana.
function readingMapFrom(text) {
  const map = {};
  const html = furi(text);
  const re = /<ruby>([^<]+)<rt>([^<]+)<\/rt><\/ruby>/g;
  let m;
  while ((m = re.exec(html))) map[m[1]] = m[2];
  return map;
}
function optionHtml(q, o) {
  if (!o.jp) return esc(o.text);
  if (q.kanaOptions && q.optKana && q.optKana[o.text]) return esc(q.optKana[o.text]);
  if (q.noFuriOptions) return esc(jaPlain(o.text));
  if (q.fmt === 'v-recall' || q.fmt === 'v-reading') return furi(o.text);
  if (/\[[ぁ-ゖー]+\]/.test(o.text)) return furi(o.text);
  if (!q._rmap) {
    // one reading map for all options, so no option stands out by having (or lacking) furigana;
    // the answer and the full sentence win over readings guessed from the distractors
    const add = (text) => { const m = readingMapFrom(text || ''); Object.keys(m).forEach(k => { if (!(k in q._rmap)) q._rmap[k] = m[k]; }); };
    q._rmap = {};
    add(q.options[q.answer].text);
    add(q.fullJp);
    if (q.item && q.item.v) add(q.item.v);
    q.options.forEach(o => add(o.text));
  }
  const s = o.text;
  return s.replace(/[一-鿿々〆ヶ]+|[^一-鿿々〆ヶ]+/g, run => {
    if (!KANJI_RE.test(run)) return esc(run);
    if (q._rmap[run]) return `<ruby>${esc(run)}<rt>${esc(q._rmap[run])}</rt></ruby>`;
    // split the run into known single pieces from the map
    let out = ''; let rest = run;
    while (rest) {
      let hit = '';
      Object.keys(q._rmap).forEach(k => { if (rest.startsWith(k) && k.length > hit.length) hit = k; });
      if (!hit) { out += esc(rest); break; }
      out += `<ruby>${esc(hit)}<rt>${esc(q._rmap[hit])}</rt></ruby>`;
      rest = rest.slice(hit.length);
    }
    return out;
  });
}

// options that differ only by reading (来[き]て / 来[こ]て) keep their furigana even when furigana is off
function optClass(o) { return !o.jp ? '' : (/\[[ぁ-ゖー]+\]/.test(o.text) ? 'jp keep-furi' : 'jp'); }

function currentEntry() { return SESSION && SESSION.entries[SESSION.idx]; }

function renderPractice() {
  const view = document.getElementById('view');
  if (!SESSION) { go('#/today'); return; }
  document.body.classList.add('practicing');
  if (SESSION.idx >= SESSION.entries.length) { renderSummary(view); return; }
  const e = currentEntry();
  if (!e.q) prepareEntry(SESSION.idx);
  if (!currentEntry()) { renderSummary(view); return; }
  const q = currentEntry().q;
  const total = SESSION.entries.length;
  const pct = Math.round(SESSION.idx / total * 100);

      else cls += ' faded';
    }
    if (q.audioOptions && !answered) return audioOptionHtml(i, cls, o, 'answer', false);
    const text = optionHtml(q, o);
    // after answering, each wrong word shows what it actually means
    const zh = answered && i !== q.answer && q.optZh ? q.optZh[o.text] || '' : '';
    return `<button type="button" class="${cls}" data-act="answer" data-i="${i}" ${answered ? 'disabled' : ''}><span class="kbd">${i + 1}</span><span class="${optClass(o)}">${text}</span>${zh ? `<span class="opt-zh">${esc(zh)}</span>` : ''}</button>`;
  }).join('');
  const rec = q.key ? srsGet(q.key) : null;
  let stem = q.stemHtml;
  if (answered && q.fillHtml) stem = stem.replace(/<span class="blank" data-blank>[\s\S]*?<!--\/blank-->/, `<span class="blank filled">${q.fillHtml}</span>`);
  const custom = q.custom ? customInteractionHtml(e, answered) : '';
  view.innerHTML = `
    <div class="pr-top">
      <button type="button" class="btn btn-ghost btn-icon" data-act="exit-practice" title="結束練習（Esc）" aria-label="結束練習">${icon('close')}</button>
      <div class="bar"><span style="width:${pct}%"></span></div>
      <div class="pr-count">${SESSION.idx + 1} / ${total}</div>
    </div>
    <div class="q-card">
      <div class="q-label"><span>${esc(q.label || '')}</span>${e.requeued ? '<span class="chip chip-warn">再練一次</span>' : ''}${e.fromMistake && !e.requeued ? '<span class="chip chip-warn">錯題</span>' : ''}${e.encore ? '<span class="chip chip-warn">換個方式再考</span>' : ''}${rec && rec.leech ? '<span class="chip chip-bad" title="這題答錯了很多次">常錯</span>' : ''}${q.kind !== 'm' ? srsBadge(q.key) : ''}</div>
      <div class="q-instr">${esc(q.instr || '')}</div>
      ${q.passageHtml ? `<div class="panel jp mb-3 passage">${q.passageHtml}</div>` : ''}
      ${stem ? `<div class="q-stem jp ${q.stemClass || ''}">${stem}</div>` : ''}
      ${answered && q.revealHtml ? q.revealHtml : ''}
      ${subParts.length ? `<div class="q-sub">${subParts.join(' ')}</div>` : ''}
      ${custom || `<div class="opts ${q.wide ? 'wide' : ''}">${opts}</div>`}
      ${answered ? feedbackHtml(e) : ''}
    </div>
    <div class="pr-actions ${answered ? 'pr-next-sticky' : ''}">
      <div class="left">
        <button type="button" class="btn btn-sm btn-ghost" data-act="replay" title="播放（R）">${icon('speaker')}<span>發音</span></button>
        ${q.kind === 'v' && q.item && q.item.ex && (answered || q.fmt !== 'v-cloze') ? '<button type="button" class="btn btn-sm btn-ghost" data-act="speak-example" title="朗讀例句">例句</button>' : ''}
        <button type="button" class="btn btn-sm btn-ghost" data-act="toggle-furi" title="切換振假名（F）">振假名：${FURI_LABEL[furiState()]}</button>
        ${answered && isAiConfigured() ? '<button type="button" class="btn btn-sm btn-ghost" data-act="ai-explain">AI 解析</button>' : ''}
        ${answered && q.kind !== 'm' ? '<button type="button" class="btn btn-sm btn-ghost" data-act="report-item" title="題目有誤或不自然時，把它移出題庫">這題有問題</button>' : ''}
      </div>
      <div class="right">
        ${answered ? `<button type="button" class="btn btn-primary" data-act="next" id="btnNext">${SESSION.idx + 1 < total ? '下一題' : '看結果'} <span class="kbd" style="background:transparent;border-color:currentColor;color:inherit">Enter</span></button>` : '<span class="tiny muted">按 1–4 作答</span>'}
      </div>
    </div>`;
  if (!answered && q.audio && !e.autoPlayed) { e.autoPlayed = true; setTimeout(() => (q.audioScript ? speakScript(q.audio) : speak(q.audio, speakOpts(q, q.audio))), 150); }
  if (!answered && q.audioOptions) prefetchSpeech(q.options.map(o => jaPlain(o.text)));
  if (answered) { const nb = document.getElementById('btnNext'); if (nb) nb.focus({ preventScroll: true }); }
}

// New word: show it before asking. Enter/Space (or the button) goes on to the question.
// After a preview the question is asked 4–6 items later, so it is a recall and not a copy of what was just shown.
function dismissPreview() {
  const e = currentEntry(); if (!e || !e.preview || e.previewDone) return;
  e.previewDone = true;
  if (e.item.kind === 'g') { const k = lessonSecKey(e.item); if (k && !(state.lessonSeen || []).includes(k)) { (state.lessonSeen = state.lessonSeen || []).push(k); saveState(); } }
  if (SESSION.entries.length - SESSION.idx > 1) {
    SESSION.entries.splice(SESSION.idx, 1);
    const at = Math.min(SESSION.entries.length, SESSION.idx + 4 + Math.floor(Math.random() * 3));
    SESSION.entries.splice(at, 0, e);
  }
  renderPractice(); window.scrollTo({ top: 0 });
}
function previewHtml(e, pct, total) {
  if (e.item.kind === 'g') return grammarPreviewHtml(e, pct, total);

    <div class="pr-top">
