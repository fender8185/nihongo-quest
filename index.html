// overall progress of a bank in three mastery steps (counts) plus a weighted score: 已學 1・熟悉 2・熟練 3 points out of 3 per item
function progressTotals(kind) {
  const t = { kind, total: 0, seen: 0, learned: 0, mastered: 0, n5: 0 };   // n5: how many of the items are N5 (a faint mark on the gauge)
  const n5Units = new Set(DATA.UNITS.filter(u => u.lv === 'N5').map(u => u.id));
  if (kind === 'v') {
    REG.vocab.filter(v => v.builtin).forEach(v => { t.total++; if (v.lv === 'N5') t.n5++; const r = state.srs[v.key]; if (!r) return; const l = srsLevelLabel(r, v.key); if (l === '已熟練') t.mastered++; else if (r.b >= SRS_LEARNED) t.learned++; else t.seen++; });
  } else {
    REG.grammar.forEach(g => { t.total++; if (n5Units.has(g.u)) t.n5++; const r = state.srs[g.key]; if (!r) return; if ((r.ok || 0) >= 3) t.mastered++; else if ((r.ok || 0) >= 1) t.learned++; else t.seen++; });
  }
  t.pct = t.total ? Math.round((t.seen + t.learned * 2 + t.mastered * 3) / (t.total * 3) * 100) : 0;
  return t;
}
// half-circle gauge: three arcs (dark = mastered on the left, lighter steps to the right) over a track, needle at the weighted score
function gaugeHtml(t, title, labels) {
  const R = 80, C = 100, W = 20;
  const pt = (f) => { const a = Math.PI * (1 - f); return [C + R * Math.cos(a), C - R * Math.sin(a)]; };
  const arc = (f0, f1) => { const [x0, y0] = pt(f0); const [x1, y1] = pt(f1); return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
  const gap = 2 / (Math.PI * R);   // a 2px surface gap between segments
  const segs = [['mastered', t.mastered, labels[0]], ['learned', t.learned, labels[1]], ['seen', t.seen, labels[2]]];
  let f = 0; const paths = [];
  segs.forEach(([cls, n, label]) => {
    if (!n || !t.total) return;
    const f0 = f, f1 = f + n / t.total; f = f1;
    const a0 = f0 > 0 ? f0 + gap / 2 : f0; let a1 = f1 < 1 ? f1 - gap / 2 : f1;
    if (a1 - a0 < gap) a1 = Math.min(1, a0 + gap);   // a tiny count still shows as a sliver
    paths.push(`<path class="arc ${cls}" d="${arc(a0, a1)}" stroke-width="${W}" tabindex="0" data-tip-title="${esc(label)}：${n}" data-tip-body="占 ${Math.round(n / t.total * 100)}%"></path>`);
  });
  // faint tick where the N5 items end, with N5 / N4 labels on either side just outside the ring
  const tf = t.total && t.n5 > 0 && t.n5 < t.total ? t.n5 / t.total : null;
  const tick = tf === null ? '' : (() => { const a = Math.PI * (1 - tf); const rr = (r2) => [C + r2 * Math.cos(a), C - r2 * Math.sin(a)];
    const [x0, y0] = rr(R - W / 2 - 3), [x1, y1] = rr(R + W / 2 + 3); const off = 0.09; const al = Math.PI * (1 - tf + off), ar = Math.PI * (1 - tf - off);
    const lab = (ang, txt) => `<text class="tick-l" x="${(C + (R + W / 2 + 9) * Math.cos(ang)).toFixed(1)}" y="${(C - (R + W / 2 + 9) * Math.sin(ang) + 3).toFixed(1)}" text-anchor="middle">${txt}</text>`;
    return `<line class="tick" data-f="${tf.toFixed(4)}" x1="${x0.toFixed(2)}" y1="${y0.toFixed(2)}" x2="${x1.toFixed(2)}" y2="${y1.toFixed(2)}"></line>${lab(al, 'N5')}${lab(ar, 'N4')}`; })();
  const [nx, ny] = (() => { const a = Math.PI * (1 - t.pct / 100); return [C + (R - W / 2 - 4) * Math.cos(a), C - (R - W / 2 - 4) * Math.sin(a)]; })();   // ends just inside the ring
  const legend = `<div class="glegend small muted mt-1"><span><i class="seg-dot mastered"></i>${esc(labels[0])} ${t.mastered}</span> <span><i class="seg-dot learned"></i>${esc(labels[1])} ${t.learned}</span> <span><i class="seg-dot gseen"></i>${esc(labels[2])} ${t.seen}</span> <span>未學 ${t.total - t.seen - t.learned - t.mastered}</span> <span>共 ${t.total}</span></div>`;
  return `<div class="gauge" data-kind="${t.kind}" data-total="${t.total}" data-seen="${t.seen}" data-learned="${t.learned}" data-mastered="${t.mastered}" data-pct="${t.pct}">
    <div class="small" style="text-align:center"><strong>${esc(title)}</strong></div>
    <svg viewBox="-6 0 212 146" role="img" aria-label="${esc(title)}總進度 ${t.pct}%：${esc(labels[0])} ${t.mastered}、${esc(labels[1])} ${t.learned}、${esc(labels[2])} ${t.seen}，共 ${t.total}">
      <path class="track" d="${arc(0, 1)}" stroke-width="${W}"></path>${paths.join('')}${tick}
      <line class="needle" x1="${C}" y1="${C}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}"></line><circle class="pivot" cx="${C}" cy="${C}" r="4"></circle>
      <text class="hero" x="${C}" y="${C + 32}" text-anchor="middle">${t.pct}%</text><text class="hero-l" x="${C}" y="${C + 44}" text-anchor="middle">總進度</text>
    </svg>${legend}</div>`;
}
// Daily quotas that would finish every bank before the mock-exam weeks: unseen items ÷ study days, per kind.
// The daily goal adds room for reviews (about one and a half times the new items), rounded to fives.
function planAdvice() {
  const s = state.settings;
  const pace = examPace();
  const studyDays = Math.max(0, pace.daysLeft - 21);
  const unseen = (arr) => arr.filter(x => !state.srs[x.key]).length;
  const banks = [
    { k: 'v', name: '單字', total: REG.vocab.filter(x => x.builtin).length, left: unseen(REG.vocab.filter(x => x.builtin)), key: 'newVocabPerDay', max: 40 },
    { k: 'g', name: '文法', total: REG.grammar.length, left: unseen(REG.grammar), key: 'newGrammarPerDay', max: 30 },
    { k: 'k', name: '漢字', total: REG.kanji.length, left: unseen(REG.kanji), key: 'newKanjiPerDay', max: 15 },
    { k: 'l', name: '聽力', total: REG.listen.length, left: unseen(REG.listen), key: 'listenPerDay', max: 10 },
    { k: 'r', name: '閱讀', total: REG.read.length, left: unseen(REG.read) }
  ];
  banks.forEach(b2 => {
    b2.done = b2.total - b2.left;
    b2.need = studyDays > 0 ? b2.left / studyDays : (b2.left ? Infinity : 0);
    b2.cur = b2.key ? Number(s[b2.key] || 0) : null;
    b2.rec = b2.key ? clamp(Math.ceil(studyDays > 0 ? b2.left / studyDays : b2.left), 0, b2.max) : null;
    b2.gap = b2.key ? (b2.cur > 0 ? b2.need / b2.cur : (b2.need > 0 ? Infinity : 0)) : null;   // >1: the current setting cannot finish in time
  });
  const quota = banks.filter(b2 => b2.key);
  const newPerDay = quota.reduce((a, b2) => a + b2.rec, 0);
  const dailyGoal = clamp(Math.ceil(newPerDay * 2.5 / 5) * 5, 5, 200);
  const sessionSize = clamp(Math.ceil(Math.min(60, dailyGoal) / 5) * 5, 5, 60);
  const v = quota.find(b2 => b2.k === 'v').rec, g = quota.find(b2 => b2.k === 'g').rec;
  const vocabShare = clamp(Math.round((v + g ? v / (v + g) : 0.5) * 10) * 10, 30, 70);
  const rec = { dailyGoal, sessionSize, vocabShare }; quota.forEach(b2 => { rec[b2.key] = b2.rec; });
  const applied = Object.keys(rec).every(k => Number(s[k]) === rec[k]);
  const lagging = quota.filter(b2 => b2.gap > 1.15).sort((a, b2) => b2.gap - a.gap);
  return { studyDays, daysLeft: pace.daysLeft, banks, rec, applied, lagging, newPerDay };
}
function grammarPace() {
  const t = todayStr();
  const intro = Object.entries(state.srs).filter(([k]) => k.startsWith('g:')).map(([, r]) => r.intro || r.last).filter(Boolean).sort();
  const left = REG.grammar.filter(g => !state.srs[g.key]).length;
  if (!intro.length) return { left, rate: 0 };
  const span = clamp(daysBetween(intro[0], t) + 1, 3, 14);
  const recent = intro.filter(d => daysBetween(d, t) < span).length;
  const rate = recent / span;
  const pace = examPace();
  const finish = rate > 0 ? addDays(t, Math.ceil(left / rate)) : null;
  const target = addDays(pace.exam, -21);
  return { left, rate, finish, target, late: finish ? daysBetween(target, finish) : null };
}
function weakPoints(limit = 8) {
  const agg = {};
  REG.grammar.forEach(g => {
    const r = state.srs[g.key];
    if (!r || !g.pt) return;
    const a = agg[g.pt] || (agg[g.pt] = { pt: g.pt, ok: 0, ng: 0, items: [], unit: g.u });
    a.ok += r.ok || 0; a.ng += r.ng || 0; a.items.push(g);
  });
  return Object.values(agg).filter(a => a.ok + a.ng >= 4).map(a => Object.assign(a, { acc: a.ok / (a.ok + a.ng) }))
    .filter(a => a.acc < 0.9).sort((a, b) => a.acc - b.acc || (b.ng - a.ng)).slice(0, limit);
}
function itemLabel(it) {
  if (it.kind === 'v') return `${jaPlain(it.w)}${it.r && it.r !== it.w ? `（${it.r}）` : ''}　${it.m}`;
  if (it.kind === 'k') return `${it.k}　${it.m}`;
  if (it.kind === 'g') return jaPlain(itemPreview(it));
  if (it.kind === 'l') return it.line || it.q || it.scene || '';
  if (it.kind === 'r') return it.q || '';
  return it.key;
}

// ---------- tooltip for chart marks (values are also in the table / labels) ----------
function attachChartTips(root) {
  let tip = document.getElementById('chartTip');
  if (!tip) { tip = document.createElement('div'); tip.id = 'chartTip'; tip.className = 'chart-tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip); }
  const show = (el, x, y) => {
    tip.textContent = '';
    const b = document.createElement('b'); b.textContent = el.dataset.tipTitle || '';
    const s = document.createElement('span'); s.textContent = el.dataset.tipBody || '';
    tip.appendChild(b); tip.appendChild(s);
    tip.classList.add('show');
    const w = tip.offsetWidth; const h = tip.offsetHeight;
    tip.style.left = `${clamp(x - w / 2, 8, window.innerWidth - w - 8)}px`;
    tip.style.top = `${Math.max(8, y - h - 12)}px`;
  };
  const hide = () => tip.classList.remove('show');
  root.querySelectorAll('[data-tip-title]').forEach(el => {
    el.addEventListener('pointermove', (ev) => show(el, ev.clientX, ev.clientY));
    el.addEventListener('pointerleave', hide);
    el.addEventListener('focus', () => { const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.top); });
    el.addEventListener('blur', hide);
  });
}

// Text that should be read aloud: readings resolved (来[こ]ない → こない), markup and blanks removed
// Readings we are sure of (the furigana dictionary, bracket readings, counters) applied to a sentence for speech.
// readingSegments → ['机' → つくえ, 'の', '上' → うえ …]; kanaReadings swaps them for kana (engines without SSML);
// ssmlReadings keeps the kanji for the model's prosody and pins the pronunciation with <sub alias>.
const UNESC = { '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"', '&#39;': "'" };
function unesc(s) { return String(s || '').replace(/&(amp|lt|gt|quot|#39);/g, (m) => UNESC[m]); }
function readingSegments(text) {
  const html = furi(text);
  const out = []; const re = /<ruby[^>]*>([^<]+)<rt>([^<]+)<\/rt><\/ruby>|<[^>]+>|([^<]+)/g; let m;
  while ((m = re.exec(html))) { if (m[1] !== undefined) out.push({ k: unesc(m[1]), r: unesc(m[2]) }); else if (m[3]) out.push(unesc(m[3])); }
  return out;
}
function kanaReadings(text) { return readingSegments(text).map(x => typeof x === 'string' ? x : x.r).join(''); }

const MALE_VOICE = /keita|ichiro|otoya|hattori|takumi|daichi|naoki|shota|male|男/i;

  if (!('speechSynthesis' in window)) return [];
  const score = (v) => {
    const n = (v.name || '').toLowerCase();
    let s = 0;
    if (n.includes('natural') || n.includes('online')) s += 100;
    if (n.includes('nanami') || n.includes('keita')) s += 80;
    if (n.includes('google')) s += 70;
    if (n.includes('premium') || n.includes('enhanced') || n.includes('siri')) s += 60;
    if (n.includes('kyoko') || n.includes('otoya') || n.includes('o-ren') || n.includes('hattori')) s += 40;
    if (!v.localService) s += 20;

  };

  const all = jaVoices();
  if (!all.length) return null;
  const cfg = ttsConfig();
  const chosen = cfg.browserVoiceURI ? all.find(v => v.voiceURI === cfg.browserVoiceURI) : null;
  if (gender === 'm') return all.find(v => MALE_VOICE.test(v.name)) || chosen || all[0];
  if (gender === 'f') return (chosen && !MALE_VOICE.test(chosen.name) ? chosen : all.find(v => !MALE_VOICE.test(v.name))) || all[0];

let speechToken = 0;
let currentAudio = null;
let lastCancelAt = 0;
let ttsWarned = false;

// once that same element was started by one, so a fresh `new Audio()` after a network fetch is refused and the
// line falls silent. The shared player is unlocked by the first tap/click with a 10 ms silent clip.
const SILENT_WAV = 'data:audio/wav;base64,UklGRnQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVAAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';

    ttsPlayer.setAttribute('playsinline', '');
    ttsPlayer.preload = 'auto';
    ttsPlayer.style.display = 'none';
    document.body.appendChild(ttsPlayer);

}

  if (a.src && !a.paused) return;   // a real clip is already playing from this gesture
  ttsPlayerUnlocked = true;

    a.src = SILENT_WAV;
    const p = a.play();
    if (p && p.catch) p.catch(() => { ttsPlayerUnlocked = false; });

function stopSpeaking() {
  speechToken++;
  try {
    if ('speechSynthesis' in window && (window.speechSynthesis.speaking || window.speechSynthesis.pending)) {
      window.speechSynthesis.cancel();
      lastCancelAt = Date.now();
    }
  } catch (e) { /* ignore */ }
  if (currentAudio) { try { currentAudio.pause(); } catch (e) { /* ignore */ } currentAudio = null; }
}

async function speakBrowser(text, gender, token) {
  if (!('speechSynthesis' in window)) {
    if (!ttsWarned) { toast('這個瀏覽器不支援語音朗讀。'); ttsWarned = true; }
    return;
  }
  // Chrome sometimes drops an utterance queued right after cancel()
  const wait = 60 - (Date.now() - lastCancelAt);
  if (wait > 0) await sleep(wait);
  if (token !== speechToken) return;
  // Browsers (Chrome, iOS Safari) sometimes swallow an utterance without any event when speak() lands while the
  // previous one is winding down, and sometimes never fire onend. Each line is therefore watched: a line that never
  // starts is spoken again once, and a line only counts as finished when the synthesizer is really idle, so the next
  // line is never queued on top of it (the usual way the last option of a listening question got lost).
  for (let attempt = 0; attempt < 2; attempt++) {
    const started = await speakUtterance(text, gender, token);
    if (started || token !== speechToken) return;
    try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    lastCancelAt = Date.now();
    await sleep(120);
    if (token !== speechToken) return;
  }
}
const liveUtterances = new Set(); // keeps utterances reachable: a garbage-collected one never fires onend
function speakUtterance(text, gender, token) {
  const synth = window.speechSynthesis;
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = state.settings.speechRate || 1;
    const voice = pickVoice(gender);
    if (voice) u.voice = voice;
    // when only one voice exists, a pitch change keeps the two speakers apart
    u.pitch = gender === 'm' && !(voice && MALE_VOICE.test(voice.name)) ? 0.8 : (gender === 'f' ? 1.08 : 1);
    let began = false, finished = false, timer = null;
    const finish = (ok) => { if (finished) return; finished = true; clearTimeout(timer); liveUtterances.delete(u); resolve(ok); };
    u.onstart = () => { began = true; };
    u.onend = () => finish(true);
    u.onerror = () => finish(true);
    const busy = () => { try { return Boolean(synth.speaking || synth.pending); } catch (e) { return false; } };
    const estimate = 2500 + text.length * 350 / (u.rate || 1);
    const deadline = Date.now() + estimate;
    const hardStop = deadline + 20000;
    const watch = () => {
      if (finished) return;
      if (token !== speechToken) { finish(true); return; }
      if (!began && !busy()) { finish(false); return; }                        // swallowed: nothing is playing and it never started
      if (Date.now() >= deadline && (!busy() || Date.now() >= hardStop)) { finish(true); return; }   // onend was lost; wait until idle
      timer = setTimeout(watch, 250);
    };
    liveUtterances.add(u);
    synth.speak(u);
    timer = setTimeout(watch, 1200);
  });
}

function engineBlob(text, gender, opt = {}) {
  const cfg = ttsConfig();
  const rate = state.settings.speechRate || 1;
  const pin = opt.reading ? `|r:${opt.reading}` : '';
  const ck = cfg.engine === 'deepgram' ? `dg|${gender === 'm' ? cfg.deepgramVoiceM : cfg.deepgramVoice}|${cfg.kanaReadings}|${text}`
    : cfg.engine === 'google_tts' ? `gg|${gender === 'm' ? cfg.googleVoiceM : cfg.googleVoice}|${rate}|${text}`
    : cfg.engine === 'voicevox' ? `vv|${gender === 'm' ? cfg.voicevoxSpeakerM : cfg.voicevoxSpeaker}|${rate}|${text}`
    : cfg.engine === 'openai_tts' ? `oa|${cfg.openaiModel}|${gender === 'm' ? cfg.openaiVoiceM : cfg.openaiVoice}|${rate}|${text}` : '';
  if (!ck) return Promise.resolve(null);
  const key = ck + pin;
  if (audioCache.has(key)) return Promise.resolve(audioCache.get(key));
  if (audioPending.has(key)) return audioPending.get(key);
  const p = fetchEngineBlob(cfg, text, gender, opt).then(blob => { audioCache.set(key, blob); return blob; }).finally(() => audioPending.delete(key));
  audioPending.set(key, p);
  return p;
}

  if (/API key not valid|API_KEY_INVALID|invalid api key|Unauthorized|401/i.test(m)) return '金鑰無效：確認貼上的是完整的金鑰、前後沒有空白，而且是同一個專案建立的。';

async function fetchEngineBlob(cfg, text, gender, opt = {}) {

  const spoken = opt.reading || cfg.kanaReadings === 'off' ? text : kanaReadings(text);
  const ssml = opt.reading ? `<speak><sub alias="${esc(opt.reading)}">${esc(text)}</sub></speak>` : ssmlReadings(text);
  if (cfg.engine === 'google_tts') {
    const key = (cfg.googleKey || '').trim();

    const resp = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${encodeURIComponent(key)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },

    });

    if (!cfg.deepgramKey) throw new Error('沒有 Deepgram API Key');

    const resp = await fetch(`https://api.deepgram.com/v1/speak?model=${encodeURIComponent(model)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Token ${cfg.deepgramKey.trim()}` }, body: JSON.stringify({ text: spoken })
    });

    return resp.blob();
  }
  if (cfg.engine === 'voicevox') {
    const base = String(cfg.voicevoxUrl || TTS_DEFAULT.voicevoxUrl).replace(/\/+$/, '');
    const host = /^https?:/.test(base) ? base : `http://${base}`;
    const speaker = gender === 'm' ? cfg.voicevoxSpeakerM : cfg.voicevoxSpeaker;
    const q = await fetch(`${host}/audio_query?text=${encodeURIComponent(text)}&speaker=${encodeURIComponent(speaker)}`, { method: 'POST' });
    if (!q.ok) throw new Error(`VOICEVOX HTTP ${q.status}`);
    const query = await q.json();
    query.speedScale = rate;
    const s = await fetch(`${host}/synthesis?speaker=${encodeURIComponent(speaker)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(query) });

    return s.blob();
  }
  if (cfg.engine === 'openai_tts') {
    const key = (cfg.openaiKey || (state.aiConfig && state.aiConfig.openaiKey) || '').trim();

    const resp = await fetch('https://api.openai.com/v1/audio/speech', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${key}` },

    });

  }

}

function playUrl(url, token, rate = 1) {
  return new Promise(resolve => {
    if (token !== speechToken) { resolve(true); return; }
    const a = getTtsPlayer();
    let finished = false, started = false, timer = null;
    const cleanup = () => { clearTimeout(timer); a.onended = a.onerror = a.onplaying = a.onloadedmetadata = a.ontimeupdate = null; };
    a.ontimeupdate = () => { if (token === SPEECH_PROG.token && isFinite(a.duration) && a.duration > 0) SPEECH_PROG.real = Math.min(1, a.currentTime / a.duration); };   // real progress for the bar
    const done = (ok, why) => { if (finished) return; finished = true; cleanup(); if (!ok && why) console.warn('audio playback failed:', why); resolve(ok); };
    a.onended = () => done(true);
    a.onerror = () => done(false, 'error');
    a.onplaying = () => { started = true; };
    // a clip that never starts (refused play, stalled decode) or never reports `ended` must not stall the whole script
    a.onloadedmetadata = () => {
      if (finished || !isFinite(a.duration)) return;
      clearTimeout(timer);
      timer = setTimeout(() => done(started, started ? '' : 'never started'), a.duration / (rate || 1) * 1000 + 4000);
    };
    timer = setTimeout(() => { if (!started) done(false, 'never started'); }, 6000);
    try { a.pause(); } catch (e) { /* ignore */ }
    a.src = url;
    a.playbackRate = rate;
    currentAudio = a;
    const p = a.play();
    if (p && p.catch) p.catch(e => done(false, e && e.name));
  });
}

async function speakLine(text, gender, token, opt) {
  const cfg = ttsConfig();
  if (cfg.engine && cfg.engine !== 'browser_neural') {
    try {
      const blob = await engineBlob(text, gender, opt);
      if (token !== speechToken) return;
      if (blob) {
        const url = URL.createObjectURL(blob);
        const ok = await playUrl(url, token, cfg.engine === 'deepgram' ? (state.settings.speechRate || 1) : 1);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        if (ok) return;
      }
    } catch (e) {
      console.warn('TTS engine failed, using browser voice', e);
      if (!ttsWarned) { toast(`${(TTS_ENGINES.find(x => x[0] === cfg.engine) || [, '語音服務'])[1]} 無法使用，暫時改用瀏覽器語音。`, 3600); ttsWarned = true; }
    }
  }
  if (token !== speechToken) return;
  await speakBrowser(text, gender, token);
}

// opt.reading: the exact reading of a single word. The word is sent in its written form (a lone kana string is
// read with odd pitch and segmentation) and the reading is pinned: SSML alias on Google, otherwise trusted to the model.
function speak(text, opt) {
  const t = ttsText(text);
  if (!t) return Promise.resolve();
  stopSpeaking();
  return speakLine(t, '', speechToken, opt);
}

// Listening scripts: one line per speaker, 「男：」 lines in a male voice when one is available
async function speakScript(script) {
  stopSpeaking();
  const token = speechToken;
  const parts = String(script || '').split(/\n+/).map(l => l.trim()).filter(Boolean).map(line => {
    const m = /^([^：:]{1,6})[：:]\s*(.+)$/.exec(line);
    const who = m ? m[1] : '';
    return { gender: /男/.test(who) ? 'm' : (/女/.test(who) ? 'f' : ''), text: ttsText(m ? m[2] : line) };
  }).filter(p => p.text);
  // external engines: fetch every line up front (Deepgram allows 15 in flight) so the options follow without
  // network gaps and the first clip starts as soon as possible after the tap that triggered it
  const cfg = ttsConfig();
  if (cfg.engine && cfg.engine !== 'browser_neural') parts.forEach(p => { engineBlob(p.text, p.gender).catch(() => {}); });
  speechProgStart(token, parts.length);
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (token !== speechToken) return;
    speechProgLine(i, p.text, state.settings.speechRate || 1);
    await speakLine(p.text, p.gender, token);
    if (parts.length > 1) await sleep(280);
  }
  if (token === speechToken) speechProgEnd();
}

async function playVocabAudio(v, mode = 'word') {
  if (!v) return;
  const file = mode === 'ex' ? (v.audioEx || '') : (v.audioWord || '');
  const text = mode === 'ex' ? exPlain(v.ex || v.w || '') : jaPlain(v.w);
  const reading = mode === 'word' && v.r && !HAS_KANJI.test(v.r) && v.r !== jaPlain(v.w) ? v.r : '';
  if (file) {

    if (url) {

      const ok = await playUrl(url, speechToken, state.settings.speechRate || 1);
      if (ok) return;
    }
  }
  if (mode === 'ex' && !v.ex) return;
  speak(text, reading ? { reading } : undefined);
}

      .map(m => String(m.name || '').replace(/^models\//, ''))
      .filter(n => /^gemini-/.test(n) && !/(tts|embedding|image|imagen|live|vision|audio|robotics|computer-use|research)/i.test(n))
      .sort((a, b) => (slowName(a) - slowName(b)) || (/flash/.test(b) - /flash/.test(a)) || (/lite/.test(a) - /lite/.test(b)) || b.localeCompare(a));   // stable flash first; preview / exp / thinking variants (slower, tighter quotas) last
  } catch (e) { return []; }
}

async function callAi(prompt, opt = {}) {
  const c = aiConfig();
  const system = opt.system || aiSystemPrompt();
  if (!isAiConfigured()) throw new Error('尚未設定 AI。請到「設定 → AI」填入 API Key。');
  if (c.provider === 'gemini') {
    const key = c.geminiKey.trim();
    const genCfg = Object.assign({ temperature: opt.temperature ?? 0.7 }, opt.json ? { responseMimeType: 'application/json' } : {});
    // thinking off: a quiz explanation does not need deliberation, and default thinking makes flash models take 10 s or more
    const mkBody = (think) => ({ systemInstruction: { parts: [{ text: system }] }, contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: think ? genCfg : Object.assign({ thinkingConfig: { thinkingBudget: 0 } }, genCfg) });
    const tryModel = async (model, think = false) => {
      const ac = new AbortController(); const timer = setTimeout(() => ac.abort(), GEMINI_TIMEOUT_MS);
      let r;
      try { r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(mkBody(think)), signal: ac.signal }); }
      catch (err) { if (ac.signal.aborted) { const e = new Error(`Gemini 回應逾時（${Math.round(GEMINI_TIMEOUT_MS / 1000)} 秒沒有回應）`); e.timeout = true; throw e; } throw err; }
      finally { clearTimeout(timer); }
      if (!r.ok) {
        const t = await r.text();
        if (r.status === 400 && !think && /thinking/i.test(t)) return tryModel(model, true);   // this model cannot switch thinking off: ask again without the setting
        const e = new Error(`Gemini 回應錯誤（${r.status}）${t.slice(0, 160)}`); e.status = r.status; e.raw = t; throw e;
      }
      const d = await r.json();
      const text = (((d.candidates || [])[0] || {}).content || {}).parts;
      const out = (text || []).map(p => p.text || '').join('');
      if (!out) throw new Error('Gemini 沒有回傳內容');
      return out;
    };
    const pref = String(c.geminiModel || 'auto').replace(/^models\//, '');
    const order = pref !== 'auto' ? [pref] : [];
    (await geminiModelsCached(key)).concat(GEMINI_FALLBACK).forEach(n => { if (!order.includes(n)) order.push(n); });
    const now = Date.now();
    const ready = order.filter(m => !(GEMINI_COOL.get(m) > now));
    if (!ready.length) {
      const soonest = Math.min(...order.map(m => GEMINI_COOL.get(m) || now));
      throw new Error(`Gemini 的免費額度暫時用完：約 ${Math.max(1, Math.ceil((soonest - now) / 1000))} 秒後再試。`);
    }
    let lastErr = null; let quotaHit = false;
    for (const m of ready.slice(0, 6)) {
      try {
        let out;
        try { out = await tryModel(m); }
        catch (e1) { if (![500, 503].includes(e1.status)) throw e1; await new Promise(r => setTimeout(r, 1500)); out = await tryModel(m); }   // overloaded: one quick retry (a timeout is not retried: it would cost another wait)
        AI_LAST.model = m;
        if (pref !== 'auto' && m !== pref) toast(`${pref} 暫時無法使用，這次改用 ${m}`);
        return out;
      } catch (e) {
        lastErr = e;
        if (e.status === 429) { quotaHit = true; coolModel(m, geminiRetryMs(e.raw)); }
        else if ([500, 503].includes(e.status) || e.timeout) coolModel(m, 30000);   // overloaded or silent: skip it for a while
        else if ([400, 404].includes(e.status)) coolModel(m, 24 * 3600 * 1000);   // retired or misspelled model
        else throw e;   // 401/403: the key itself
      }
    }
    if (quotaHit) throw new Error(`Gemini 的免費額度暫時用完（${ready.length} 個模型都在限額中）：約 ${Math.max(1, Math.ceil((Math.min(...ready.map(m => GEMINI_COOL.get(m) || now)) - now) / 1000))} 秒後再試。`);
    throw lastErr || new Error('Gemini 沒有可用的模型');
  }
  if (c.provider === 'ollama') {
    const base = String(c.ollamaUrl).replace(/\/+$/, '');
    const r = await fetch(`${/^https?:/.test(base) ? base : 'http://' + base}/api/generate`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: c.ollamaModel, system, prompt, stream: false, format: opt.json ? 'json' : undefined })
    });
    if (!r.ok) throw new Error(`Ollama 連線失敗（${r.status}），請確認 ollama serve 正在執行，並允許瀏覽器連線（OLLAMA_ORIGINS）。`);
    const d = await r.json();
    return d.response || '';
  }
  const base = String(c.openaiUrl || AI_DEFAULT.openaiUrl).replace(/\/+$/, '');
  const r = await fetch(`${/^https?:/.test(base) ? base : 'https://' + base}/chat/completions`, {
    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${c.openaiKey.trim()}` },
    body: JSON.stringify(Object.assign({ model: c.openaiModel, messages: [{ role: 'system', content: system }, { role: 'user', content: prompt }] }, opt.json ? { response_format: { type: 'json_object' } } : {}))
  });
  if (!r.ok) throw new Error(`API 回應錯誤（${r.status}）`);
  const d = await r.json();
  return (((d.choices || [])[0] || {}).message || {}).content || '';
}

function parseAiJson(raw) {
  let s = String(raw || '').replace(/```(?:json)?/gi, '').trim();
  const first = s.search(/[[{]/);
  if (first > 0) s = s.slice(first);
  const v = JSON.parse(s);
  if (Array.isArray(v)) return v;
  // OpenAI json_object mode wraps arrays: { "items": [...] }
  const arr = Object.values(v).find(x => Array.isArray(x));
  return arr || v;
}

// busy state for the button that started a request
async function withBusy(btn, label, fn) {
  const old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> ${esc(label || 'AI 思考中')}`; }
  try { return await fn(); } catch (e) {

    toast(e.message && e.message.length < 140 ? e.message : 'AI 請求失敗，請稍後再試或檢查設定。', 4800);
    return null;
  } finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }

const BANNED_WORDS = /(秒殺|100%|絕對|千萬|魔王|黃金|鐵則|制霸|必背|必考|陷阱|神器|超級)/;
function validAiGrammar(x, u) {
  if (!x || typeof x !== 'object') return null;
  const t = ['choice', 'meaning', 'correct', 'order'].includes(x.t) ? x.t : 'choice';
  const s = (v) => String(v == null ? '' : v).trim();
  const out = { id: uid('ai'), u: u.id, t, lv: /N4/.test(u.lv) ? 'N4' : 'N5', d: 2, pt: s(x.pt).slice(0, 20) || 'AI 題目', zh: s(x.zh), why: s(x.why), src: 'ai' };
  if ([out.zh, out.why, out.pt].some(v => BANNED_WORDS.test(v))) return null;
  if (t === 'order') {
    const parts = Array.isArray(x.parts) ? x.parts.map(s).filter(Boolean) : [];
    const star = Number(x.star);
    if (parts.length !== 4 || new Set(parts).size !== 4 || !(star >= 0 && star <= 3)) return null;
    return Object.assign(out, { pre: s(x.pre), parts, post: s(x.post), star });
  }
  const op = Array.isArray(x.op) ? x.op.map(s).filter(Boolean) : [];
  const a = s(x.a);
  if (op.length !== 4 || new Set(op).size !== 4 || !op.includes(a)) return null;
  if (t === 'choice') {
    const jp = s(x.jp).replace(/\(\s*\)|（\s*）|（_+）|___+/g, '（　）');
    if ((jp.match(/（　）/g) || []).length !== 1) return null;
    const tail = jp.split('（　）')[1] || '';
    if (/^(です|ます|でした|ました)/.test(tail) && op.some(o => /(です|ます|でした|ました)$/.test(o))) return null;
    return Object.assign(out, { jp, op, a });
  }
  if (t === 'meaning') {
    const jp = s(x.jp);
    if (!/[぀-ヿ一-鿿]/.test(jp) || /（　）/.test(jp)) return null;
    return Object.assign(out, { jp, op, a });
  }
  return Object.assign(out, { op, a });
}

async function aiGenerateDeck(topic, btn) {

每張卡是一個 JSON 物件：
w（單字的一般寫法）、r（平假名讀音）、m（繁體中文意思，12 字內）、p（詞性代碼：n 名詞、v5 五段、v1 一段、vs する動詞、i い形容詞、na な形容詞、adv 副詞、exp 慣用語）、lv（"N5" 或 "N4"）、ex（20 字內的自然例句，把單字本身用 [ ] 包起來，例如「毎朝パンを[食べます]。」）、exZh（例句中文）。

  await withBusy(btn, 'AI 產生中', async () => {

    const have = new Set(REG.vocab.map(v => jaPlain(v.w)));

    arr.forEach(x => {
      const w = String(x.w || '').trim(); const m = String(x.m || '').trim();

      const raw = String(x.ex || '').trim();

      state.vocab.unshift({ id: uid('ai'), w, r: IS_KANA.test(String(x.r || '')) ? String(x.r) : '', m: m.slice(0, 30), p: POS_CODES.has(x.p) ? x.p : '', lv: 'CUSTOM', ex, exZh: String(x.exZh || ''), src: 'ai', posLabel: `AI・${t}`.slice(0, 16) });
      have.add(w); added++;
    });
    saveState(); buildRegistry();
    toast(added ? `已新增 ${added} 張字卡` : '沒有新增字卡（可能都和現有字卡重複）');
    route();
  });
}

function validAiExam(x, level) {
  const s = (v) => String(v == null ? '' : v).trim();
  if (!x || !['S1-M3', 'S2-M1', 'S1-M4', 'S3-M4'].includes(x.m)) return null;
  const op = Array.isArray(x.op) ? x.op.map(s).filter(Boolean) : [];
  const a = s(x.a);
  const need = x.m === 'S3-M4' ? 3 : 4;
  if (op.length !== need || new Set(op).size !== need || !op.includes(a)) return null;
  const out = { id: uid('aix'), lv: level, m: x.m, op, a, why: s(x.why), src: 'ai' };
  if (x.m === 'S3-M4') { if (!s(x.line)) return null; out.line = s(x.line); return out; }
  const jp = s(x.jp);
  if (x.m === 'S1-M4') { if ((jp.match(/＿＿/g) || []).length !== 2) return null; out.jp = jp; return out; }
  if ((jp.match(/（　）/g) || []).length !== 1) return null;
  out.jp = jp;
  return out;
}

/* ==========================================================================
   Anki import: .apkg / .colpkg (JSZip + sql.js + fzstd), text exports, media store
   ========================================================================== */
const AnkiMedia = {
  DB: 'nihongo_anki_media_db_v1', STORE: 'media_blobs', dbp: null, urls: new Map(),
  open() {
    if (this.dbp) return this.dbp;
    this.dbp = new Promise(resolve => {
      try {
        if (!('indexedDB' in window)) { resolve(null); return; }
        const req = indexedDB.open(this.DB, 1);
        req.onupgradeneeded = (ev) => { const db = ev.target.result; if (!db.objectStoreNames.contains(this.STORE)) db.createObjectStore(this.STORE); };
        req.onsuccess = (ev) => resolve(ev.target.result);
        req.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
    return this.dbp;
  },
  async putBatch(entries) {
    const db = await this.open();
    if (!db || !entries.length) return 0;
    return new Promise(resolve => {
      try {
        const tx = db.transaction(this.STORE, 'readwrite');
        const st = tx.objectStore(this.STORE);
        entries.forEach(({ name, blob }) => { if (name && blob) st.put(blob, name); });
        tx.oncomplete = () => resolve(entries.length);
        tx.onerror = () => resolve(0);
      } catch (e) { resolve(0); }
    });
  },
  async url(name) {
    if (!name) return null;
    const raw = String(name).trim();
    const cands = [raw];
    try { const d = decodeURIComponent(raw); if (!cands.includes(d)) cands.push(d); } catch (e) { /* ignore */ }
    const base = raw.split('/').pop();
    if (base && !cands.includes(base)) cands.push(base);
    for (const k of cands) if (this.urls.has(k)) return this.urls.get(k);
    const db = await this.open();
    if (!db) return null;
    for (const k of cands) {
      const blob = await new Promise(resolve => {
        try {
          const req = db.transaction(this.STORE, 'readonly').objectStore(this.STORE).get(k);
          req.onsuccess = () => resolve(req.result instanceof Blob ? req.result : null);
          req.onerror = () => resolve(null);
        } catch (e) { resolve(null); }
      });
      if (blob) { const u = URL.createObjectURL(blob); this.urls.set(raw, u); this.urls.set(k, u); return u; }
    }
    return null;
  },
  async clear() {
    this.urls.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) { /* ignore */ } });
    this.urls.clear();
    const db = await this.open();
    if (!db) return;
    await new Promise(resolve => {
      try { const tx = db.transaction(this.STORE, 'readwrite'); tx.objectStore(this.STORE).clear(); tx.oncomplete = resolve; tx.onerror = resolve; } catch (e) { resolve(); }
    });
  }
};

// ---------- field parsing ----------
function hasJa(s) { return /[぀-ヿ一-鿿]/.test(String(s || '')); }
function hasKana(s) { return /[぀-ヿ]/.test(String(s || '')); }
function looksLikeId(str) {
  const s = String(str || '').trim();
  if (!s) return true;
  if (/^(?:#|no\.?|ep\.?|ch\.?|lesson|part|unit|vol\.?|card)?\s*\d+([.\-_:/]\d+)*[a-z]?$/i.test(s)) return true;
  return /^[\x21-\x7E]{5,18}$/.test(s) && !hasJa(s) && /[^a-zA-Z]/.test(s);
}
function parseField(raw, keepReading = false) {
  const out = { text: '', sounds: [], images: [], videos: [], reading: '' };
  if (raw === null || raw === undefined) return out;
  let s = String(raw).trim();
  s = s.replace(/\[sound:([^\]]+)\]/gi, (_, f) => { const n = f.trim(); if (n) (/\.(mp4|webm|mov|ogv)$/i.test(n) ? out.videos : out.sounds).push(n); return ' '; });
  s = s.replace(/<img[^>]*src=(?:["']([^"']+)["']|([^\s>]+))[^>]*>/gi, (_, a, b) => { const n = (a || b || '').trim(); if (n) (/\.(mp4|webm|mov|ogv|m4v)$/i.test(n) ? out.videos : out.images).push(n); return ' '; });
  s = s.replace(/<(?:video|source|audio)[^>]*src=(?:["']([^"']+)["']|([^\s>]+))[^>]*>/gi, (tag, a, b) => { const n = (a || b || '').trim(); if (n) ((/^<audio/i.test(tag) || /\.(mp3|ogg|oga|opus|wav|m4a|aac|flac)$/i.test(n)) ? out.sounds : out.videos).push(n); return ' '; });
  const readings = [];
  s = s.replace(/<ruby[^>]*>(.*?)<\/ruby>/gi, (_, inner) => {
    (inner.match(/<rt[^>]*>(.*?)<\/rt>/gi) || []).forEach(rt => readings.push(rt.replace(/<[^>]+>/g, '').trim()));
    return keepReading ? inner.replace(/<rb[^>]*>.*?<\/rb>/gi, '').replace(/<[^>]+>/g, '') : inner.replace(/<rt[^>]*>.*?<\/rt>/gi, '').replace(/<rp[^>]*>.*?<\/rp>/gi, '').replace(/<[^>]+>/g, '');
  });
  s = s.replace(/\s?([一-鿿々]+)\[([぀-ヿ]+)\]/g, (_, k, r) => { readings.push(r); return keepReading ? r : k; });
  if (readings.length) out.reading = readings.join('');
  s = s.replace(/<br\s*\/?>/gi, ' ').replace(/<\/(?:div|p|li|tr)>/gi, ' ')
    .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '').replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '').replace(/<[^>]+>/g, '')
    .replace(/&nbsp;/gi, ' ').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>').replace(/&quot;/gi, '"').replace(/&#39;/gi, "'").replace(/&amp;/gi, '&')
    .replace(/\s+/g, ' ').trim().replace(/^["']|["']$/g, '').trim();
  out.text = s;
  return out;
}

function guessMapping(names, rows) {
  const n = names.length;
  const g = { w: 0, r: -1, m: Math.min(1, n - 1), ex: -1, exZh: -1, pos: -1 };
  if (!n) return g;
  const sample = rows.slice(0, 25);
  const stats = names.map((rawName, c) => {
    const name = String(rawName || '').toLowerCase();
    let nonEmpty = 0; let ids = 0; let ja = 0; let pureKana = 0; let furi = 0; let en = 0;
    sample.forEach(r => {
      const cell = r[c] || '';
      if (/<ruby|\[[぀-ヿ]+\]/.test(cell)) furi++;
      const t = parseField(cell).text;
      if (!t) return;
      nonEmpty++;
      if (looksLikeId(t) || /^(Basic|Cloze|Japanese|Core\s*\d+)/i.test(t)) { ids++; return; }
      if (hasJa(t)) { ja++; if (/^[぀-ヿ\s〜・、。！？「」『』（）()-]+$/.test(t)) pureKana++; } else if (/[a-zA-Z]{2,}/.test(t)) en++;
    });
    return { c, name, nonEmpty, ja, pureKana, furi, en, skip: nonEmpty === 0 || ids >= nonEmpty * 0.5 };
  });
  const jaCols = stats.filter(s => !s.skip && s.ja > 0);
  const named = jaCols.find(s => /(expression|vocab|kanji|word|front|japanese|表|単語|見出し|日文|漢字|日本語)/i.test(s.name) && !/(reading|kana|furigana|audio|sound|読み|仮名|かな|meaning|english|trans)/i.test(s.name));
  const sentence = jaCols.find(s => /(sentence|example|quote|line|sub|例文|例句|セリフ|台詞)/i.test(s.name) && !/(reading|kana|furigana|audio|sound|meaning|english|trans|訳)/i.test(s.name));
  g.w = (named || sentence || jaCols.find(s => s.ja > s.pureKana) || jaCols[0] || stats.find(s => !s.skip) || { c: 0 }).c;
  const rest = jaCols.filter(s => s.c !== g.w);
  const reading = rest.find(s => /(reading|kana|hiragana|furigana|pronunciation|読み|仮名|かな|ふりがな|發音|讀音)/i.test(s.name)) || rest.find(s => s.pureKana >= s.nonEmpty * 0.5 || s.furi >= s.nonEmpty * 0.4);
  g.r = reading ? reading.c : -1;
  const others = stats.filter(s => !s.skip && s.c !== g.w && s.c !== g.r);
  const meaning = others.find(s => /(meaning|english|glossary|translation|definition|back|explain|意味|中文|解釋|翻譯|訳|英語)/i.test(s.name) && !/(audio|sound|image|pic|video|pos|tag)/i.test(s.name)) || others.find(s => s.en > 0) || others.find(s => s.ja < s.nonEmpty) || others[0];
  if (meaning) g.m = meaning.c;
  const exJa = jaCols.filter(s => s.c !== g.w && s.c !== g.r && s.c !== g.m);
  if (exJa.length) g.ex = (exJa.find(s => /(sentence|example|context|例文|例句)/i.test(s.name)) || exJa[0]).c;
  const note = others.find(s => s.c !== g.m && s.c !== g.ex && /(sentence.*(meaning|trans|english|chinese|zh)|exzh|例文訳|例句中譯|例句中文|例句翻譯)/i.test(s.name));
  if (note) g.exZh = note.c;
  const pos = stats.find(s => /(pos|part of speech|品詞|詞性)/i.test(s.name));
  if (pos) g.pos = pos.c;
  return g;
}

function cardFromRow(row, map, idx) {
  const col = (i, keep) => (i >= 0 && i < row.length ? parseField(row[i], keep) : parseField(''));
  let pw = col(map.w); const pr = col(map.r, true); let pm = col(map.m); const pex = col(map.ex); const pexz = col(map.exZh); const ppos = col(map.pos);
  const all = row.map(c => parseField(c));
  const sounds = []; const images = []; const videos = [];
  all.forEach(p => { p.sounds.forEach(x => { if (!sounds.includes(x)) sounds.push(x); }); p.images.forEach(x => { if (!images.includes(x)) images.push(x); }); p.videos.forEach(x => { if (!videos.includes(x)) videos.push(x); }); });
  if (!pw.text || looksLikeId(pw.text) || (!hasJa(pw.text) && all.some(p => hasJa(p.text)))) {
    const k = all.findIndex((p, i) => i !== map.m && p.text && !looksLikeId(p.text) && hasJa(p.text));
    if (k >= 0) pw = all[k];
  }
  if (!pm.text || looksLikeId(pm.text) || pm.text === pw.text) {
    const k = all.findIndex(p => p.text && p.text !== pw.text && p.text !== pr.text && !looksLikeId(p.text) && (!hasKana(p.text) || /[a-zA-Z]{2,}/.test(p.text)));
    if (k >= 0) pm = all[k];
  }
  const w = pw.text || pr.text;
  const wKana = map.w >= 0 && map.w < row.length ? parseField(row[map.w], true).text : '';
  const rCand = pr.text || (pw.reading && IS_KANA.test(wKana.replace(/\s/g, '')) ? wKana : '');
  const r = rCand && rCand !== w && IS_KANA.test(rCand.replace(/\s/g, '')) ? rCand.replace(/\s/g, '') : '';
  const m = pm.text;
  const ex = pex.text && pex.text !== w ? markTarget(pex.text, w) : '';
  return {
    id: `apkg_${Date.now().toString(36)}_${idx}_${Math.random().toString(36).slice(2, 5)}`,
    w, r, m: m.slice(0, 120), p: '', lv: 'CUSTOM', ex, exZh: pexz.text && pexz.text !== m ? pexz.text : '',
    posLabel: (ppos.text || (sounds.length || images.length || videos.length ? 'Anki・影音' : 'Anki')).slice(0, 16), src: 'anki',
    audioWord: pw.sounds[0] || sounds[0] || '', audioEx: pex.sounds[0] || (sounds.length > 1 ? sounds[1] : ''), imageFile: images[0] || '', videoFile: videos[0] || ''
  };
}

// ---------- text / CSV / JSON ----------
function splitCsvLine(line, sep) {
  if (sep !== ',' || !line.includes('"')) return line.split(sep);
  const out = []; let cur = ''; let q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
function textToRows(raw) {
  const lines = String(raw || '').replace(/^﻿/, '').split(/\r?\n/);
  let sep = null; let header = [];
  const rows = [];
  lines.forEach(line => {
    const l = line.trim();
    if (!l) return;
    if (l.startsWith('#')) {
      const low = l.toLowerCase();
      if (low.startsWith('#separator:')) { const v = low.split(':')[1].trim(); sep = v === 'tab' ? '\t' : v === 'comma' ? ',' : v === 'semicolon' ? ';' : v === 'pipe' ? '|' : (v || null); }
      else if (low.startsWith('#columns:')) { const c = l.slice(9).trim(); header = c.includes('\t') ? c.split('\t') : c.split(/[,;]/); }
      return;
    }
    const s = sep || (l.includes('\t') ? '\t' : (l.includes(';') ? ';' : ','));
    const parts = splitCsvLine(l, s);
    if (parts.length >= 2) rows.push(parts);
  });
  const n = rows.reduce((a, r) => Math.max(a, r.length), 0);
  return { names: Array.from({ length: n }, (_, i) => (header[i] || '').trim() || `第 ${i + 1} 欄`), rows };
}
function importAnkiText(raw, title = '貼上的文字') {
  const t = String(raw || '').trim();
  if (!t) { toast('請先貼上字卡內容'); return; }
  if (t.startsWith('[')) {
    try {
      const arr = JSON.parse(t);
      if (Array.isArray(arr) && arr.length) {
        const names = ['日文', '讀音', '意思', '例句', '例句中文', '詞性'];
        const rows = arr.map(x => [x.w || x.kanji || '', x.r || x.kana || '', x.m || x.meaning || '', x.ex || x.exJp || '', x.exZh || '', x.pos || '']);
        showMapper(`${title}（JSON）`, names, rows, '');
        STAGED.map = { w: 0, r: 1, m: 2, ex: 3, exZh: 4, pos: 5 };
        renderMapper();
        return;
      }
    } catch (e) { /* not JSON, fall through */ }
  }
  const { names, rows } = textToRows(t);
  if (!rows.length) { toast('看不出欄位，請確認每行至少有「日文」和「意思」，用 Tab 或逗號分隔。'); return; }
  showMapper(title, names, rows, '');
}

async function importAnkiFile(file) {
  const name = file.name || '';
  if (/\.(txt|tsv|csv|json)$/i.test(name)) {
    const text = await file.text();
    importAnkiText(text, name);
    return;
  }
  ankiStatus(`<span class="spinner"></span> 正在讀取 ${esc(name)}…`);
  try {
    await loadScript(LIBS.jszip);
    await loadScript(LIBS.sqljs);
    const zip = await window.JSZip.loadAsync(file);
    const files = Object.keys(zip.files);
    const isZstd = (b) => b.length >= 4 && b[0] === 0x28 && b[1] === 0xB5 && b[2] === 0x2F && b[3] === 0xFD;
    const unzstd = async (b) => { if (!isZstd(b)) return b; await loadScript(LIBS.fzstd); return window.fzstd.decompress(b); };
    const dbName = ['collection.anki21b', 'collection.anki21', 'collection.anki2'].find(n => zip.file(n)) || files.find(n => /\.anki2(1b?)?$/i.test(n));
    if (!dbName) throw new Error('檔案裡找不到 Anki 資料庫（collection.anki2）。');
    const dbBytes = await unzstd(await zip.file(dbName).async('uint8array'));
    const SQL = await window.initSqlJs({ locateFile: f => LIBS.sqlwasm + f });
    const db = new SQL.Database(dbBytes);
    const fieldsByModel = {};
    try {
      const r = db.exec('SELECT models FROM col LIMIT 1');
      const js = r.length && r[0].values.length ? r[0].values[0][0] : '';
      if (js && js !== '{}') Object.entries(JSON.parse(js)).forEach(([mid, m]) => { if (m && Array.isArray(m.flds)) fieldsByModel[String(mid)] = m.flds.map(f => f.name || '欄位'); });
    } catch (e) { /* newer schema */ }
    if (!Object.keys(fieldsByModel).length) {
      try {
        const r = db.exec('SELECT CAST(ntid AS TEXT), ord, name FROM fields ORDER BY ntid, ord');
        if (r.length) r[0].values.forEach(([nt, ord, n]) => { (fieldsByModel[nt] = fieldsByModel[nt] || [])[ord] = String(n || `欄位 ${ord + 1}`); });
      } catch (e) { /* ignore */ }
    }
    const notes = db.exec('SELECT CAST(mid AS TEXT), flds FROM notes');
    db.close();
    if (!notes.length || !notes[0].values.length) throw new Error('這個牌組裡沒有筆記。');
    // keep the most common note type so the columns line up
    const count = {};
    notes[0].values.forEach(([mid]) => { count[mid] = (count[mid] || 0) + 1; });
    const mainMid = Object.entries(count).sort((a, b) => b[1] - a[1])[0][0];
    const rows = notes[0].values.filter(([mid]) => mid === mainMid).map(([, f]) => String(f || '').split('\x1f'));
    const width = rows.reduce((a, r) => Math.max(a, r.length), 0);
    const names = Array.from({ length: width }, (_, i) => (fieldsByModel[mainMid] || [])[i] || `欄位 ${i + 1}`);

    // media: numbered zip entries + a JSON (or zstd) name map
    let media = {};
    if (zip.file('media')) {
      try {
        const raw = await unzstd(await zip.file('media').async('uint8array'));
        const s = new TextDecoder('utf-8').decode(raw);
        if (s.trim().startsWith('{')) media = JSON.parse(s);
      } catch (e) { console.warn('media map', e); }
    }
    const MIME = { mp3: 'audio/mpeg', ogg: 'audio/ogg', oga: 'audio/ogg', opus: 'audio/ogg', wav: 'audio/wav', m4a: 'audio/mp4', aac: 'audio/aac', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif', avif: 'image/avif', svg: 'image/svg+xml', mp4: 'video/mp4', webm: 'video/webm', mov: 'video/quicktime' };
    const keys = Object.keys(media);
    let saved = 0; let batch = [];
    for (const k of keys) {
      const entry = zip.file(k);
      const realName = media[k];
      if (!entry || !realName) continue;
      const bytes = await unzstd(await entry.async('uint8array'));
      const ext = (realName.split('.').pop() || '').toLowerCase();
      batch.push({ name: realName, blob: new Blob([bytes], { type: MIME[ext] || 'application/octet-stream' }) });
      if (batch.length >= 150) { saved += await AnkiMedia.putBatch(batch); batch = []; ankiStatus(`<span class="spinner"></span> 儲存媒體檔 ${saved} / ${keys.length}…`); }
    }
    if (batch.length) saved += await AnkiMedia.putBatch(batch);
    ankiStatus(`讀取完成：${rows.length} 筆筆記${saved ? `、${saved} 個媒體檔` : ''}。請確認下方的欄位對應。`);
    showMapper(name, names, rows, Object.keys(count).length > 1 ? `牌組有 ${Object.keys(count).length} 種筆記類型，只匯入數量最多的一種（${rows.length} 筆）。` : '');
  } catch (e) {
    console.error(e);
    ankiStatus(`<span style="color:var(--bad)">匯入失敗：${esc(e.message || String(e))}</span>`);
  }
}

/* ==========================================================================
   Data safety: persistent storage, backup reminders, daily snapshots (IndexedDB)
   ========================================================================== */
const Snapshots = {
  DB: 'nihongo_quest_snapshots', STORE: 'snaps', KEEP: 7, dbp: null,
  open() {
    if (this.dbp) return this.dbp;
    this.dbp = new Promise(resolve => {
      try {
        if (!('indexedDB' in window)) { resolve(null); return; }
        const req = indexedDB.open(this.DB, 1);
        req.onupgradeneeded = (ev) => { const db = ev.target.result; if (!db.objectStoreNames.contains(this.STORE)) db.createObjectStore(this.STORE); };
        req.onsuccess = (ev) => resolve(ev.target.result);
        req.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
    return this.dbp;
  },
  async tx(mode, fn) {
    const db = await this.open();
    if (!db) return null;
    return new Promise(resolve => {
      try {
        const t = db.transaction(this.STORE, mode);
        const out = fn(t.objectStore(this.STORE));
        t.oncomplete = () => resolve(out && 'result' in out ? out.result : true);
        t.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
  },
  put(date, json) { return this.tx('readwrite', st => st.put(json, date)); },
  get(date) { return this.tx('readonly', st => st.get(date)); },
  keys() { return this.tx('readonly', st => st.getAllKeys()); },
  del(date) { return this.tx('readwrite', st => st.delete(date)); },
  async prune() {
    const keys = ((await this.keys()) || []).map(String).sort();
    for (const k of keys.slice(0, Math.max(0, keys.length - this.KEEP))) await this.del(k);
  }
};

async function requestPersistence() {
  try {
    if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) await navigator.storage.persist();
  } catch (e) { /* not available for this page */ }
}

// one snapshot per day, taken when the app opens, so a bad import or reset can be undone
async function dailySnapshot() {
  try {
    const t = todayStr();
    if (state.lastSnapshot === t) return;
    if (!Object.keys(state.srs).length && !state.vocab.length) return;
    const ok = await Snapshots.put(t, JSON.stringify(state));
    if (!ok) return;
    state.lastSnapshot = t;
    saveState();
    await Snapshots.prune();
  } catch (e) { /* ignore */ }
}

function backupDue() {
  if (streakStats().days < 3) return false;
  if (Sync.status !== 'off' && Sync.meta && Sync.meta.lastSyncedAt && daysBetween(Sync.meta.lastSyncedAt.slice(0, 10), todayStr()) < 7) return false;
  const last = [state.lastBackup, state.backupSnooze].filter(Boolean).sort().pop();
  return !last || daysBetween(last, todayStr()) >= (state.settings.backupEvery || 7);
}
function backupBannerHtml() {
  if (!backupDue()) return '';
  const msg = state.lastBackup ? `距離上次下載備份已經 ${daysBetween(state.lastBackup, todayStr())} 天。` : '你還沒有下載過備份。';
  return `<div class="banner warn"><div class="grow">${msg}進度只存在這個瀏覽器裡，清除瀏覽資料或換電腦時就會不見，建議下載一份備份檔。</div>
    <div class="row-wrap"><button type="button" class="btn btn-sm btn-primary" data-act="backup-now">下載備份</button><button type="button" class="btn btn-sm btn-ghost" data-act="backup-snooze">一週後再提醒</button></div></div>`;
}

/* ==========================================================================
   Local store: IndexedDB key-value (state + sync meta). Falls back to localStorage in saveState when unavailable.
   ========================================================================== */
const Store = {
  DB: 'nihongo_quest_db', STORE: 'kv', dbp: null, available: false,
  open() {
    if (this.dbp) return this.dbp;
    this.dbp = new Promise(resolve => {
      try {
        if (!('indexedDB' in window)) { resolve(null); return; }
        const req = indexedDB.open(this.DB, 1);
        req.onupgradeneeded = (ev) => { const db = ev.target.result; if (!db.objectStoreNames.contains(this.STORE)) db.createObjectStore(this.STORE); };
        req.onsuccess = (ev) => { this.available = true; resolve(ev.target.result); };
        req.onerror = () => resolve(null);
        req.onblocked = () => resolve(null);
      } catch (e) { resolve(null); }
    });
    return this.dbp;
  },
  async get(key) {
    const db = await this.open();
    if (!db) return undefined;
    return new Promise(resolve => {
      try {
        const req = db.transaction(this.STORE).objectStore(this.STORE).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(undefined);
      } catch (e) { resolve(undefined); }
    });
  },
  async set(key, value) {
    const db = await this.open();
    if (!db) return false;
    return new Promise(resolve => {
      try {
        const tx = db.transaction(this.STORE, 'readwrite');
        tx.objectStore(this.STORE).put(value, key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
        tx.onabort = () => resolve(false);
      } catch (e) { resolve(false); }
    });
  }
};

// ---- 85_sync.js ----
/* ==========================================================================
   Cloud sync (Supabase): magic-link login, debounced push, pull on open/foreground/online, last-write-wins.
   Local state is the source of truth; the cloud row is a mirror. API keys never leave the device.
   ========================================================================== */
const Sync = {
  client: null, session: null, email: null, status: 'off', lastError: null, onChange: null,
  meta: null, timer: null, deferred: false, pulling: false, bound: false, conflicted: false,

  setStatus(next) {
    if (this.status === next) return;
    this.status = next;
    if (this.onChange) { try { this.onChange(); } catch (e) { /* ignore */ } }
  },

  // opts.client lets tests inject a fake client; production builds one from NQ_CONFIG.
  async init(opts) {
    opts = opts || {};
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    const cfg = window.NQ_CONFIG || {};
    // PKCE: a magic link only completes in the browser that asked for it, so a link someone else started cannot log this device into their account
    try {
      this.client = opts.client || ((cfg.supabaseUrl && cfg.supabaseAnonKey && window.supabase) ? supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { flowType: 'pkce' } }) : null);
    } catch (e) { console.warn('supabase client not created', e); this.client = null; }
    this.meta = (await Store.get('meta')) || {};
    this.meta = Object.assign({ deviceId: uid('dev'), userId: null, pendingSync: false, lastSyncedAt: null, lastPulledUpdatedAt: null, everSynced: false }, this.meta);
    await Store.set('meta', this.meta);
    if (!this.bound) {
      this.bound = true;
      saveHooks.push(() => Sync.schedulePush());
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { if (Sync.meta && Sync.meta.pendingSync) Sync.push(); } else Sync.pull();
      });
      window.addEventListener('online', () => Sync.pull());
    }
    this.session = null; this.email = null;
    if (!this.client) { this.setStatus('off'); return; }
    this.client.auth.onAuthStateChange((_evt, session) => this.applySession(session));
    try {
      const res = await this.client.auth.getSession();
      this.applySession(res && res.data && res.data.session);
    } catch (e) { this.applySession(null); }
  },

  applySession(session) {
    const had = Boolean(this.session);
    this.session = session || null;
    this.email = session && session.user ? session.user.email : null;
    if (!session) {
      if (this.timer) { clearTimeout(this.timer); this.timer = null; }
      if (this.meta && this.meta.pendingSync) { this.meta.pendingSync = false; Store.set('meta', this.meta); }
      this.setStatus('off');
      return;
    }
    // sync bookkeeping belongs to one account: a different user on this device starts as "never synced"
    if (this.meta.userId !== session.user.id) {
      Object.assign(this.meta, { userId: session.user.id, everSynced: false, pendingSync: false, lastSyncedAt: null, lastPulledUpdatedAt: null });
      Store.set('meta', this.meta);
    }
    if (!had) { this.setStatus('idle'); this.pull(); }   // TOKEN_REFRESHED etc. keep whatever status we are in
  },

  pendingEmail: null,
  async signIn(email) {
    if (!this.client) { toast('尚未設定雲端同步'); return; }
    const addr = SyncCore.normalizeEmail(email);
    if (!addr || !addr.includes('@')) { toast('請輸入正確的 email'); return; }
    const { error } = await this.client.auth.signInWithOtp({ email: addr, options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) { toast('寄送失敗：' + error.message, 5000); return; }
    this.pendingEmail = addr;
    toast('已寄出登入信。在這個 app 裡輸入信中的 8 位數驗證碼，或用同一個瀏覽器點開信裡的連結', 7000);
    if (modalOpen()) refreshSettings();
  },

  async verifyCode(code) {
    if (!this.client || !this.pendingEmail) return;
    const token = String(code || '').replace(/\D/g, '');
    if (token.length < 8) { toast('請輸入信中的 8 位數驗證碼'); return; }
    const { error } = await this.client.auth.verifyOtp({ email: this.pendingEmail, token, type: 'email' });
    if (error) { toast('驗證失敗：' + error.message, 5000); return; }
    this.pendingEmail = null;
    if (modalOpen()) refreshSettings();
  },

  async signOut() {
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    if (this.client) { try { await this.client.auth.signOut(); } catch (e) { /* ignore */ } }
    this.applySession(null);
  },

  async deleteCloud() {
    if (!this.client || !this.session) return;
    const { error } = await this.client.from('progress').delete().eq('user_id', this.session.user.id);
    if (error) { toast('刪除失敗：' + error.message, 5000); return; }
    this.meta.everSynced = false; this.meta.lastPulledUpdatedAt = null; await Store.set('meta', this.meta);
    toast('已刪除雲端資料，本機進度仍保留');
  },

  schedulePush() {
    if (!this.session || !this.client) return;
    this.meta.pendingSync = true; Store.set('meta', this.meta);
    this.setStatus('pending');
    if (this.timer) clearTimeout(this.timer);
    this.timer = setTimeout(() => { this.timer = null; this.push(); }, 2000);
  },

  busy() { return Boolean(SESSION || (EXAM && !EXAM.finished)); },   // never swap state under a running practice or exam (a finished exam only shows its result)

  // Upload is conditional: once this device has synced, the row is only replaced when its updated_at is still the
  // one we last pulled or pushed. Otherwise another device wrote in between and pull() decides (it keeps the
  // cloud copy and snapshots ours). `final` stops a pull→push→pull loop if the condition keeps failing.
  async push(final) {
    const session = this.session; // re-read: a logout during the debounce must cancel the upload
    if (!session || !this.client) return;
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    if (this.conflicted && this.busy()) { this.deferred = true; this.setStatus('pending'); return; }   // already known: wait for the session to end
    this.setStatus('syncing');
    try {
      if (!state.updatedAt) state.updatedAt = new Date().toISOString();   // e.g. right after the localStorage migration
      const payload = Object.assign({ user_id: session.user.id }, SyncCore.buildPushPayload(SyncCore.stripSecrets(state), this.meta.deviceId));
      const base = this.meta.everSynced ? this.meta.lastPulledUpdatedAt : null;
      if (base) {
        const { data, error } = await this.client.from('progress').update(payload).eq('user_id', session.user.id).eq('updated_at', base).select('updated_at');
        if (error) throw error;
        if (!data || !data.length) {
          this.conflicted = true;
          if (final) { this.lastError = '雲端資料與本機不一致，請按「立即同步」'; this.setStatus('error'); return; }
          if (this.busy()) { this.deferred = true; this.setStatus('pending'); return; }
          await this.pull({ afterConflict: true });
          return;
        }
      } else {
        const { error } = await this.client.from('progress').upsert(payload);
        if (error) throw error;
      }
      this.conflicted = false;
      Object.assign(this.meta, { pendingSync: false, lastSyncedAt: new Date().toISOString(), lastPulledUpdatedAt: payload.updated_at, everSynced: true });
      await Store.set('meta', this.meta);
      this.lastError = null; this.setStatus('idle');
    } catch (e) {
      this.lastError = (e && e.message) || String(e); this.setStatus('error');
    }
  },

  async pull(opts) {
    opts = opts || {};
    const session = this.session;
    if (!session || !this.client) return;
    if (this.busy()) { this.deferred = true; return; }
    if (this.pulling) return;
    this.pulling = true;
    let next = null;
    this.setStatus('syncing');
    try {
      const { data, error } = await this.client.from('progress').select('state, updated_at').eq('user_id', session.user.id).maybeSingle();
      if (error) throw error;
      const pick = SyncCore.pullDecision(this.meta, state, data);
      if (pick === 'adopt' || pick === 'conflict') {
        // adopting the cloud over real local progress keeps a copy: first sync as pre-cloud-, a conflict as conflict-
        const snap = pick === 'conflict' ? 'conflict-' : (!this.meta.everSynced && !SyncCore.isEmptyProgress(state)) ? 'pre-cloud-' : null;
        if (snap) { try { await Snapshots.put(snap + todayStr(), JSON.stringify(state)); } catch (e) { /* best effort */ } }
        if (pick === 'conflict') {
          // both sides changed: merge record by record, adopt the merge with the cloud's stamp as base, then upload it
          await this.applyCloud({ state: SyncCore.mergeStates(state, data.state), updated_at: data.updated_at }, true);
          next = 'push';
        } else await this.applyCloud(data);
      } else {
        if (!data) { this.meta.lastPulledUpdatedAt = null; await Store.set('meta', this.meta); }   // row gone (deleted elsewhere): the next push creates it
        next = pick;
      }
    } catch (e) {
      this.lastError = (e && e.message) || String(e); this.setStatus('error');
    } finally { this.pulling = false; }
    if (next === 'push') await this.push(Boolean(opts.afterConflict));
    else if (next === 'idle') this.setStatus('idle');
  },

  async applyCloud(data, conflict) {
    try {
      const next = normalizeState(SyncCore.keepLocalSecrets(data.state, state));
      state = next;
      await Store.set('state', state);   // not saveState(): that would echo the pull straight back to the cloud
      this.conflicted = false;
      Object.assign(this.meta, { pendingSync: false, lastSyncedAt: new Date().toISOString(), lastPulledUpdatedAt: data.updated_at, everSynced: true });
      await Store.set('meta', this.meta);
      buildRegistry(); applyTheme(); applyFurigana();
      if (!modalOpen()) route();
      toast(conflict ? '另一台裝置同時更新了進度，已把兩邊的紀錄合併；合併前的本機版本存成快照（設定 › 資料）。' : '已從雲端更新進度', conflict ? 7000 : undefined);
      this.lastError = null; this.setStatus('idle');
    } catch (e) {
      this.lastError = '雲端資料無法讀取，已保留本機進度'; this.setStatus('error'); toast(this.lastError, 5000);
    }
  },

  flushDeferred() { if (this.deferred) { this.deferred = false; this.pull(); } }
};

// ---- 90_init.js ----
/* ==========================================================================
   Start-up
   ========================================================================== */
function checkDayRollover() {
  if (state.today.date === todayStr()) return;
  state.today = { date: todayStr(), newV: 0, newG: 0, newK: 0, newL: 0, newR: 0 };
  saveState();
  if (!SESSION && !EXAM) route();
}

async function init() {
  await loadState();
  Sync.onChange = renderSyncChip;
  buildRegistry();
  applyTheme();
  applyFurigana();
  document.addEventListener('click', handleClick);
  // first real gesture unlocks the shared audio player (iOS refuses play() on an element that never had one)
  ['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, unlockTtsPlayer, { capture: true, passive: true }));
  document.addEventListener('change', handleChange);
  document.addEventListener('keydown', handleKey);
  window.addEventListener('hashchange', route);
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => { if (modalOpen() && settingsTab === 'speech') refreshSettings(); else if (!modalOpen() && currentRoute().name === 'today' && !SESSION) route(); };
  }
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    if (mq.addEventListener) mq.addEventListener('change', () => { if (state.settings.theme === 'auto') applyTheme(); });
  }
  setInterval(checkDayRollover, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDayRollover(); });
  // another tab saved newer progress: pick it up unless this tab is in the middle of something
  if (STATE_CHANNEL) STATE_CHANNEL.onmessage = async (e) => {
    if (!e.data || e.data.type !== 'saved' || SESSION || EXAM) return;
    const s = await Store.get('state');
    if (!s || s.updatedAt === state.updatedAt) return;
    try { state = normalizeState(s); buildRegistry(); if (!modalOpen()) route(); } catch (err) { /* ignore */ }
  };
  window.addEventListener('beforeunload', (e) => { if (EXAM && !EXAM.finished) { e.preventDefault(); e.returnValue = ''; } });
  if (!location.hash || location.hash === '#') history.replaceState(null, '', '#/today');
  route();
  requestPersistence();
  dailySnapshot();
  registerServiceWorker();
  // cloud sync starts after first paint: restoring an expired session can block on the network for a long time offline
  Sync.init().catch((e) => { console.warn('sync init failed', e); Sync.client = null; Sync.setStatus('off'); });
}

let userWantsUpdate = false;
let updateWorker = null;
function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./sw.js').then((reg) => {
    const promptUpdate = (worker) => {
      updateWorker = worker;
      toast('有新版本可用，點這裡重新整理', 8000);
      setTimeout(() => { if (updateWorker === worker) updateWorker = null; }, 8000);   // a later, unrelated toast must not trigger the update
    };
    document.getElementById('toast').addEventListener('click', () => {
      if (!updateWorker) return;
      userWantsUpdate = true;
      updateWorker.postMessage({ type: 'SKIP_WAITING' });
    });
    if (reg.waiting && navigator.serviceWorker.controller) promptUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) promptUpdate(w);
      });
    });
  }).catch(() => { /* offline or unsupported: app works without it */ });
  let reloading = false;
  // first install also fires controllerchange (clients.claim); only reload when the user accepted an update
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (userWantsUpdate && !reloading) { reloading = true; location.reload(); } });
}
init();

</script>
